<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>一乗寺</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Antique+Soft&family=Noto+Sans+JP:wght@300;400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#f0ece4}
body{font-family:'Noto Sans JP',sans-serif}

#map{position:fixed;inset:0;z-index:1}

.leaflet-tile-pane{
  filter:grayscale(1) brightness(1.45) contrast(0.3);
  opacity:.6;
}

#tint{
  position:fixed;inset:0;z-index:2;
  background:rgba(240,236,228,.18);
  pointer-events:none;
}

.leaflet-control-zoom{display:none!important}
.leaflet-control-attribution{
  font-size:8px!important;opacity:.25!important;
  background:transparent!important;color:#888!important;
}
.leaflet-control-attribution a{color:#888!important}

.w{
  font-family:'Zen Antique Soft',serif;
  color:#000;
  opacity:0;
  cursor:default;
  white-space:nowrap;
  letter-spacing:4px;
  transition:opacity .8s ease-in,transform .5s;
  transform:scale(1);
  text-shadow:
    0 0 20px rgba(240,236,228,.9),
    0 0 40px rgba(240,236,228,.6);
  user-select:none;
  -webkit-user-select:none;
}
.w.visible{opacity:.75}
.w rt{
  font-size:.45em;
  letter-spacing:1px;
  opacity:.7;
}
.w.on{
  opacity:1!important;
  transform:scale(1.12);
  text-shadow:
    0 0 20px rgba(240,236,228,.9),
    0 0 40px rgba(240,236,228,.6),
    0 1px 3px rgba(0,0,0,.08);
}
.w.on rt{opacity:1}
body.focus .w:not(.on){
  opacity:.18!important;
}

#bar{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  padding:22px 32px 26px;
  background:linear-gradient(transparent 0%,rgba(26,26,20,.6) 25%,rgba(26,26,20,.82) 100%);
  color:#F0E4C4;
  transform:translateY(100%);
  opacity:0;
  transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .5s;
  display:flex;align-items:center;gap:24px;
  pointer-events:none;
}
#bar.show{transform:translateY(0);opacity:1}
#bar .bw{
  font-family:'Zen Antique Soft',serif;
  font-size:28px;letter-spacing:8px;flex-shrink:0;
}
#bar .bw rt{font-size:.45em;letter-spacing:1px}
#bar .bd{
  font-size:14px;line-height:1.8;font-weight:300;
  letter-spacing:.5px;color:rgba(240,228,196,.8);
}

#wm{
  position:fixed;top:18px;left:22px;z-index:100;
  pointer-events:none;transition:opacity .5s;
}
#wm .t1{
  font-family:'Zen Antique Soft',serif;
  font-size:16px;letter-spacing:10px;
  color:rgba(26,26,20,.2);
}
#wm .t1 rt{font-size:.5em;letter-spacing:2px}
#wm .t2{
  font-size:9px;letter-spacing:2px;margin-top:3px;
  color:rgba(26,26,20,.13);font-weight:300;
}
body.focus #wm{opacity:.3}

/* shuffle button */
#shuffle{
  position:fixed;bottom:18px;right:18px;z-index:101;
  width:40px;height:40px;border-radius:50%;
  background:rgba(26,26,20,.08);border:1px solid rgba(26,26,20,.1);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .3s,transform .3s;
  color:rgba(26,26,20,.3);font-size:18px;
}
#shuffle:hover{background:rgba(26,26,20,.15);transform:rotate(180deg)}

@media(max-width:600px){
  .w{letter-spacing:2px}
  #bar{padding:16px 20px 22px;flex-direction:column;gap:8px}
  #bar .bw{font-size:22px;letter-spacing:5px}
  #bar .bd{font-size:12px;line-height:1.7}
  #wm{top:12px;left:14px}
  #wm .t1{font-size:14px;letter-spacing:6px}
  #wm .t2{font-size:8px}
  #shuffle{width:36px;height:36px;bottom:14px;right:14px;font-size:16px}
}
</style>
</head>
<body>

<div id="map"></div>
<div id="tint"></div>

<div id="wm">
  <div class="t1"><ruby>一乗寺<rp>(</rp><rt>いちじょうじ</rt><rp>)</rp></ruby></div>
  <div class="t2">京都 — 文化と味が交差する街</div>
</div>

<div id="bar">
  <div class="bw" id="bw"></div>
  <div class="bd" id="bd"></div>
</div>

<button id="shuffle" title="ことばを入れ替える">&#x21bb;</button>

<script>
var LOCAL=[{"t":"ラーメン","r":"らーめん","d":"小麦粉の麺をスープで食べる料理で、一乗寺はラーメンの街として有名だよ。"},{"t":"麺","r":"めん","d":"小麦粉をこねてのばして作る細長い食べもののことだよ。"},{"t":"スープ","r":"すーぷ","d":"ラーメンの味を決める大事な汁のことだよ。"},{"t":"チャーシュー","r":"ちゃーしゅー","d":"豚肉をたれにつけてじっくり焼いたり煮たりしたお肉のことだよ。"},{"t":"煮卵","r":"にたまご","d":"たまごをゆでてからたれにつけて味をしみこませたものだよ。"},{"t":"背脂","r":"せあぶら","d":"豚の背中の脂のことで、ラーメンに浮かべるとこってりするよ。"},{"t":"醤油","r":"しょうゆ","d":"大豆から作られる茶色い調味料で、ラーメンのスープにも使われるよ。"},{"t":"味噌","r":"みそ","d":"大豆を発酵させて作る調味料で、味噌ラーメンの味のもとだよ。"},{"t":"塩","r":"しお","d":"海水から作られる白い調味料で、塩ラーメンはあっさりした味だよ。"},{"t":"太麺","r":"ふとめん","d":"ふつうより太い麺のことで、もちもちした食感が楽しめるよ。"},{"t":"細麺","r":"ほそめん","d":"ふつうより細い麺のことで、スープがよくからむよ。"},{"t":"こってり","r":"こってり","d":"脂が多くて濃い味のことで、一乗寺のラーメンに多いよ。"},{"t":"あっさり","r":"あっさり","d":"脂が少なくてさっぱりした味のことだよ。"},{"t":"替え玉","r":"かえだま","d":"ラーメンの麺だけをおかわりすることだよ。"},{"t":"丼","r":"どんぶり","d":"ラーメンや親子丼を入れる大きくて深いお茶碗のことだよ。"},{"t":"箸","r":"はし","d":"ごはんや麺を食べるときに使う二本の棒のことだよ。"},{"t":"れんげ","r":"れんげ","d":"ラーメンのスープをすくうときに使う小さなスプーンだよ。"},{"t":"のり","r":"のり","d":"海藻を薄くして乾かしたもので、ラーメンにのせることもあるよ。"},{"t":"ねぎ","r":"ねぎ","d":"細く切ってラーメンの上にのせる緑色の野菜だよ。"},{"t":"にんにく","r":"にんにく","d":"香りが強い野菜で、ラーメンに入れるとパンチが出るよ。"},{"t":"もやし","r":"もやし","d":"豆から出た白い芽で、ラーメンの具としてよく使われるよ。"},{"t":"メンマ","r":"めんま","d":"たけのこを発酵させて作ったラーメンの具だよ。"},{"t":"餃子","r":"ぎょうざ","d":"肉と野菜をうすい皮で包んで焼いた料理で、ラーメンと一緒に食べることが多いよ。"},{"t":"唐揚げ","r":"からあげ","d":"鶏肉に味をつけて油で揚げたおかずのことだよ。"},{"t":"炒飯","r":"ちゃーはん","d":"ごはんを卵や具と一緒に炒めた料理だよ。"},{"t":"ラーメン屋","r":"らーめんや","d":"ラーメンを出すお店のことで、一乗寺にはたくさんあるよ。"},{"t":"行列","r":"ぎょうれつ","d":"人が順番にならんで待つことで、人気のラーメン屋にはよくできるよ。"},{"t":"食べ歩き","r":"たべあるき","d":"いろいろなお店をまわりながら食べることだよ。"},{"t":"暖簾","r":"のれん","d":"お店の入り口にかかっている布のことで、お店の目印になるよ。"},{"t":"湯気","r":"ゆげ","d":"熱いラーメンから立ちのぼる白いけむりのようなものだよ。"},{"t":"出汁","r":"だし","d":"昆布やかつお節からとったうまみたっぷりの汁のことだよ。"},{"t":"豚骨","r":"とんこつ","d":"豚の骨をじっくり煮込んで作る白くて濃いスープのことだよ。"},{"t":"鶏ガラ","r":"とりがら","d":"鶏の骨を煮込んで作るスープのもとのことだよ。"},{"t":"味玉","r":"あじたま","d":"味がしっかりしみた半熟のゆでたまごのことだよ。"},{"t":"食券","r":"しょっけん","d":"ラーメン屋で先にきっぷを買って注文する仕組みのことだよ。"},{"t":"大盛り","r":"おおもり","d":"ふつうよりたくさん麺やごはん "ほっぺ","d":"顔のよこにある、ふっくらしたやわらかい部分だよ。"},{"t":"まつげ","r":"まつげ","d":"目のまわりに生えている細い毛のこと。目を守ってくれるよ。"},{"t":"くすぐったい","r":"くすぐったい","d":"わきの下や足のうらをさわられると、思わず笑っちゃう感じだよ。"},{"t":"ねむい","r":"ねむい","d":"目がとじそうになって、お布団に入りたくなる感じだよ。"},{"t":"おなかすいた","r":"おなかすいた","d":"ごはんが食べたくて、おなかがグーッと鳴る感じだよ。"},{"t":"のどかわいた","r":"のどかわいた","d":"お水やジュースが飲みたくなる感じのこと。"},{"t":"まぶたい","r":"まぶたい","d":"お日さまの光がまぶしくて、つい目をつぶっちゃうこと。"},{"t":"こそばい","r":"こそばい","d":"ちょっとくすぐったくて、もぞもぞする感じだよ。"},{"t":"むしむし","r":"むしむし","d":"じめっとして暑い、夏のいやな感じだよ。"},{"t":"からっと","r":"からっと","d":"湿気がなくてさわやかに晴れている様子だよ。"},{"t":"じんわり","r":"じんわり","d":"ゆっくりとあたたかさや気持ちが広がっていくこと。"},{"t":"ずきずき","r":"ずきずき","d":"頭やおなかが脈打つように痛む感じだよ。"},{"t":"うとうと","r":"うとうと","d":"眠くなってきて、頭がこっくりこっくりすること。"},{"t":"よろよろ","r":"よろよろ","d":"ふらふらして、倒れそうに歩いている様子だよ。"},{"t":"へとへと","r":"へとへと","d":"たくさん動いて、もう動けないくらい疲れた様子だよ。"},{"t":"めきめき","r":"めきめき","d":"どんどん上手になっている様子のこと。"},{"t":"すくすく","r":"すくすく","d":"子どもや植物がぐんぐん元気に育つ様子だよ。"},{"t":"きょろきょろ","r":"きょろきょろ","d":"あちこち目を動かして見まわしている様子だよ。"},{"t":"おっかなびっくり","r":"おっかなびっくり","d":"こわいけどやってみたくて、おそるおそる進む様子だよ。"},{"t":"まごまご","r":"まごまご","d":"どうしていいかわからなくて、おろおろしている様子だよ。"},{"t":"うずうず","r":"うずうず","d":"早くやりたくて体がそわそわしてくる気持ちだよ。"},{"t":"つんつん","r":"つんつん","d":"指先でちょんちょんとさわる様子、またはすましている感じ。"},{"t":"さっぱり","r":"さっぱり","d":"お風呂に入ったあとみたいに、すっきりした気持ちだよ。"},{"t":"こんがり","r":"こんがり","d":"パンやお肉がちょうどいい色に焼けている様子だよ。"},{"t":"ほくほく","r":"ほくほく","d":"焼きいもみたいにあつあつでおいしい様子のこと。"},{"t":"しゃきしゃき","r":"しゃきしゃき","d":"レタスやきゅうりをかじったときの歯ごたえの音だよ。"},{"t":"とろとろ","r":"とろとろ","d":"チーズやプリンみたいに、やわらかく溶けている様子だよ。"},{"t":"もりもり","r":"もりもり","d":"ごはんをたくさん元気に食べている様子だよ。"},{"t":"ぺこぺこ","r":"ぺこぺこ","d":"おなかがすいてぐうぐう鳴っている様子だよ。"},{"t":"ゆらゆら","r":"ゆらゆら","d":"ゆっくりとあっちこっちに揺れている様子のこと。"},{"t":"こっくり","r":"こっくり","d":"居眠りしてうなずくように頭が前にかくんと動く様子だよ。"},{"t":"ちょろちょろ","r":"ちょろちょろ","d":"水が少しだけ流れている様子のこと。"},{"t":"ぬくぬく","r":"ぬくぬく","d":"お布団の中みたいにあたたかくて気持ちいい様子だよ。"},{"t":"いそいそ","r":"いそいそ","d":"楽しいことがあるみたいに、うれしそうに準備する様子だよ。"},{"t":"おどおど","r":"おどおど","d":"こわくて不安で、びくびくしている様子だよ。"},{"t":"あたふた","r":"あたふた","d":"急なことがあって、あわてて動き回る様子だよ。"},{"t":"ぽつんと","r":"ぽつんと","d":"ひとりだけで静かにいる、ちょっとさみしい様子だよ。"},{"t":"しみじみ","r":"しみじみ","d":"心の深いところでじんわり感じる、しずかな気持ちだよ。"},{"t":"ぷくぷく","r":"ぷくぷく","d":"水の中から小さなあわが出てくる様子だよ。"},{"t":"ぽろぽろ","r":"ぽろぽろ","d":"涙や小さなものがぱらぱら落ちる様子だよ。"},{"t":"むずむず","r":"むずむず","d":"鼻やのどがくすぐったくて、くしゃみが出そうな感じだよ。"},{"t":"ほろほろ","r":"ほろほろ","d":"クッキーやお菓子が口の中でやわらかく崩れる様子だよ。"}];

/* ── Config ── */
var SHOW_COUNT=35;
var CENTER=[35.0425,135.7870];
var SPREAD_LAT=0.0035;
var SPREAD_LNG=0.0040;
var SIZES=[14,15,16,17,18,19,20,22,24,26];

/* ── Helpers ── */
function rb(t,r){if(t===r)return t;return '<ruby>'+t+'<rp>(</rp><rt>'+r+'</rt><rp>)</rp></ruby>'}
function rand(a,b){return a+Math.random()*(b-a)}
function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;
  }
  return arr;
}
function pick(arr,n){return shuffle(arr.slice()).slice(0,Math.min(n,arr.length))}

/* ── Map ── */
var map=L.map('map',{
  center:CENTER,
  zoom:17,
  zoomControl:false,
  attributionControl:true,
  zoomSnap:0.5,
  maxZoom:19,
  minZoom:16,
  maxBounds:[[CENTER[0]-0.008,CENTER[1]-0.010],[CENTER[0]+0.008,CENTER[1]+0.010]]
});

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'&copy; OpenStreetMap',maxZoom:19
}).addTo(map);

/* subtle boundary */
L.polygon([
  [35.0455,135.7835],[35.0458,135.7870],[35.0455,135.7908],
  [35.0435,135.7915],[35.0400,135.7910],
  [35.0392,135.7880],[35.0395,135.7840],
  [35.0420,135.7830],[35.0445,135.7832]
],{
  color:'rgba(160,140,110,0.12)',weight:1.5,
  fill:true,fillColor:'rgba(160,140,110,0.02)',fillOpacity:1,
  interactive:false
}).addTo(map);

/* ── State ── */
var barEl=document.getElementById('bar');
var bwEl=document.getElementById('bw');
var bdEl=document.getElementById('bd');
var curOn=null;
var markers=[];

/* ── Generate random positions ── */
function genPositions(n){
  var pts=[];
  for(var i=0;i<n;i++){
    var angle=Math.random()*Math.PI*2;
    var radius=Math.sqrt(Math.random());
    pts.push([
      CENTER[0]+Math.cos(angle)*radius*SPREAD_LAT,
      CENTER[1]+Math.sin(angle)*radius*SPREAD_LNG
    ]);
  }
  return pts;
}

/* ── Place words on map ── */
function placeWords(){
  /* dismiss any active state */
  if(curOn){
    curOn.classList.remove('on');
    curOn=null;
    document.body.classList.remove('focus');
    barEl.classList.remove('show');
  }
  /* remove old markers */
  markers.forEach(function(m){map.removeLayer(m)});
  markers=[];

  var nLocal=Math.round(SHOW_COUNT*0.3);
  var nGeneral=SHOW_COUNT-nLocal;
  var chosen=shuffle(pick(LOCAL,nLocal).concat(pick(GENERAL,nGeneral)));
  var positions=genPositions(SHOW_COUNT);

  chosen.forEach(function(w,i){
    var s=SIZES[Math.floor(Math.random()*SIZES.length)];
    var cw=s*1.15;
    var tw=w.t.length*cw+(w.t.length-1)*4;
    var icon=L.divIcon({
      html:'<div class="w" style="font-size:'+s+'px">'+rb(w.t,w.r)+'</div>',
      className:'',
      iconSize:[tw+24,s+20],
      iconAnchor:[(tw+24)/2,(s+20)/2]
    });
    var m=L.marker(positions[i],{icon:icon,interactive:true,keyboard:false}).addTo(map);

    /* stagger fade-in */
    setTimeout(function(){
      var el=getW(m);
      if(el)el.classList.add('visible');
    },100+i*60);

    m.on('mouseover',function(){show(m,w)});
    m.on('mouseout',function(){hide(m)});
    m.on('click',function(e){
      L.DomEvent.stopPropagation(e);
      if(curOn===getW(m)){hide(m)} else {show(m,w)}
    });

    markers.push(m);
  });
}

function getW(m){return m.getElement()?m.getElement().querySelector('.w'):null}

function show(m,w){
  var el=getW(m);if(!el)return;
  if(curOn&&curOn!==el)curOn.classList.remove('on');
  curOn=el;
  el.classList.add('on');
  document.body.classList.add('focus');
  bwEl.innerHTML=rb(w.t,w.r);
  bdEl.textContent=w.d;
  barEl.classList.add('show');
}

function hide(m){
  var el=getW(m);if(!el)return;
  el.classList.remove('on');
  if(curOn===el){
    curOn=null;
    document.body.classList.remove('focus');
    barEl.classList.remove('show');
  }
}

map.on('click',function(){
  if(curOn){
    curOn.classList.remove('on');
    curOn=null;
    document.body.classList.remove('focus');
    barEl.classList.remove('show');
  }
});

/* ── Shuffle button ── */
document.getElementById('shuffle').addEventListener('click',function(e){
  e.stopPropagation();
  placeWords();
});

/* ── Initial placement ── */
placeWords();
</script>
