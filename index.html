のこと。","s":"まだ見ぬ未来が、地図の外で待っている。"},{"t":"成長","r":"せいちょう","d":"体が大きくなったり、できることが増えたりすること。","s":"小さな靴が、子どもの成長を教えてくれる。"},{"t":"変化","r":"へんか","d":"前とはちがう様子になること。","s":"空の色は、一日のうちに何度も変化する。"},{"t":"季節","r":"きせつ","d":"春・夏・秋・冬のように、一年の中でうつりかわる時期のこと。","s":"木々の色が、また新しい季節を知らせる。"},{"t":"衣替え","r":"ころもがえ","d":"季節に合わせて、着る服を変えること。","s":"衣替えのたびに、去年の夏の匂いがする。"},{"t":"模様替え","r":"もようがえ","d":"部屋の中の家具を動かして、気分を変えること。","s":"部屋の模様替えで、朝の光の入り方が変わった。"},{"t":"一瞬","r":"いっしゅん","d":"まばたきするくらい、とても短い時間のこと。","s":"花火が咲くのは、ほんの一瞬のできごとだ。"},{"t":"永遠","r":"えいえん","d":"終わりがなくて、ずっとずっと続くこと。","s":"このままずっと続けばいいと、永遠を願う。"},{"t":"記念日","r":"きねんび","d":"大切なことがあった日を、毎年お祝いする日のこと。","s":"カレンダーの記念日に、小さな丸をつける。"},{"t":"誕生日","r":"たんじょうび","d":"自分が生まれた日を、毎年お祝いする日のこと。","s":"誕生日の朝は、いつもより特別な光がさす。"},{"t":"日曜日","r":"にちようび","d":"一週間の最後の日で、学校がお休みの日のこと。","s":"のんびりした日曜日は、時間もゆっくり流れる。"},{"t":"半分","r":"はんぶん","d":"全部をふたつに分けた、かたっぽのこと。","s":"りんごを半分に分けて、二人で仲良く食べる。"},{"t":"始まり","r":"はじまり","d":"ものごとがスタートするところのこと。","s":"一歩を踏み出すことが、いつも始まりになる。"},{"t":"終わり","r":"おわり","d":"ものごとがおしまいになるところのこと。","s":"夏休みの終わりに、蝉の声が静かになる。"},{"t":"途中","r":"とちゅう","d":"始まりと終わりの間で、まだ続いているところのこと。","s":"帰り道の途中で、きれいな夕焼けに出会った。"},{"t":"新幹線","r":"しんかんせん","d":"とても速く走る、長い電車のこと。","s":"新幹線が、窓の景色を光の帯に変えていく。"},{"t":"パトカー","r":"ぱとかー","d":"おまわりさんが乗る、赤い光がつく車のこと。","s":"遠くでパトカーの音が、静かに近づいてくる。"},{"t":"消防車","r":"しょうぼうしゃ","d":"火事の時にかけつける、赤い色の大きな車のこと。","s":"真っ赤な消防車が、勢いよく走りぬけていく。"},{"t":"救急車","r":"きゅうきゅうしゃ","d":"けがや病気の人を病院に運ぶ、白い車のこと。","s":"救急車のサイレンが、町の静けさをやぶる。"},{"t":"ヘリコプター","r":"へりこぷたー","d":"プロペラをぐるぐる回して空を飛ぶ乗り物のこと。","s":"空高くヘリコプターが、小さな点になって飛ぶ。"},{"t":"ロケット","r":"ろけっと","d":"宇宙に向かってびゅーんと飛んでいく乗り物のこと。","s":"ロケットが、白い煙をひいて空へ消えていく。"},{"t":"三輪車","r":"さんりんしゃ","d":"車輪が三つある、小さい子が乗る乗り物のこと。","s":"三輪車のベルが、路地に小さく響いている。"},{"t":"馬車","r":"ばしゃ","d":"馬がひっぱって走る、昔の乗り物のこと。","s":"昔話の馬車が、月夜の道を静かに走る。"},{"t":"潜水艦","r":"せんすいかん","d":"海の中にもぐって進むことができる乗り物のこと。","s":"深い海の底を、潜水艦がそっと進んでいく。"},{"t":"トラック","r":"とらっく","d":"荷物をたくさん運ぶ、大きな車のこと。","s":"大きなトラックが、朝の荷物を運んでいく。"},{"t":"タクシー","r":"たくしー","d":"行きたい場所まで連れて行ってくれる車のこと。","s":"夜のタクシーが、街灯の下を静かに通り過ぎる。"},{"t":"ボート","r":"ぼーと","d":"オールでこいで水の上を進む、小さな船のこと。","s":"小さなボートが、湖の上でゆらゆら揺れる。"},{"t":"気球","r":"ききゅう","d":"大きなふくろに空気を入れて、ふわっと空に浮かぶ乗り物のこと。","s":"気球がふわりと、空の高さへのぼっていく。"},{"t":"そり","r":"そり","d":"雪の上をすーっとすべって進む乗り物のこと。","s":"雪のそりが、白い坂をすべりおりていく。"},{"t":"一輪車","r":"いちりんしゃ","d":"車輪がひとつだけの、バランスをとって乗る乗り物のこと。","s":"一輪車に乗る子の影が、夕日にのびていく。"},{"t":"路面電車","r":"ろめんでんしゃ","d":"道路の上を走る、小さくてかわいい電車のこと。","s":"路面電車が、町の角をゆっくり曲がっていく。"},{"t":"蒸気機関車","r":"じょうききかんしゃ","d":"煙をもくもく出しながら走る、昔の電車のこと。","s":"蒸気機関車が、白い煙を空へ吐き出していく。"},{"t":"ゴンドラ","r":"ごんどら","d":"ケーブルにぶら下がって山の上まで運んでくれる乗り物のこと。","s":"山の上のゴンドラから、町が小さく見える。"},{"t":"ヨット","r":"よっと","d":"風の力で水の上を進む、帆がある船のこと。","s":"白いヨットが、風をうけて海を渡っていく。"},{"t":"モノレール","r":"ものれーる","d":"一本のレールの上を走る電車のこと。","s":"モノレールが、街の上をすべるように走る。"},{"t":"宇宙","r":"うちゅう","d":"地球の外に広がる、とてもとても広い場所のこと。","s":"夜空を見上げると、宇宙の広さにめまいがする。"},{"t":"地球","r":"ちきゅう","d":"わたしたちが住んでいる、青くてまるい星のこと。","s":"この地球のどこかで、今も誰かが笑っている。"},{"t":"惑星","r":"わくせい","d":"太陽のまわりをぐるぐる回っている大きな星のこと。","s":"夜空にならぶ惑星が、静かに光を放っている。"},{"t":"火星","r":"かせい","d":"赤い色をしている、地球のおとなりの星のこと。","s":"赤く光る火星を、望遠鏡でそっとのぞいてみる。"},{"t":"土星","r":"どせい","d":"きれいな輪っかがある、人気の星のこと。","s":"土星の輪が、望遠鏡の中で静かに浮かんでいる。"},{"t":"木星","r":"もくせい","d":"太陽のまわりを回る星の中でいちばん大きい星のこと。","s":"一番大きな木星が、夜空にどっしり構えている。"},{"t":"流れ星","r":"ながれぼし","d":"夜空をすーっと光りながら走る星のこと。","s":"流れ星が消える前に、願いごとを唱える。"},{"t":"天の川","r":"あまのがわ","d":"夜空に見える、星がたくさん集まった白い帯のこと。","s":"天の川のたもとで、織姫と彦星が待っている。"},{"t":"星座","r":"せいざ","d":"星をつないで動物や人の形に見立てたもののこと。","s":"夏の夜空に、大きな星座が描かれている。"},{"t":"日食","r":"にっしょく","d":"月が太陽をかくして、昼なのに暗くなるめずらしいこと。","s":"空が少し暗くなり、日食が静かに始まった。"},{"t":"月食","r":"げっしょく","d":"地球のかげで月が暗くなるめずらしいこと。","s":"月食の夜、月がゆっくり赤く染まっていく。"},{"t":"三日月","r":"みかづき","d":"細くて弓のような形をした月のこと。","s":"細い三日月が、夜空にそっと弓をかける。"},{"t":"満月","r":"まんげつ","d":"まんまるに明るく光っている月のこと。","s":"まんまるの満月が、夜道をやさしく照らす。"},{"t":"北極星","r":"ほっきょくせい","d":"いつも北の方角で光っている、目印になる星のこと。","s":"北極星をたよりに、旅人は道をさがす。"},{"t":"天文台","r":"てんもんだい","d":"大きな望遠鏡で星を観察する建物のこと。","s":"山の上の天文台で、星の声を聞いてみる。"},{"t":"プラネタリウム","r":"ぷらねたりうむ","d":"建物の中で本物みたいな星空を映してくれる場所のこと。","s":"プラネタリウムの闇に、無数の星が生まれる。"},{"t":"隕石","r":"いんせき","d":"宇宙から地球に落ちてくる石のこと。","s":"夜空の端を、隕石がひとすじ光って消えた。"},{"t":"人工衛星","r":"じんこうえいせい","d":"人が作って宇宙に飛ばした、地球のまわりを回る機械のこと。","s":"夜空にぽつんと光る点は、人工衛星の旅かもしれない。"},{"t":"銀河","r":"ぎんが","d":"たくさんの星が集まった、とても大きなグループのこと。","s":"見上げれば、銀河が静かに川のように流れていた。"},{"t":"宇宙飛行士","r":"うちゅうひこうし","d":"ロケットに乗って宇宙に行くお仕事の人のこと。","s":"いつか大きくなったら、宇宙飛行士になりたいと思った。"},{"t":"ほうき星","r":"ほうきぼし","d":"長いしっぽをひいて空を飛ぶ、めずらしい星のこと。","s":"空の向こうを、ほうき星がすっと通り過ぎた。"},{"t":"日時計","r":"ひどけい","d":"太陽の影の向きで時間がわかる、昔の時計のこと。","s":"庭の日時計が、静かに時間を教えてくれる。"},{"t":"星空","r":"ほしぞら","d":"星がたくさん輝いている、きれいな夜の空のこと。","s":"山の上に広がる星空を、みんなで見上げた。"},{"t":"天体","r":"てんたい","d":"宇宙にある星や月や太陽など、全部をまとめた言葉のこと。","s":"望遠鏡をのぞくと、遠い天体がきらりと光った。"},{"t":"半月","r":"はんげつ","d":"半分だけ光っている月のこと。","s":"夜道を歩くと、半月がそっと道を照らしていた。"},{"t":"てんとう虫","r":"てんとうむし","d":"赤い体に黒い点がある、小さくてかわいい虫のこと。","s":"葉っぱの上を、てんとう虫がゆっくり歩いていく。"},{"t":"蝶","r":"ちょう","d":"きれいなはねでひらひら飛ぶ虫のこと。","s":"花から花へ、蝶がふわりと舞っていった。"},{"t":"クワガタ","r":"くわがた","d":"はさみのような大きなあごがある虫のこと。","s":"夏の木陰で、クワガタを見つけて心が躍った。"},{"t":"バッタ","r":"ばった","d":"長い足でぴょんぴょん跳ぶ緑色の虫のこと。","s":"草むらから、バッタがぴょんと飛び出した。"},{"t":"ミミズ","r":"みみず","d":"土の中にいる、足がない長い生き物のこと。","s":"雨上がりの土から、ミミズがそっと顔を出す。"},{"t":"カタツムリ","r":"かたつむり","d":"くるくるのからを背中に乗せて、ゆっくり歩く生き物のこと。","s":"葉っぱの上を、カタツムリがゆっくり進んでいく。"},{"t":"クモ","r":"くも","d":"糸を出してきれいな巣を作る、足が八本の生き物のこと。","s":"朝の光に、クモの糸がきらきら光っていた。"},{"t":"コオロギ","r":"こおろぎ","d":"秋の夜にコロコロと鳴く虫のこと。","s":"秋の夜、コオロギの声が静かに響いていた。"},{"t":"スズムシ","r":"すずむし","d":"鈴のようなきれいな声で鳴く、秋の虫のこと。","s":"縁側で聞く、スズムシの音色がやさしく響く。"},{"t":"カマキリ","r":"かまきり","d":"前あしがカマのような形をしている、かっこいい虫のこと。","s":"草の間に、カマキリがじっと立っていた。"},{"t":"毛虫","r":"けむし","d":"体中に毛が生えている、蝶やガの赤ちゃんのこと。","s":"葉の裏で、毛虫がゆっくり丸くなっていた。"},{"t":"さなぎ","r":"さなぎ","d":"いもむしが蝶になる前の、じっとしている姿のこと。","s":"枝にぶら下がる、さなぎが静かに時を待つ。"},{"t":"幼虫","r":"ようちゅう","d":"虫の赤ちゃんのことで、大人とはぜんぜんちがう形をしているよ。","s":"土の中で、幼虫がじっと育っていく。"},{"t":"おたまじゃくし","r":"おたまじゃくし","d":"カエルの赤ちゃんで、しっぽを使って泳ぐ黒い生き物のこと。","s":"田んぼの水の中を、おたまじゃくしが泳いでいる。"},{"t":"ザリガニ","r":"ざりがに","d":"はさみを持った、川にいる赤い生き物のこと。","s":"小川のそばで、ザリガニをそっとつかまえた。"},{"t":"メダカ","r":"めだか","d":"小川や池にいる、とても小さいかわいい生き物のこと。","s":"水槽の中を、メダカが群れになって泳ぐ。"},{"t":"ヤドカリ","r":"やどかり","d":"貝がらをおうちにして暮らしている、海の生き物のこと。","s":"波打ち際で、ヤドカリが殻を探していた。"},{"t":"クラゲ","r":"くらげ","d":"海の中をゆらゆら泳ぐ、透き通った生き物のこと。","s":"海の中を、クラゲがふわふわと漂っていく。"},{"t":"タニシ","r":"たにし","d":"田んぼや池の底にいる、小さな巻貝のこと。","s":"田んぼの底に、タニシがそっと隠れている。"},{"t":"イモリ","r":"いもり","d":"水辺にいる、おなかが赤い小さな生き物のこと。","s":"池のふちで、イモリがじっと日を浴びていた。"},{"t":"カイコ","r":"かいこ","d":"糸を出してまゆを作る、白い虫のこと。","s":"桑の葉を、カイコが静かに食べていた。"},{"t":"笑い","r":"わらい","d":"おもしろい時に出る、にこにこした気持ちのこと。","s":"教室に広がる笑いが、窓の外まで届いた。"},{"t":"眠り","r":"ねむり","d":"目を閉じて、ぐっすり休むこと。","s":"布団に入ると、深い眠りがそっと訪れる。"},{"t":"走り","r":"はしり","d":"足を速く動かして前に進むこと。","s":"夕焼けの道を、子どもたちの走りが駆け抜けた。"},{"t":"遊び","r":"あそび","d":"楽しいことをして過ごすこと。","s":"公園でのちいさな遊びが、一日を輝かせる。"},{"t":"踊り","r":"おどり","d":"音楽に合わせて体を動かすこと。","s":"祭りの夜、みんなの踊りが輪になって続く。"},{"t":"祈り","r":"いのり","d":"心の中で強くお願いすること。","s":"静かな朝に、小さな祈りをそっとささげた。"},{"t":"輝き","r":"かがやき","d":"きらっとまぶしく光ること。","s":"朝日が水面にあたり、輝きがこぼれ落ちた。"},{"t":"響き","r":"ひびき","d":"音がまわりに広がっていくこと。","s":"山にこだまする響きが、心にそっと残った。"},{"t":"香り","r":"かおり","d":"花やごはんから出る、いいにおいのこと。","s":"風にのって、花の香りがふわりと届いた。"},{"t":"泳ぎ","r":"およぎ","d":"水の中で手や足を動かして進むこと。","s":"夏の川で、子どもたちの泳ぎが弾けていた。"},{"t":"登り","r":"のぼり","d":"高いところへ上がっていくこと。","s":"坂道の登りを、二人並んで歩いていく。"},{"t":"光","r":"ひかり","d":"暗いところを明るくてらしてくれるもののこと。","s":"木の間からこぼれる光が、道をやさしく照らす。"},{"t":"歌","r":"うた","d":"メロディーにのせて声を出して楽しむもののこと。","s":"窓の外から、誰かの歌が風にのって聞こえた。"},{"t":"休み","r":"やすみ","d":"がんばったあとに、ほっとひと息つくこと。","s":"木陰でのひとときの休みが、心をほぐしてくれる。"},{"t":"帰り","r":"かえり","d":"出かけた場所から、おうちに戻ること。","s":"夕暮れの帰り道、影が長く伸びていた。"},{"t":"迎え","r":"むかえ","d":"来てくれる人を待って会いに行くこと。","s":"駅の改札で、母の迎えがそっと待っていた。"},{"t":"集まり","r":"あつまり","d":"みんなが一つの場所にいっしょに来ること。","s":"公園に子どもたちの集まりが、輪をつくっていた。"},{"t":"贈り物","r":"おくりもの","d":"大切な人にあげる、気持ちのこもったもののこと。","s":"小さな贈り物が、心をあたたかくした。"},{"t":"落とし物","r":"おとしもの","d":"うっかり落としてなくしてしまったもののこと。","s":"道に落ちた落とし物を、そっと拾い上げた。"},{"t":"忘れ物","r":"わすれもの","d":"持っていくのを忘れてしまったもののこと。","s":"教室の机に、忘れ物がぽつんと残っていた。"},{"t":"ささやき","r":"ささやき","d":"だれかの耳もとで小さな声でそっと話すこと。","s":"夜風にのって、木々のささやきが聞こえてくる。"},{"t":"ほほえみ","r":"ほほえみ","d":"やさしくにこっとわらうこと。","s":"母のほほえみが、朝の光のように優しかった。"},{"t":"いたずら","r":"いたずら","d":"ちょっとしたいじわるやおふざけをすること。","s":"弟の小さないたずらに、みんなで笑い合った。"},{"t":"あくび","r":"あくび","d":"ねむい時に口が大きく開いてしまうこと。","s":"授業の途中で、思わずあくびがこぼれた。"},{"t":"くしゃみ","r":"くしゃみ","d":"鼻がむずむずして、ハクション！と出ること。","s":"冬の朝、大きなくしゃみが部屋に響いた。"},{"t":"ため息","r":"ためいき","d":"つかれた時やがっかりした時に、はぁっと息をつくこと。","s":"宿題を前に、小さなため息がこぼれた。"},{"t":"手作り","r":"てづくり","d":"自分の手で気持ちをこめて作ること。","s":"母の手作りのお弁当が、今日もうれしい。"},{"t":"お手伝い","r":"おてつだい","d":"おうちの人の仕事をいっしょにやってあげること。","s":"夕飯の支度で、少しだけお手伝いをした。"},{"t":"飾り","r":"かざり","d":"きれいに見えるように何かをつけること。","s":"窓辺に置いた飾りが、光を受けて揺れていた。"},{"t":"目覚め","r":"めざめ","d":"ぐっすり寝ていたあと、パッと目が開くこと。","s":"小鳥の声とともに、朝の目覚めがやってきた。"},{"t":"語り","r":"かたり","d":"みんなの前でゆっくりお話をすること。","s":"おじいちゃんの語りに、みんな耳を傾けた。"},{"t":"つながり","r":"つながり","d":"人と人が関わり合って、仲よくなること。","s":"友だちとのつながりが、今日も心を温める。"},{"t":"滑り","r":"すべり","d":"つるっとすべって動くこと。","s":"氷の上で、思わず足の滑りに驚いた。"},{"t":"揺れ","r":"ゆれ","d":"ゆらゆらと右や左に動くこと。","s":"電車のかすかな揺れに、うとうと眠った。"},{"t":"しゃっくり","r":"しゃっくり","d":"おなかがひくっとなって、ヒック！と音が出ること。","s":"急いで水を飲んだら、しゃっくりが止まらない。"},{"t":"見守り","r":"みまもり","d":"大切な人をそっと見ていて、守ってあげること。","s":"遠くからそっと見守りながら、母は微笑んでいた。"},{"t":"思い出","r":"おもいで","d":"前にあった楽しいことを思い出す、大切な記憶のこと。","s":"夏休みの思い出が、写真の中で光っている。"},{"t":"まばたき","r":"まばたき","d":"目をぱちぱちと開けたり閉じたりすること。","s":"星を見上げると、まばたきの間に流れ星が消えた。"},{"t":"おしゃべり","r":"おしゃべり","d":"友だちと楽しくたくさんお話すること。","s":"縁側でのおしゃべりが、夕暮れまで続いた。"},{"t":"うなずき","r":"うなずき","d":"わかったよという気持ちで、こくんと頭を動かすこと。","s":"先生の言葉に、小さなうなずきを返した。"},{"t":"すべすべ","r":"すべすべ","d":"さわるとつるっとして気持ちいい様子のこと。","s":"川で拾った石は、すべすべとした手触りだった。"},{"t":"ごつごつ","r":"ごつごつ","d":"石みたいにかたくてでこぼこしている様子のこと。","s":"山道の岩は、ごつごつとして力強かった。"},{"t":"べとべと","r":"べとべと","d":"さわると手にくっつく感じがする様子のこと。","s":"溶けたアイスで、手がべとべとになった。"},{"t":"ぷにぷに","r":"ぷにぷに","d":"さわるとやわらかくてぷよぷよしている様子のこと。","s":"赤ちゃんのほっぺは、ぷにぷにとやわらかい。"},{"t":"かちかち","r":"かちかち","d":"とてもかたくて曲がらない様子のこと。","s":"冷たい風に、手がかちかちに固まった。"},{"t":"ぽこぽこ","r":"ぽこぽこ","d":"小さなふくらみがいくつもある様子のこと。","s":"雲が空に、ぽこぽこと浮かんで流れていく。"},{"t":"ひんやり","r":"ひんやり","d":"少しだけ冷たくて気持ちいい様子のこと。","s":"木陰に入ると、ひんやりとした風が頬をなでた。"},{"t":"ぱりぱり","r":"ぱりぱり","d":"うすくてかたくて、割るとパリッと音がする様子のこと。","s":"焼きたてのパンは、ぱりぱりと音を立てた。"},{"t":"もちもち","r":"もちもち","d":"おもちみたいにやわらかくて伸びる様子のこと。","s":"つきたてのお餅は、もちもちとして温かい。"},{"t":"ぺたぺた","r":"ぺたぺた","d":"手でさわるとぺたっとくっつく感じがする様子のこと。","s":"素足で歩くと、床がぺたぺたと音を立てた。"},{"t":"ふかふか","r":"ふかふか","d":"やわらかくて、体がしずむくらい気持ちいい様子のこと。","s":"干したばかりの布団は、ふかふかで気持ちいい。"},{"t":"ぐにゃぐにゃ","r":"ぐにゃぐにゃ","d":"やわらかくて形が自由に変わる様子のこと。","s":"熱で溶けたろうそくが、ぐにゃぐにゃに曲がった。"},{"t":"とげとげ","r":"とげとげ","d":"とがったものがたくさん出ている様子のこと。","s":"栗のいがは、とげとげしていて痛かった。"},{"t":"じめじめ","r":"じめじめ","d":"湿っていてべたつく感じがする様子のこと。","s":"梅雨の空気は、じめじめとして重たかった。"},{"t":"かさかさ","r":"かさかさ","d":"乾いていて、さわるとカサカサ音がする様子のこと。","s":"落ち葉を踏むと、かさかさと音が鳴った。"},{"t":"ねばねば","r":"ねばねば","d":"のりみたいに伸びてくっつく様子のこと。","s":"納豆をかき混ぜると、ねばねばと糸を引いた。"},{"t":"ぷるぷる","r":"ぷるぷる","d":"ゼリーみたいにやわらかくふるえる様子のこと。","s":"冷やしたゼリーが、ぷるぷると揺れていた。"},{"t":"しゃりしゃり","r":"しゃりしゃり","d":"かき氷みたいに、かむとシャリシャリ音がする様子のこと。","s":"かき氷を食べると、しゃりしゃりと音がした。"},{"t":"ひな祭り","r":"ひなまつり","d":"3月3日にお人形を飾って女の子をお祝いする日のこと。","s":"三月になると、ひな祭りの人形が飾られる。"},{"t":"おみこし","r":"おみこし","d":"お祭りでみんなでかついで歩く、きらびやかな乗り物のこと。","s":"夏祭りの夜、おみこしが街を練り歩いた。"},{"t":"折り紙","r":"おりがみ","d":"紙を折って動物や花の形を作るあそびのこと。","s":"雨の日は、折り紙で鶴を折って過ごした。"},{"t":"お年玉","r":"おとしだま","d":"お正月に大人からもらう、うれしいお金のこと。","s":"正月の朝、お年玉をもらって心が弾んだ。"},{"t":"お雑煮","r":"おぞうに","d":"お正月に食べる、おもちが入った温かいスープのこと。","s":"元日の朝は、あたたかいお雑煮を食べる。"},{"t":"うちわ","r":"うちわ","d":"手であおいで涼しい風を送る、平たい道具のこと。","s":"夏の夜、うちわで風を送りながら涼んだ。"},{"t":"正座","r":"せいざ","d":"足をきちんと折りたたんですわること。","s":"畳の上で、静かに正座をして話を聞いた。"},{"t":"ふろしき","r":"ふろしき","d":"ものを包んで持ち運ぶ、大きな四角い布のこと。","s":"母は昔ながらのふろしきで荷物を包んだ。"},{"t":"かるた","r":"かるた","d":"読まれた札をすばやく取り合う、お正月のあそびのこと。","s":"お正月には、家族でかるたを楽しんだ。"},{"t":"福笑い","r":"ふくわらい","d":"目かくしして顔のパーツを置く、おもしろいお正月あそびのこと。","s":"目隠しをして、福笑いに家族が笑い転げた。"},{"t":"鳥居","r":"とりい","d":"神社の入り口にある、赤い大きな門のこと。","s":"山道の奥に、小さな鳥居がひっそり立っていた。"},{"t":"おせち","r":"おせち","d":"お正月に食べる、いろいろなおかずが入った特別なお料理のこと。","s":"お重に詰まったおせちが、正月の食卓を彩る。"},{"t":"紙芝居","r":"かみしばい","d":"絵をめくりながらお話をする、昔ながらの楽しいもののこと。","s":"公園の隅で、紙芝居がゆっくり始まった。"},{"t":"ちゃぶ台","r":"ちゃぶだい","d":"和室で使う、低くて丸いテーブルのこと。","s":"家族が囲むちゃぶ台に、湯気が立ちのぼる。"},{"t":"くもり","r":"くもり","d":"空が雲でおおわれて、太陽が見えない天気のこと。","s":"空はくもりで、光がやわらかく広がっていた。"},{"t":"晴れ","r":"はれ","d":"空に雲が少なくて、太陽が出ている気持ちいい天気のこと。","s":"朝起きると、空は気持ちよく晴れていた。"},{"t":"晴れ間","r":"はれま","d":"雨や雲の間から青い空がちょっとのぞくこと。","s":"雨雲の隙間から、晴れ間がそっとのぞいた。"},{"t":"にわか雨","r":"にわかあめ","d":"急に降り出して、すぐにやむ雨のこと。","s":"帰り道の途中で、にわか雨に降られてしまった。"},{"t":"大雨","r":"おおあめ","d":"たくさんの雨がざーっと降ること。","s":"昨夜からの大雨で、川の水が増えていた。"},{"t":"小雨","r":"こさめ","d":"しとしと静かに降る、弱い雨のこと。","s":"傘もささずに、小雨の中を歩いてみた。"},{"t":"吹雪","r":"ふぶき","d":"雪と強い風がいっしょに吹く、とても寒い天気のこと。","s":"窓の外は真っ白な吹雪に包まれていた。"},{"t":"霧","r":"きり","d":"まわりが白くぼんやりして、遠くが見えなくなること。","s":"朝の山道は、深い霧に包まれていた。"},{"t":"露","r":"つゆ","d":"朝、草の上にできるきらきらした小さな水のつぶのこと。","s":"早朝の草の葉に、露が静かに光っていた。"},{"t":"梅雨","r":"つゆ","d":"6月ごろの、雨がたくさん降り続く時期のこと。","s":"じめじめとした梅雨の空を、あじさいが彩る。"},{"t":"そよ風","r":"そよかぜ","d":"やさしくふわっと吹く、気持ちいい風のこと。","s":"頬をなでるそよ風が、夏の匂いを運んできた。"},{"t":"突風","r":"とっぷう","d":"急にびゅーっと強く吹く風のこと。","s":"急な突風に、帽子が飛ばされそうになった。"},{"t":"日差し","r":"ひざし","d":"太陽から降りそそぐ、あたたかい光のこと。","s":"窓辺に差し込む日差しが、部屋を暖めた。"},{"t":"木枯らし","r":"こがらし","d":"秋の終わりから冬に吹く、冷たい風のこと。","s":"冷たい木枯らしが、落ち葉を舞い上げた。"},{"t":"入道雲","r":"にゅうどうぐも","d":"夏の空にもくもくと高く広がる、大きな白い雲のこと。","s":"夏の空に、大きな入道雲がもくもく育つ。"},{"t":"うろこ雲","r":"うろこぐも","d":"魚のうろこみたいに小さな雲がたくさん並んでいること。","s":"秋の空には、うろこ雲が静かに広がっていた。"},{"t":"ひょう","r":"ひょう","d":"空から降ってくる、かたい氷のつぶのこと。","s":"突然の空から、ひょうがぱらぱらと降ってきた。"},{"t":"夕立","r":"ゆうだち","d":"夏の夕方に急にザーッと降る、強い雨のこと。","s":"昼下がりに、激しい夕立が地面を叩いた。"},{"t":"氷柱","r":"つらら","d":"冬に屋根からぶら下がる、細長い氷のこと。","s":"屋根の端に、長い氷柱がきらきら光っていた。"},{"t":"快晴","r":"かいせい","d":"雲がひとつもなくて、気持ちよく晴れている天気のこと。","s":"遠足の朝は、雲ひとつない快晴だった。"},{"t":"天気予報","r":"てんきよほう","d":"明日の天気がどうなるか調べて教えてくれること。","s":"明日の天気予報を見て、傘の準備をした。"},{"t":"もや","r":"もや","d":"朝にうすい霧が出て、まわりがぼんやり白くなること。","s":"川の上には、薄いもやが漂っていた。"},{"t":"春一番","r":"はるいちばん","d":"春になって最初に吹く、強くてあたたかい風のこと。","s":"三月のある日、春一番が街を駆け抜けた。"},{"t":"五月晴れ","r":"さつきばれ","d":"5月のすっきり晴れた、気持ちいい天気のこと。","s":"気持ちのいい五月晴れの空を、鯉のぼりが泳ぐ。"},{"t":"小春日和","r":"こはるびより","d":"秋の終わりにやってくる、ぽかぽかあたたかい日のこと。","s":"冬なのに暖かい、小春日和の午後を散歩した。"},{"t":"ばたばた","r":"ばたばた","d":"いそがしくて走り回っている様子のことだよ。","s":"出かける前の朝は、いつもばたばたと忙しい。"},{"t":"ひそひそ","r":"ひそひそ","d":"小さな声でこっそり話をする様子のこと。","s":"教室の後ろで、ひそひそと話す声が聞こえた。"},{"t":"げらげら","r":"げらげら","d":"おなかをかかえるくらい大きな声で笑う様子のこと。","s":"面白い話に、みんなでげらげらと笑い合った。"},{"t":"がやがや","r":"がやがや","d":"たくさんの人がいっぺんに話してさわがしい様子だよ。","s":"休み時間の教室は、がやがやとにぎやかだった。"},{"t":"かたい","r":"かたい","d":"石みたいにぎゅっと押しても形が変わらないこと。","s":"焼きたてのパンの皮は、かたいのに香ばしい。"},{"t":"手紙","r":"てがみ","d":"気持ちを文字に書いて誰かに届けるものだよ。","s":"遠くの友だちに、久しぶりの手紙を書いた。"},{"t":"風船","r":"ふうせん","d":"息や空気を入れるとふくらんで浮かぶよ。","s":"風船が空に向かって、ふわりと飛んでいった。"},{"t":"帽子","r":"ぼうし","d":"頭にかぶって太陽やさむさから守ってくれるもの。","s":"麦わらの帽子が、風にさらわれそうになった。"},{"t":"傘","r":"かさ","d":"雨の日にさして体がぬれないようにする道具だよ。","s":"雨の日、赤い傘が道を彩っていた。"},{"t":"鉛筆","r":"えんぴつ","d":"字を書いたり絵をかいたりするときに使う道具だよ。","s":"削りたての鉛筆で、そっと絵を描いてみた。"},{"t":"消しゴム","r":"けしごむ","d":"鉛筆で書いたものをこすって消せる道具のこと。","s":"間違えた字を、消しゴムでそっと消した。"},{"t":"靴","r":"くつ","d":"足を守ってくれる、お出かけのときにはく道具だよ。","s":"新しい靴で、公園まで駆け出した。"},{"t":"鏡","r":"かがみ","d":"自分の顔や姿をうつして見ることができるものだよ。","s":"朝の鏡に、眠そうな顔が映っていた。"},{"t":"枕","r":"まくら","d":"寝るときに頭の下に置いてぐっすり眠るためのもの。","s":"やわらかい枕に、頭をそっとうずめた。"},{"t":"お弁当","r":"おべんとう","d":"おかずやごはんを箱につめて持っていく食事のこと。","s":"遠足の日の朝、母がお弁当を作ってくれた。"},{"t":"虫めがね","r":"むしめがね","d":"小さいものを大きく見ることができるレンズだよ。","s":"虫めがねで葉っぱをのぞくと、小さな世界が見えた。"},{"t":"滑り台","r":"すべりだい","d":"上に登ってしゅーっと滑り降りる遊具のこと。","s":"公園の滑り台を、子どもたちが何度も滑る。"},{"t":"お風呂","r":"おふろ","d":"体をきれいに洗って温まる、気持ちのいい場所だよ。","s":"一日の終わりに、あたたかいお風呂につかった。"},{"t":"影","r":"かげ","d":"光がものに当たってできる暗い形のことだよ。","s":"夕方になると、影が長く伸びていく。"},{"t":"水たまり","r":"みずたまり","d":"雨がやんだあとに地面にできる小さな水のこと。","s":"雨上がりの水たまりに、空が映り込んでいた。"},{"t":"大好き","r":"だいすき","d":"すきの気持ちがいっぱいで関わるだけでうれしくなること。","s":"このやわらかい光が、私は大好きだ。"},{"t":"丁寧","r":"ていねい","d":"ひとつひとつ気をつけて、きちんとやる様子だよ。","s":"おばあちゃんは、いつも丁寧にお茶をいれる。"},{"t":"素敵","r":"すてき","d":"見たり聞いたりして「いいなあ」と思う様子のこと。","s":"夕焼けに染まる空は、とても素敵だった。"},{"t":"そっくり","r":"そっくり","d":"見分けがつかないくらいよく似ている様子のこと。","s":"小さな石が、母の指輪にそっくりな形をしていた。"},{"t":"たっぷり","r":"たっぷり","d":"あふれそうなくらいたくさんある様子だよ。","s":"水筒にたっぷりの水を入れて、山道を歩いた。"},{"t":"うっかり","r":"うっかり","d":"気をつけていなくて間違えたり忘れたりすること。","s":"傘をうっかり忘れて、雨に濡れながら帰った。"},{"t":"こっそり","r":"こっそり","d":"誰にも気づかれないようにそっとやる様子だよ。","s":"夜になると、猫がこっそり庭を横切っていく。"},{"t":"ぐっすり","r":"ぐっすり","d":"目が覚めないくらいとても深く眠っている様子のこと。","s":"疲れた体で布団に入り、ぐっすり眠った。"},{"t":"のんびり","r":"のんびり","d":"急がないでゆったりと過ごしている様子だよ。","s":"縁側で猫と一緒に、のんびり日向ぼっこをした。"},{"t":"はっきり","r":"はっきり","d":"ぼんやりしないで、よく分かるようにはっきりしている様子だよ。","s":"山の上から見る景色は、驚くほどはっきり見えた。"},{"t":"ほっぺ","r":"ほっぺ","d":"顔のよこにある、ふっくらしたやわらかい部分だよ。","s":"冷たい風に、子どものほっぺが赤く染まった。"},{"t":"まつげ","r":"まつげ","d":"目のまわりに生えている細い毛のこと。目を守ってくれるよ。","s":"少女のまつげに、小さな雪がひとひら乗った。"},{"t":"くすぐったい","r":"くすぐったい","d":"わきの下や足のうらをさわられると、思わず笑っちゃう感じだよ。","s":"風がそっと肩をなでると、なんだかくすぐったい。"},{"t":"ねむい","r":"ねむい","d":"目がとじそうになって、お布団に入りたくなる感じだよ。","s":"お昼の光がやわらかくて、少しねむい気持ちになる。"},{"t":"おなかすいた","r":"おなかすいた","d":"ごはんが食べたくて、おなかがグーッと鳴る感じだよ。","s":"遊び疲れた頃、おなかすいたと小さな声がもれた。"},{"t":"のどかわいた","r":"のどかわいた","d":"お水やジュースが飲みたくなる感じのこと。","s":"長い坂を登りきると、のどかわいたことに気づいた。"},{"t":"まぶたい","r":"まぶたい","d":"お日さまの光がまぶしくて、つい目をつぶっちゃうこと。","s":"夏の日差しがまぶたいから、麦わら帽子をかぶった。"},{"t":"こそばい","r":"こそばい","d":"ちょっとくすぐったくて、もぞもぞする感じだよ。","s":"草の穂が足首に触れて、こそばい感じがした。"},{"t":"むしむし","r":"むしむし","d":"じめっとして暑い、夏のいやな感じだよ。","s":"雨上がりの道は、むしむしとした空気に包まれた。"},{"t":"からっと","r":"からっと","d":"湿気がなくてさわやかに晴れている様子だよ。","s":"洗濯物が、からっと乾いた風になびいている。"},{"t":"じんわり","r":"じんわり","d":"ゆっくりとあたたかさや気持ちが広がっていくこと。","s":"温かいお茶が、体にじんわりとしみわたる。"},{"t":"ずきずき","r":"ずきずき","d":"頭やおなかが脈打つように痛む感じだよ。","s":"転んだ膝が、夜になるとずきずきと痛みだす。"},{"t":"うとうと","r":"うとうと","d":"眠くなってきて、頭がこっくりこっくりすること。","s":"電車の揺れに誘われて、いつのまにかうとうとしていた。"},{"t":"よろよろ","r":"よろよろ","d":"ふらふらして、倒れそうに歩いている様子だよ。","s":"重い荷物を抱えて、よろよろと坂道を上る。"},{"t":"へとへと","r":"へとへと","d":"たくさん動いて、もう動けないくらい疲れた様子だよ。","s":"一日中歩き回って、夕方にはへとへとになった。"},{"t":"めきめき","r":"めきめき","d":"どんどん上手になっている様子のこと。","s":"小さな苗が、夏の間にめきめきと背を伸ばした。"},{"t":"すくすく","r":"すくすく","d":"子どもや植物がぐんぐん元気に育つ様子だよ。","s":"庭の木は、雨と光を浴びてすくすくと育っていく。"},{"t":"きょろきょろ","r":"きょろきょろ","d":"あちこち目を動かして見まわしている様子だよ。","s":"初めての街で、子猫のようにきょろきょろと辺りを見た。"},{"t":"おっかなびっくり","r":"おっかなびっくり","d":"こわいけどやってみたくて、おそるおそる進む様子だよ。","s":"初めての橋を、おっかなびっくり渡っていった。"},{"t":"まごまご","r":"まごまご","d":"どうしていいかわからなくて、おろおろしている様子だよ。","s":"地図を片手に、知らない道でまごまごしてしまった。"},{"t":"うずうず","r":"うずうず","d":"早くやりたくて体がそわそわしてくる気持ちだよ。","s":"新しい自転車に乗りたくて、朝からうずうずしていた。"},{"t":"つんつん","r":"つんつん","d":"指先でちょんちょんとさわる様子、またはすましている感じ。","s":"小鳥が、窓ガラスをつんつんとついばんでいる。"},{"t":"さっぱり","r":"さっぱり","d":"お風呂に入ったあとみたいに、すっきりした気持ちだよ。","s":"汗を流したあとは、心までさっぱりとした気分になる。"},{"t":"こんがり","r":"こんがり","d":"パンやお肉がちょうどいい色に焼けている様子だよ。","s":"焚き火で焼いた餅が、こんがりときつね色になった。"},{"t":"ほくほく","r":"ほくほく","d":"焼きいもみたいにあつあつでおいしい様子のこと。","s":"焼き芋を頬張ると、口の中がほくほくと温かい。"},{"t":"しゃきしゃき","r":"しゃきしゃき","d":"レタスやきゅうりをかじったときの歯ごたえの音だよ。","s":"採れたての野菜は、しゃきしゃきと音を立てて弾けた。"},{"t":"とろとろ","r":"とろとろ","d":"チーズやプリンみたいに、やわらかく溶けている様子だよ。","s":"鍋の中のスープが、とろとろと静かに煮えている。"},{"t":"もりもり","r":"もりもり","d":"ごはんをたくさん元気に食べている様子だよ。","s":"祖母の作ったご飯を、もりもりとおかわりした。"},{"t":"ぺこぺこ","r":"ぺこぺこ","d":"おなかがすいてぐうぐう鳴っている様子だよ。","s":"遊び疲れたお腹は、ぺこぺこと音を立てて鳴った。"},{"t":"ゆらゆら","r":"ゆらゆら","d":"ゆっくりとあっちこっちに揺れている様子のこと。","s":"風に吹かれて、川辺のすすきがゆらゆらと揺れる。"},{"t":"こっくり","r":"こっくり","d":"居眠りしてうなずくように頭が前にかくんと動く様子だよ。","s":"静かな午後、おじいさんは椅子でこっくりと舟をこいだ。"},{"t":"ちょろちょろ","r":"ちょろちょろ","d":"水が少しだけ流れている様子のこと。","s":"小川の水が、石の間をちょろちょろと流れていく。"},{"t":"ぬくぬく","r":"ぬくぬく","d":"お布団の中みたいにあたたかくて気持ちいい様子だよ。","s":"こたつの中で、猫と一緒にぬくぬくと丸くなる。"},{"t":"いそいそ","r":"いそいそ","d":"楽しいことがあるみたいに、うれしそうに準備する様子だよ。","s":"遠足の朝、いそいそと支度をして玄関を出た。"},{"t":"おどおど","r":"おどおど","d":"こわくて不安で、びくびくしている様子だよ。","s":"知らない人に話しかけられ、少しおどおどしてしまった。"},{"t":"あたふた","r":"あたふた","d":"急なことがあって、あわてて動き回る様子だよ。","s":"遅刻しそうになって、あたふたと家を飛び出した。"},{"t":"ぽつんと","r":"ぽつんと","d":"ひとりだけで静かにいる、ちょっとさみしい様子だよ。","s":"広い野原に、一本の木がぽつんと立っていた。"},{"t":"しみじみ","r":"しみじみ","d":"心の深いところでじんわり感じる、しずかな気持ちだよ。","s":"古い写真を見ながら、しみじみと昔を思い出した。"},{"t":"ぷくぷく","r":"ぷくぷく","d":"水の中から小さなあわが出てくる様子だよ。","s":"赤ちゃんの頬が、ぷくぷくとやわらかそうに膨らむ。"},{"t":"ぽろぽろ","r":"ぽろぽろ","d":"涙や小さなものがぱらぱら落ちる様子だよ。","s":"感動した映画に、涙がぽろぽろとこぼれ落ちた。"},{"t":"むずむず","r":"むずむず","d":"鼻やのどがくすぐったくて、くしゃみが出そうな感じだよ。","s":"新しい靴を履きたくて、足がむずむずしている。"},{"t":"ほろほろ","r":"ほろほろ","d":"クッキーやお菓子が口の中でやわらかく崩れる様子だよ。","s":"焼きたてのクッキーが、口の中でほろほろと崩れた。"}];

/* ── Config ── */
var SHOW_COUNT=50;
var CENTER=[35.0425,135.7870];
var SPREAD_LAT=0.0035;
var SPREAD_LNG=0.0040;
var SIZES=[14,15,16,17,18,19,20,22,24,26];

/* ── Park zone (一乗寺公園) ── */
var PARK_CENTER=[35.0422989,135.7871945];
var PARK_BOUNDS=[
  [35.0429519,135.7868887],
  [35.0429449,135.7873092],
  [35.0429489,135.7878188],
  [35.0429043,135.787872],
  [35.0424507,135.7878337],
  [35.0415857,135.7877913],
  [35.0415401,135.7876949],
  [35.0415746,135.7869094],
  [35.0419565,135.7866844],
  [35.0419812,135.7863771],
  [35.0422493,135.7865141],
  [35.0424981,135.7866404]
];
var PARK_LAT_MIN=35.0415401,PARK_LAT_MAX=35.0429519;
var PARK_LNG_MIN=135.7863771,PARK_LNG_MAX=135.787872;

function pointInPoly(lat,lng,poly){
  var inside=false;
  for(var i=0,j=poly.length-1;i<poly.length;j=i++){
    var yi=poly[i][0],xi=poly[i][1];
    var yj=poly[j][0],xj=poly[j][1];
    if(((yi>lat)!==(yj>lat))&&(lng<(xj-xi)*(lat-yi)/(yj-yi)+xi))
      inside=!inside;
  }
  return inside;
}
function inPark(lat,lng){
  if(lat<PARK_LAT_MIN||lat>PARK_LAT_MAX||lng<PARK_LNG_MIN||lng>PARK_LNG_MAX)return false;
  return pointInPoly(lat,lng,PARK_BOUNDS);
}


/* ── Helpers ── */
function rb(t,r){if(t===r)return t;return '<ruby>'+t+'<rp>(</rp><rt>'+r+'</rt><rp>)</rp></ruby>'}
function rand(a,b){return a+Math.random()*(b-a)}
function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;
  }
  return arr;
}
function pick(arr,n){return shuffle(arr.slice()).slice(0,Math.min(n,arr.length))}

/* ── Map ── */

/* park label */
var parkLabelEl=document.getElementById('park-label');
function updateParkLabel(){
  var pt=map.latLngToContainerPoint(PARK_CENTER);
  if(!parkLabelEl){
    parkLabelEl=document.createElement('div');
    parkLabelEl.id='park-label';
    parkLabelEl.innerHTML='一乗寺公園';
    document.body.appendChild(parkLabelEl);
  }
  parkLabelEl.style.left=pt.x+'px';
  parkLabelEl.style.top=pt.y+'px';
  parkLabelEl.style.transform='translate(-50%,-50%)';
}
updateParkLabel();
map.on('move zoom',updateParkLabel);

/* ── State ── */
var barEl=document.getElementById('bar');
var bwEl=document.getElementById('bw');
var bdEl=document.getElementById('bd');
var sentenceEl=document.getElementById('sentence');
var curOn=null;
var markers=[];
var sentenceTimer=null;

/* ── Generate random positions (avoiding park) ── */
function genPositions(n){
  var pts=[];
  var attempts=0;
  while(pts.length<n&&attempts<n*20){
    var angle=Math.random()*Math.PI*2;
    var radius=Math.sqrt(Math.random());
    var lat=CENTER[0]+Math.cos(angle)*radius*SPREAD_LAT;
    var lng=CENTER[1]+Math.sin(angle)*radius*SPREAD_LNG;
    attempts++;
    if(!inPark(lat,lng)){pts.push([lat,lng])}
  }
  return pts;
}

/* ── Place words on map ── */
function placeWords(){
  /* dismiss any active state */
  if(curOn){
    curOn.classList.remove('on');
    curOn=null;
    document.body.classList.remove('focus');
    barEl.classList.remove('show');
  }
  /* remove old markers */
  markers.forEach(function(m){map.removeLayer(m)});
  markers=[];

  var nLocal=Math.round(SHOW_COUNT*0.3);
  var nGeneral=SHOW_COUNT-nLocal;
  var localPicked=pick(LOCAL,nLocal).map(function(w){return {t:w.t,r:w.r,d:w.d,local:true}});
  var generalPicked=pick(GENERAL,nGeneral);
  var chosen=shuffle(localPicked.concat(generalPicked));
  var positions=genPositions(SHOW_COUNT);

  chosen.forEach(function(w,i){
    var s=SIZES[Math.floor(Math.random()*SIZES.length)];
    var cw=s*1.15;
    var tw=w.t.length*cw+(w.t.length-1)*4;
    var cls=w.local?'w local':'w';
    var icon=L.divIcon({
      html:'<div class="'+cls+'" style="font-size:'+s+'px">'+rb(w.t,w.r)+'</div>',
      className:'',
      iconSize:[tw+24,s+20],
      iconAnchor:[(tw+24)/2,(s+20)/2]
    });
    var m=L.marker(positions[i],{icon:icon,interactive:true,keyboard:false,draggable:true}).addTo(map);
    m._wordData=w;

    /* stagger fade-in */
    (function(marker,word){
      setTimeout(function(){
        var el=getW(marker);
        if(el)el.classList.add('visible');
      },100+i*60);

      marker.on('mouseover',function(){if(!marker._isDragging)show(marker,word)});
      marker.on('mouseout',function(){if(!marker._isDragging)hide(marker)});
      marker.on('click',function(e){
        L.DomEvent.stopPropagation(e);
        if(curOn===getW(marker)){hide(marker)} else {show(marker,word)}
      });

      /* drag events */
      marker.on('dragstart',function(){
        marker._isDragging=true;
        hide(marker);
        var el=getW(marker);
        if(el)el.classList.add('dragging');
      });
      marker.on('dragend',function(){
        marker._isDragging=false;
        var el=getW(marker);
        if(el)el.classList.remove('dragging');
        var pos=marker.getLatLng();
        if(inPark(pos.lat,pos.lng)){
          absorbWord(marker,word);
        }
      });
    })(m,w);

    markers.push(m);
  });
}

function getW(m){return m.getElement()?m.getElement().querySelector('.w'):null}

function show(m,w){
  var el=getW(m);if(!el)return;
  if(curOn&&curOn!==el)curOn.classList.remove('on');
  curOn=el;
  el.classList.add('on');
  document.body.classList.add('focus');
  bwEl.innerHTML=rb(w.t,w.r);
  bdEl.textContent=w.d;
  barEl.classList.add('show');
}

function hide(m){
  var el=getW(m);if(!el)return;
  el.classList.remove('on');
  if(curOn===el){
    curOn=null;
    document.body.classList.remove('focus');
    barEl.classList.remove('show');
  }
}

map.on('click',function(){
  if(curOn){
    curOn.classList.remove('on');
    curOn=null;
    document.body.classList.remove('focus');
    barEl.classList.remove('show');
  }
  /* dismiss sentence on map click */
  sentenceEl.classList.remove('show');
});

/* ── Absorb word into park ── */
function absorbWord(marker,word){
  var el=getW(marker);
  if(!el)return;
  /* animate: move marker to park center */
  marker.setLatLng(PARK_CENTER);
  /* trigger absorb animation */
  setTimeout(function(){
    el.classList.add('absorbing');
  },50);
  /* after animation, remove marker and show sentence */
  setTimeout(function(){
    map.removeLayer(marker);
    var idx=markers.indexOf(marker);
    if(idx>-1)markers.splice(idx,1);
    showSentence(word);
  },700);
}

function showSentence(word){
  var text=word.s?word.s.replace(new RegExp(word.t,'g'),'<span class="sword">'+word.t+'</span>'):'<span class="sword">'+word.t+'</span>';
  sentenceEl.innerHTML=text;
  sentenceEl.classList.add('show');
  if(sentenceTimer)clearTimeout(sentenceTimer);
  sentenceTimer=setTimeout(function(){
    sentenceEl.classList.remove('show');
  },4500);
}

/* ── Shuffle button ── */
document.getElementById('shuffle').addEventListener('click',function(e){
  e.stopPropagation();
  placeWords();
});

/* ── Initial placement ── */
placeWords();
</script>
