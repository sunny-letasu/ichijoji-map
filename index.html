<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>一乗寺</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Antique+Soft&family=Noto+Sans+JP:wght@300;400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#f0ece4}
body{font-family:'Noto Sans JP',sans-serif}

#map{position:fixed;top:0;right:0;bottom:0;left:0;z-index:1}

.leaflet-tile-pane{
  filter:grayscale(1) brightness(1.45) contrast(0.3);
  opacity:.6;
}

#tint{
  position:fixed;top:0;right:0;bottom:0;left:0;z-index:2;
  background:rgba(240,236,228,.18);
  pointer-events:none;
}

.leaflet-control-zoom{display:none!important}
.leaflet-control-attribution{
  font-size:8px!important;opacity:.25!important;
  background:transparent!important;color:#888!important;
}
.leaflet-control-attribution a{color:#888!important}

.w{
  font-family:'Zen Antique Soft',serif;
  color:#000;
  opacity:0;
  cursor:default;
  white-space:nowrap;
  letter-spacing:4px;
  transition:opacity .8s ease-in,transform .5s;
  transform:scale(1);
  text-shadow:
    0 0 20px rgba(240,236,228,.9),
    0 0 40px rgba(240,236,228,.6);
  user-select:none;
  -webkit-user-select:none;
}
.w.visible{opacity:.75}
.w rt{
  font-size:.45em;
  letter-spacing:1px;
  opacity:.7;
}
.w.on{
  opacity:1!important;
  transform:scale(1.12);
  text-shadow:
    0 0 20px rgba(240,236,228,.9),
    0 0 40px rgba(240,236,228,.6),
    0 1px 3px rgba(0,0,0,.08);
}
.w.on rt{opacity:1}
.w.local{color:#b22222}
.w.local.on{
  text-shadow:
    0 0 20px rgba(240,236,228,.9),
    0 0 40px rgba(240,236,228,.6),
    0 1px 3px rgba(178,34,34,.12);
}
body.focus .w:not(.on){
  opacity:.18!important;
}

#bar{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  padding:22px 32px 26px;
  background:linear-gradient(transparent 0%,rgba(26,26,20,.6) 25%,rgba(26,26,20,.82) 100%);
  color:#F0E4C4;
  transform:translateY(100%);
  opacity:0;
  transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .5s;
  display:flex;align-items:center;gap:24px;
  pointer-events:none;
}
#bar.show{transform:translateY(0);opacity:1}
#bar .bw{
  font-family:'Zen Antique Soft',serif;
  font-size:28px;letter-spacing:8px;flex-shrink:0;
}
#bar .bw rt{font-size:.45em;letter-spacing:1px}
#bar .bd{
  font-size:14px;line-height:1.8;font-weight:300;
  letter-spacing:.5px;color:rgba(240,228,196,.8);
}

#wm{
  position:fixed;top:18px;left:22px;z-index:100;
  pointer-events:none;transition:opacity .5s;
}
#wm .t1{
  font-family:'Zen Antique Soft',serif;
  font-size:16px;letter-spacing:10px;
  color:rgba(26,26,20,.2);
}
#wm .t1 rt{font-size:.5em;letter-spacing:2px}
#wm .t2{
  font-size:9px;letter-spacing:2px;margin-top:3px;
  color:rgba(26,26,20,.13);font-weight:300;
}
body.focus #wm{opacity:.3}

/* shuffle button */
#shuffle{
  position:fixed;bottom:18px;right:18px;z-index:101;
  width:40px;height:40px;border-radius:50%;
  background:rgba(26,26,20,.08);border:1px solid rgba(26,26,20,.1);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .3s,transform .3s;
  color:rgba(26,26,20,.3);font-size:18px;
}
#shuffle:hover{background:rgba(26,26,20,.15);transform:rotate(180deg)}

/* park zone */
.park-zone{
  border:1.5px dashed rgba(80,130,80,.25)!important;
  background:rgba(80,130,80,.06)!important;
}
#park-label{
  position:fixed;z-index:50;
  pointer-events:none;
  font-family:'Zen Antique Soft',serif;
  font-size:11px;letter-spacing:3px;
  color:rgba(80,130,80,.35);
  text-align:center;
  white-space:nowrap;
}

/* dragging state */
.w.dragging{
  opacity:1!important;
  transform:scale(1.15);
  cursor:grabbing;
  z-index:9999;
}
.leaflet-marker-icon{cursor:grab}
.leaflet-dragging .leaflet-marker-icon{cursor:grabbing}

/* absorb animation */
.w.absorbing{
  transition:transform .6s cubic-bezier(.6,.04,.98,.34),opacity .6s ease-in;
  transform:scale(0)!important;
  opacity:0!important;
}

/* sentence popup */
#sentence{
  position:fixed;top:50%;left:50%;z-index:200;
  transform:translate(-50%,-50%) scale(0.8);
  opacity:0;
  background:rgba(26,26,20,.88);
  color:#F0E4C4;
  padding:28px 36px;
  border-radius:12px;
  font-family:'Zen Antique Soft',serif;
  font-size:20px;
  letter-spacing:2px;
  line-height:1.8;
  text-align:center;
  max-width:85vw;
  pointer-events:none;
  transition:transform .5s cubic-bezier(.2,.8,.3,1),opacity .5s;
}
#sentence.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}
#sentence .sword{
  color:#e8c87a;
  font-size:1.15em;
}

@media(max-width:600px){
  .w{letter-spacing:2px}
  #bar{padding:16px 20px 22px;flex-direction:column;gap:8px}
  #bar .bw{font-size:22px;letter-spacing:5px}
  #bar .bd{font-size:12px;line-height:1.7}
  #wm{top:12px;left:14px}
  #wm .t1{font-size:14px;letter-spacing:6px}
  #wm .t2{font-size:8px}
  #shuffle{width:36px;height:36px;bottom:14px;right:14px;font-size:16px}
  #sentence{font-size:16px;padding:20px 24px;max-width:92vw}
}
</style>
</head>
<body>

<div id="map"></div>
<div id="tint"></div>

<div id="wm">
  <div class="t1"><ruby>一乗寺<rp>(</rp><rt>いちじょうじ</rt><rp>)</rp></ruby></div>
  <div class="t2">京都 — 文化と味が交差する街</div>
</div>

<div id="bar">
  <div class="bw" id="bw"></div>
  <div class="bd" id="bd"></div>
</div>

<button id="shuffle" title="ことばを入れ替える">&#x21bb;</button>
<div id="sentence"></div>

<script>
var LOCAL=[{"t":"ラーメン","r":"らーめん","d":"小麦粉の麺をスープで食べる料理で、一乗寺はラーメンの街として有名だよ。","s":"夜風にのって、ラーメンの匂いが路地を包んだ。"},{"t":"麺","r":"めん","d":"小麦粉をこねてのばして作る細長い食べもののことだよ。","s":"すすった麺の熱さが、冬の心をあたためる。"},{"t":"スープ","r":"すーぷ","d":"ラーメンの味を決める大事な汁のことだよ。","s":"澄んだスープに、今日一日の疲れがとける。"},{"t":"チャーシュー","r":"ちゃーしゅー","d":"豚肉をたれにつけてじっくり焼いたり煮たりしたお肉のことだよ。","s":"とろけるチャーシューが、丼の上でひと休みしている。"},{"t":"煮卵","r":"にたまご","d":"たまごをゆでてからたれにつけて味をしみこませたものだよ。","s":"半分に割ると、煮卵から夕日がこぼれ出た。"},{"t":"背脂","r":"せあぶら","d":"豚の背中の脂のことで、ラーメンに浮かべるとこってりするよ。","s":"背脂のきらめきが、湯気の中で星のように光る。"},{"t":"醤油","r":"しょうゆ","d":"大豆から作られる茶色い調味料で、ラーメンのスープにも使われるよ。","s":"醤油の香りが、母の台所を思い出させる。"},{"t":"味噌","r":"みそ","d":"大豆を発酵させて作る調味料で、味噌ラーメンの味のもとだよ。","s":"味噌の湯気が、寒い朝の窓をくもらせる。"},{"t":"塩","r":"しお","d":"海水から作られる白い調味料で、塩ラーメンはあっさりした味だよ。","s":"ひとつまみの塩が、静かな海を思い出させる。"},{"t":"太麺","r":"ふとめん","d":"ふつうより太い麺のことで、もちもちした食感が楽しめるよ。","s":"太麺をすする音が、店中に響いてゆく。"},{"t":"細麺","r":"ほそめん","d":"ふつうより細い麺のことで、スープがよくからむよ。","s":"するりとのどを通る細麺が、風のように軽い。"},{"t":"こってり","r":"こってり","d":"脂が多くて濃い味のことで、一乗寺のラーメンに多いよ。","s":"こってりしたスープに、旅の疲れが溶けていく。"},{"t":"あっさり","r":"あっさり","d":"脂が少なくてさっぱりした味のことだよ。","s":"あっさりとした一杯が、朝の光に似合う。"},{"t":"替え玉","r":"かえだま","d":"ラーメンの麺だけをおかわりすることだよ。","s":"もう一度、替え玉を頼む声が弾んでいる。"},{"t":"丼","r":"どんぶり","d":"ラーメンや親子丼を入れる大きくて深いお茶碗のことだよ。","s":"あたたかい丼を両手で包み、目を閉じる。"},{"t":"箸","r":"はし","d":"ごはんや麺を食べるときに使う二本の棒のことだよ。","s":"小さな手が、はじめて箸を持ち上げた。"},{"t":"れんげ","r":"れんげ","d":"ラーメンのスープをすくうときに使う小さなスプーンだよ。","s":"れんげですくうたび、幸せがひとさじ増える。"},{"t":"のり","r":"のり","d":"海藻を薄くして乾かしたもので、ラーメンにのせることもあるよ。","s":"パリッとしたのりが、月のかけらのように光る。"},{"t":"ねぎ","r":"ねぎ","d":"細く切ってラーメンの上にのせる緑色の野菜だよ。","s":"刻んだねぎが、緑の雨のように舞い落ちる。"},{"t":"にんにく","r":"にんにく","d":"香りが強い野菜で、ラーメンに入れるとパンチが出るよ。","s":"にんにくの香りが、路地の奥まで漂っていく。"},{"t":"もやし","r":"もやし","d":"豆から出た白い芽で、ラーメンの具としてよく使われるよ。","s":"白いもやしが、丼の中で静かに揺れている。"},{"t":"メンマ","r":"めんま","d":"たけのこを発酵させて作ったラーメンの具だよ。","s":"細く切られたメンマが、竹林の記憶を運んでくる。"},{"t":"餃子","r":"ぎょうざ","d":"肉と野菜をうすい皮で包んで焼いた料理で、ラーメンと一緒に食べることが多いよ。","s":"こんがり焼けた餃子が、夕食の主役になる。"},{"t":"唐揚げ","r":"からあげ","d":"鶏肉に味をつけて油で揚げたおかずのことだよ。","s":"揚げたての唐揚げに、笑い声が集まってくる。"},{"t":"炒飯","r":"ちゃーはん","d":"ごはんを卵や具と一緒に炒めた料理だよ。","s":"パラパラの炒飯が、湯気とともに舞い上がる。"},{"t":"ラーメン屋","r":"らーめんや","d":"ラーメンを出すお店のことで、一乗寺にはたくさんあるよ。","s":"小さなラーメン屋の灯りが、夜道をやさしく照らす。"},{"t":"行列","r":"ぎょうれつ","d":"人が順番にならんで待つことで、人気のラーメン屋にはよくできるよ。","s":"静かな行列が、通りにひとつの物語をつくる。"},{"t":"食べ歩き","r":"たべあるき","d":"いろいろなお店をまわりながら食べることだよ。","s":"食べ歩きの途中で、知らない路地に迷いこんだ。"},{"t":"暖簾","r":"のれん","d":"お店の入り口にかかっている布のことで、お店の目印になるよ。","s":"風にゆれる暖簾が、店の呼吸をそっと伝える。"},{"t":"湯気","r":"ゆげ","d":"熱いラーメンから立ちのぼる白いけむりのようなものだよ。","s":"立ちのぼる湯気が、朝の光をやわらかく包む。"},{"t":"出汁","r":"だし","d":"昆布やかつお節からとったうまみたっぷりの汁のことだよ。","s":"ひと口の出汁に、季節がそっと溶けている。"},{"t":"豚骨","r":"とんこつ","d":"豚の骨をじっくり煮込んで作る白くて濃いスープのことだよ。","s":"白く煮立つ豚骨が、夜通し夢を見ている。"},{"t":"鶏ガラ","r":"とりがら","d":"鶏の骨を煮込んで作るスープのもとのことだよ。","s":"ことこと煮える鶏ガラが、台所に歌をうたう。"},{"t":"味玉","r":"あじたま","d":"味がしっかりしみた半熟のゆでたまごのことだよ。","s":"割った味玉から、夕焼けの色がこぼれる。"},{"t":"食券","r":"しょっけん","d":"ラーメン屋で先にきっぷを買って注文する仕組みのことだよ。","s":"一枚の食券が、今日のごほうびになる。"},{"t":"大盛り","r":"おおもり","d":"ふつうよりたくさん麺やごはんが入っていることだよ。","s":"大盛りのどんぶりに、笑顔がのぞきこむ。"},{"t":"カウンター","r":"かうんたー","d":"お店の人のすぐ前にある細長い席のことだよ。","s":"カウンターの隅で、ひとりの時間が静かに流れる。"},{"t":"すする","r":"すする","d":"麺やスープを音をたてて口に吸い込むことだよ。","s":"音を立ててすする瞬間、心までほどけていく。"},{"t":"完食","r":"かんしょく","d":"出された料理を残さず全部食べきることだよ。","s":"空になった器が、完食の合図をそっと告げる。"},{"t":"一杯","r":"いっぱい","d":"ラーメンやうどんを数えるときの言い方だよ。","s":"あたたかい一杯が、冷えた手のひらを包む。"},{"t":"お寺","r":"おてら","d":"お坊さんがいて仏さまをまつっている建物のことだよ。","s":"石段の先に、小さなお寺がひっそり佇む。"},{"t":"本堂","r":"ほんどう","d":"お寺の中で一番大切な建物のことだよ。","s":"静かな本堂に、線香の煙がまっすぐのぼる。"},{"t":"仏像","r":"ぶつぞう","d":"仏さまの姿を木や石で作ったもののことだよ。","s":"古い仏像が、長い時間をじっと見守っている。"},{"t":"お坊さん","r":"おぼうさん","d":"お寺で修行をしてお経を読む人のことだよ。","s":"早朝のお坊さんの読経が、境内に響き渡る。"},{"t":"鐘","r":"かね","d":"お寺にある大きな金属の鐘で、つくとゴーンと鳴るよ。","s":"遠くで鳴る鐘の音が、静かな夕暮れを知らせる。"},{"t":"お線香","r":"おせんこう","d":"火をつけるとよい香りのけむりが出る細い棒のことだよ。","s":"ゆらめくお線香の煙が、祈りを空へ運んでいく。"},{"t":"お参り","r":"おまいり","d":"神社やお寺に行って手を合わせておいのりすることだよ。","s":"家族そろってのお参りが、新しい年の始まりになる。"},{"t":"石段","r":"いしだん","d":"石で作られた階段のことで、お寺によくあるよ。","s":"苔むした石段を、風がひとりで登っていく。"},{"t":"山門","r":"さんもん","d":"お寺の入り口にある大きな門のことだよ。","s":"大きな山門をくぐると、風の音まで変わる。"},{"t":"灯籠","r":"とうろう","d":"石や金属で作られた明かりを入れるための台のことだよ。","s":"灯籠の火が、夜道にそっと寄り添っている。"},{"t":"苔","r":"こけ","d":"石や地面に生える緑色の小さな植物で、京都のお寺によく見られるよ。","s":"しっとりとした苔が、庭に緑の時間を刻む。"},{"t":"静寂","r":"せいじゃく","d":"音がまったくしない静かな状態のことだよ。","s":"境内を包む静寂に、鳥の声だけが響く。"},{"t":"お地蔵さん","r":"おじぞうさん","d":"道ばたやお寺にいる子どもを守ってくれるやさしい仏さまだよ。","s":"道端のお地蔵さんが、旅人をそっと見送る。"},{"t":"手水","r":"ちょうず","d":"神社やお寺で手と口を水できれいにすることだよ。","s":"冷たい手水で手を清め、心も静かになる。"},{"t":"おみくじ","r":"おみくじ","d":"神社やお寺で引く占いの紙のことで、大吉が一番いいよ。","s":"結んだおみくじが、風の中で小さく揺れる。"},{"t":"絵馬","r":"えま","d":"願いごとを書いて神社やお寺にかける木の板のことだよ。","s":"願いをのせた絵馬が、静かに風に鳴る。"},{"t":"お守り","r":"おまもり","d":"持っていると守ってもらえるという小さなふくろのことだよ。","s":"小さなお守りを握りしめ、一歩を踏み出す。"},{"t":"境内","r":"けいだい","d":"お寺や神社のしきちの中のことだよ。","s":"落ち葉の舞う境内に、静かな時間が流れる。"},{"t":"紅葉","r":"こうよう","d":"秋に葉っぱが赤や黄色に色づくことで、京都の秋はとてもきれいだよ。","s":"燃えるような紅葉が、山門を赤く染める。"},{"t":"枯山水","r":"かれさんすい","d":"水を使わずに石や砂で山や川を表した庭のことだよ。","s":"白い砂の枯山水に、波のない海がひろがる。"},{"t":"写経","r":"しゃきょう","d":"お経の文字を一つずつていねいに書き写す修行のことだよ。","s":"静かに写経をすると、心の音が聞こえてくる。"},{"t":"御朱印","r":"ごしゅいん","d":"お寺や神社でもらえる特別なはんこと手書きの記念だよ。","s":"集めた御朱印が、旅の記憶をつなげていく。"},{"t":"参道","r":"さんどう","d":"神社やお寺の入り口まで続く道のことだよ。","s":"木漏れ日の参道を、風がゆっくり通り抜ける。"},{"t":"仁王","r":"におう","d":"お寺の門で怖い顔をして守っている大きな像のことだよ。","s":"にらみをきかせた仁王が、山門の両脇に立つ。"},{"t":"精進料理","r":"しょうじんりょうり","d":"お肉や魚を使わずに野菜だけで作るお寺の料理のことだよ。","s":"湯気の立つ精進料理に、季節の恵みが並ぶ。"},{"t":"梵鐘","r":"ぼんしょう","d":"お寺にある大きな鐘のことで、大みそかにつくことで有名だよ。","s":"大きな梵鐘の音が、村じゅうに広がっていく。"},{"t":"瓦","r":"かわら","d":"屋根にならべる焼き物のことで、お寺の屋根によく使われるよ。","s":"古い瓦の上に、朝の光がやさしく降りる。"},{"t":"庫裏","r":"くり","d":"お寺の中でお坊さんたちがごはんを作ったり暮らしたりする建物だよ。","s":"静かな庫裏から、炊きたてのご飯の匂いがする。"},{"t":"座禅","r":"ざぜん","d":"足を組んで静かに座り心をしずめる修行のことだよ。","s":"息を整え座禅を組むと、時間が止まって感じる。"},{"t":"蓮","r":"はす","d":"泥の中から美しい花を咲かせる植物で、仏さまと関係が深いよ。","s":"泥の中から、蓮の花がまっすぐ空をめざす。"},{"t":"比叡山","r":"ひえいざん","d":"京都の北東にそびえる大きな山で、一乗寺からもよく見えるよ。","s":"遠くにそびえる比叡山が、街をやさしく見守る。"},{"t":"東山","r":"ひがしやま","d":"京都の東がわにある山なみのことだよ。","s":"夕焼けに染まる東山が、京都を包みこむ。"},{"t":"疏水","r":"そすい","d":"琵琶湖から京都に水を引くために作られた水路のことだよ。","s":"桜の花びらが、疏水にそっと流されていく。"},{"t":"小川","r":"おがわ","d":"小さな川のことで、一乗寺のまわりにも流れているよ。","s":"澄んだ小川のせせらぎが、子どもの声と重なる。"},{"t":"石畳","r":"いしだたみ","d":"平たい石をしきつめた道のことで、京都の古い道によくあるよ。","s":"濡れた石畳に、街灯の光がにじんでいる。"},{"t":"竹林","r":"ちくりん","d":"竹がたくさん生えている林のことだよ。","s":"風が吹くたび、竹林がやさしくざわめく。"},{"t":"朝霧","r":"あさぎり","d":"朝に出る白いもやのことで、山のそばでよく見られるよ。","s":"朝霧の中から、山の輪郭がゆっくり現れる。"},{"t":"夕暮れ","r":"ゆうぐれ","d":"夕方に空がオレンジ色に染まる時間のことだよ。","s":"やわらかな夕暮れが、町全体を包んでいく。"},{"t":"路地","r":"ろじ","d":"家と家の間にある細い道のことだよ。","s":"細い路地の奥に、小さな灯りがともる。"},{"t":"坂道","r":"さかみち","d":"ななめに上がっている道のことで、山のそばにはたくさんあるよ。","s":"息を切らして上る坂道の先に、空が広がる。"},{"t":"用水路","r":"ようすいろ","d":"田んぼや畑に水を送るために作られた小さな水路のことだよ。","s":"きらめく用水路の水が、田へと急いでいく。"},{"t":"田んぼ","r":"たんぼ","d":"お米を育てるための水をはった畑のことだよ。","s":"緑の田んぼが、風とともに波のように揺れる。"},{"t":"畑","r":"はたけ","d":"野菜や花を育てる土地のことだよ。","s":"小さな畑で、野菜たちが静かに育っていく。"},{"t":"桜","r":"さくら","d":"春にピンクや白の花を咲かせる木で、京都のお花見は有名だよ。","s":"満開の桜が、春の風にひらひらと舞う。"},{"t":"松","r":"まつ","d":"一年中緑の葉をつけている木で、一乗寺下り松が有名だよ。","s":"古い松の枝が、静かに空へと伸びている。"},{"t":"椿","r":"つばき","d":"冬から春にかけて赤い花を咲かせる木だよ。","s":"ぽとりと落ちる椿が、庭に赤い点をつくる。"},{"t":"青空","r":"あおぞら","d":"雲のない青い空のことだよ。","s":"澄みきった青空が、子どもたちを見下ろす。"},{"t":"清流","r":"せいりゅう","d":"水がとても澄んでいてきれいな川のことだよ。","s":"冷たい清流が、山の記憶を運んでくる。"},{"t":"野鳥","r":"やちょう","d":"山や川のそばにいる自然の中で暮らす鳥のことだよ。","s":"小さな野鳥が、朝の静けさを歌にかえる。"},{"t":"四季","r":"しき","d":"春と夏と秋と冬の四つの季節のことで、京都は四季がとてもきれいだよ。","s":"めぐる四季が、この町にそっと色をつける。"},{"t":"新緑","r":"しんりょく","d":"春に木々から出てくるみずみずしい緑色の若い葉っぱのことだよ。","s":"まぶしい新緑が、風に光をまき散らす。"},{"t":"落ち葉","r":"おちば","d":"秋に木から落ちた葉っぱのことだよ。","s":"舞い落ちる落ち葉が、道に金色の絨毯をしく。"},{"t":"木漏れ日","r":"こもれび","d":"木の葉っぱのすきまから差し込む太陽の光のことだよ。","s":"ゆれる木漏れ日が、地面に小さな模様を描く。"},{"t":"夕焼け","r":"ゆうやけ","d":"日が沈むときに空が赤く染まることだよ。","s":"空を染める夕焼けが、一日の終わりを告げる。"},{"t":"霜","r":"しも","d":"冬の朝に地面や草に白くつく氷のつぶのことだよ。","s":"白い霜が、朝の草の上にそっと降りている。"},{"t":"宮本武蔵","r":"みやもとむさし","d":"日本一強いと言われた剣の達人で、一乗寺で決闘をしたことで有名だよ。","s":"若き宮本武蔵が、この地で剣の道を極めた。"},{"t":"決闘","r":"けっとう","d":"一対一で勝負を決める真剣な戦いのことだよ。","s":"一乗寺の野で、伝説の決闘が繰り広げられた。"},{"t":"剣","r":"けん","d":"両がわに刃がある長い武器のことだよ。","s":"一振りの剣が、静かな覚悟を映し出す。"},{"t":"武士","r":"ぶし","d":"昔の日本で刀を持って戦った人たちのことだよ。","s":"誇り高い武士が、静かに道場をあとにする。"},{"t":"侍","r":"さむらい","d":"武士のことを別の言い方で呼んだものだよ。","s":"一人の侍が、夜明け前の道を歩いていく。"},{"t":"刀","r":"かたな","d":"武士が腰にさしていた日本の伝統的な武器のことだよ。","s":"鞘に納めた刀が、静けさをまとっている。"},{"t":"弓","r":"ゆみ","d":"矢をつがえて飛ばすための武器で、弓道にも使われるよ。","s":"しなる弓が、放たれる瞬間の音を待つ。"},{"t":"修行","r":"しゅぎょう","d":"強くなったり上手になったりするためにきびしい練習をすることだよ。","s":"山あいでの修行が、心をまっすぐに鍛える。"},{"t":"道場","r":"どうじょう","d":"武道の練習をするための建物のことだよ。","s":"古い道場に、気合いの声がこだまする。"},{"t":"一乗寺下り松","r":"いちじょうじさがりまつ","d":"宮本武蔵が決闘をしたと伝わる一乗寺の有名な松の木だよ。","s":"一乗寺下り松の下で、歴史が静かに息づいている。"},{"t":"鎧","r":"よろい","d":"武士が体を守るために着た金属や革の防具のことだよ。","s":"重い鎧をまとった影が、夜明けの道に立つ。"},{"t":"兜","r":"かぶと","d":"武士が頭を守るためにかぶった防具のことだよ。","s":"光る兜が、若い武者の覚悟を映す。"},{"t":"城","r":"しろ","d":"昔の武士が敵から守るために建てた大きな建物のことだよ。","s":"遠くに見える城が、時代の記憶を抱いている。"},{"t":"殿様","r":"とのさま","d":"昔の国や土地を治めていた偉い武士のことだよ。","s":"昔むかし、この地を治めた殿様がいたという。"},{"t":"矢","r":"や","d":"弓につがえて飛ばす先がとがった細い棒のことだよ。","s":"放たれた矢が、風を切って的へ向かう。"},{"t":"武道","r":"ぶどう","d":"剣道や柔道など日本に昔から伝わる戦いの技術のことだよ。","s":"静かな武道の稽古が、心を澄ませていく。"},{"t":"合戦","r":"かっせん","d":"大勢の武士たちが戦うことで、昔の京都でもたくさんあったよ。","s":"かつての合戦の跡に、今は静かな風が吹く。"},{"t":"流派","r":"りゅうは","d":"武道や芸術のやり方の違いをあらわすグループのことだよ。","s":"代々受け継がれた流派が、この町に残っている。"},{"t":"二刀流","r":"にとうりゅう","d":"両手に一本ずつ刀を持って戦う宮本武蔵の有名な技だよ。","s":"二刀流の構えが、月明かりに浮かび上がる。"},{"t":"兵法","r":"ひょうほう","d":"戦いに勝つための作戦や考え方のことだよ。","s":"古い兵法の書が、静かに時を刻んでいる。"},{"t":"真剣","r":"しんけん","d":"本物の刀のことで、本気でやることも真剣と言うよ。","s":"一本の真剣が、静けさの中で光を放つ。"},{"t":"草鞋","r":"わらじ","d":"わらで編んで作った昔のサンダルのような履き物だよ。","s":"すり切れた草鞋が、長い旅の証を語る。"},{"t":"武者","r":"むしゃ","d":"鎧や兜を身につけた強い武士のことだよ。","s":"勇ましい武者が、坂道を駆け上がっていく。"},{"t":"名勝負","r":"めいしょうぶ","d":"みんなが覚えているようなすばらしい戦いのことだよ。","s":"語り継がれる名勝負が、町の誇りになっている。"},{"t":"天下一","r":"てんかいち","d":"日本で一番強いことを意味する言葉だよ。","s":"天下一を夢見た若者が、この道場に集まった。"},{"t":"町家","r":"まちや","d":"京都に昔からある間口がせまくて奥が深い木の家のことだよ。","s":"古い町家の窓から、やわらかな光がこぼれる。"},{"t":"格子","r":"こうし","d":"細い木を縦と横にならべた窓やとびらの飾りのことだよ。","s":"木の格子ごしに、夕日がやさしく差しこむ。"},{"t":"下駄","r":"げた","d":"木で作った日本の伝統的な履き物で、カランコロンと音がするよ。","s":"からころと下駄の音が、路地に響いていく。"},{"t":"着物","r":"きもの","d":"日本の伝統的な衣装で、帯をしめて着るよ。","s":"淡い着物の袖が、風にふわりとなびく。"},{"t":"浴衣","r":"ゆかた","d":"夏にお祭りや花火大会で着る薄い着物のことだよ。","s":"夏の夜、浴衣の裾が涼しげに揺れている。"},{"t":"扇子","r":"せんす","d":"折りたためるうちわのことで、京都のおみやげにも人気だよ。","s":"開いた扇子から、小さな風が生まれる。"},{"t":"風鈴","r":"ふうりん","d":"風がふくとチリンチリンと涼しい音がする小さな鐘だよ。","s":"風鈴の音が、夏の静けさをやさしく揺らす。"},{"t":"提灯","r":"ちょうちん","d":"紙や布で作った明かりで、お祭りやお店の前でよく見るよ。","s":"提灯の灯りが、夜道を歩く足を照らす。"},{"t":"抹茶","r":"まっちゃ","d":"緑色のお茶の粉で、お茶をたてるときに使うよ。","s":"苦みのある抹茶に、静かな時間が溶けていく。"},{"t":"和菓子","r":"わがし","d":"日本の伝統的なお菓子で、きれいな形のものがたくさんあるよ。","s":"小さな和菓子に、四季の色が閉じこめられている。"},{"t":"団子","r":"だんご","d":"お米の粉をこねて丸めた和菓子で、串にさして食べるよ。","s":"串にささった団子が、縁側の午後を彩る。"},{"t":"豆腐","r":"とうふ","d":"大豆から作る白くてやわらかい食べもので、京都の豆腐は有名だよ。","s":"冷たい豆腐が、夏の食卓をすずしくする。"},{"t":"漬物","r":"つけもの","d":"野菜を塩やぬかにつけて作る保存食で、京都は漬物の種類が多いよ。","s":"ぽりぽりと漬物をかじる音が、朝を目覚めさせる。"},{"t":"おばんざい","r":"おばんざい","d":"京都のおうちで昔から作られてきたおかずのことだよ。","s":"小鉢に並ぶおばんざいが、京都の暮らしを語る。"},{"t":"番茶","r":"ばんちゃ","d":"京都の人がふだん飲んでいるあっさりしたお茶のことだよ。","s":"あたたかい番茶が、静かな午後をゆっくり満たす。"},{"t":"銭湯","r":"せんとう","d":"みんなが入れる大きなおふろ屋さんのことだよ。","s":"湯気の立つ銭湯で、一日の疲れがほどける。"},{"t":"自転車","r":"じてんしゃ","d":"京都の人がよく使うのりもので、一乗寺を走るのも気持ちいいよ。","s":"風を切る自転車が、坂道を軽やかに下っていく。"},{"t":"商店街","r":"しょうてんがい","d":"いろいろなお店がならんでいる通りのことだよ。","s":"にぎやかな商店街に、夕方の匂いが漂っている。"},{"t":"古本屋","r":"ふるほんや","d":"読み終わった本を売ったり買ったりするお店のことだよ。","s":"古本屋の棚から、静かな物語がのぞいている。"},{"t":"銘菓","r":"めいか","d":"その土地で有名なおいしいお菓子のことだよ。","s":"小さな銘菓に、旅の思い出が包まれている。"},{"t":"八つ橋","r":"やつはし","d":"ニッキの香りがする京都のおみやげの定番のお菓子だよ。","s":"甘い八つ橋の香りが、旅のはじまりを告げる。"},{"t":"京野菜","r":"きょうやさい","d":"京都で昔から育てられてきた特別な野菜のことだよ。","s":"色とりどりの京野菜が、季節を食卓にはこぶ。"},{"t":"湯豆腐","r":"ゆどうふ","d":"豆腐をお鍋であたためて食べるシンプルな京都の料理だよ。","s":"あたたかい湯豆腐が、冬の夜をやさしく包む。"},{"t":"床几","r":"しょうぎ","d":"お店の前に置いてある木の長いすのことで、京都のお茶屋さんで見かけるよ。","s":"床几に腰かけて、風の音にじっと耳をすます。"},{"t":"打ち水","r":"うちみず","d":"暑い日に道に水をまいて涼しくすることだよ。","s":"打ち水の匂いが、夏の夕方をすずしくする。"},{"t":"五山送り火","r":"ございおくりび","d":"お盆に京都の山で大きな火を燃やす伝統行事で、一乗寺からもよく見えるよ。","s":"山に浮かぶ五山送り火が、夏の終わりを告げる。"},{"t":"祇園祭","r":"ぎおんまつり","d":"毎年七月に京都で行われる日本で一番有名なお祭りの一つだよ。","s":"にぎわう祇園祭の音が、夜空にこだまする。"},{"t":"お茶会","r":"おちゃかい","d":"抹茶をたてておもてなしをする集まりのことだよ。","s":"静かなお茶会に、季節の香りがそっと満ちる。"},{"t":"地蔵盆","r":"じぞうぼん","d":"夏に子どもたちがお地蔵さんのまわりに集まってお祝いする行事だよ。","s":"子どもたちの声が、地蔵盆の夏を彩る。"},{"t":"暮らし","r":"くらし","d":"毎日の生活のことで、一乗寺はのんびりした暮らしが楽しめる町だよ。","s":"ゆっくりと流れる暮らしが、この町にはある。"},{"t":"金閣寺","r":"きんかくじ","d":"金色にかがやくお寺で、京都でいちばん有名な建物のひとつだよ。","s":"夕暮れになると、金閣寺の金色が水面に映る。"},{"t":"銀閣寺","r":"ぎんかくじ","d":"一乗寺のちかくにある落ちついたお寺で、わびさびの美しさを感じられるよ。","s":"静かな月あかりが、銀閣寺の庭にそっと差し込む。"},{"t":"清水寺","r":"きよみずでら","d":"大きな舞台があるお寺で、「清水の舞台から飛びおりる」ということわざでも有名だよ。","s":"舞台の上から、清水寺は町を見下ろしている。"},{"t":"嵐山","r":"あらしやま","d":"京都の西にある自然がいっぱいの場所で、春は桜、秋は色づく木々がきれいだよ。","s":"竹林の道を抜けると、嵐山の風が頬をなでる。"},{"t":"鴨川","r":"かもがわ","d":"京都の街なかを流れる川で、川べりをさんぽするのがとっても気持ちいいよ。","s":"夕焼けの色を映して、鴨川はゆっくり流れる。"},{"t":"祇園","r":"ぎおん","d":"舞妓さんに会えるかもしれない、昔ながらの美しい街なみが残るところだよ。","s":"石畳を歩いていくと、祇園の灯りが揺れている。"},{"t":"伏見稲荷","r":"ふしみいなり","d":"赤い鳥居がずらっとならんでいる神社で、まるでトンネルみたいだよ。","s":"山を登っていくと、伏見稲荷の鳥居が続く。"},{"t":"二条城","r":"にじょうじょう","d":"徳川家康がつくったお城で、歩くとキュッと鳴る「うぐいす張り」の廊下があるよ。","s":"静かな夜、二条城の石垣が月に照らされる。"},{"t":"平安神宮","r":"へいあんじんぐう","d":"大きくて赤い鳥居がめじるしの神社で、広いお庭もすてきだよ。","s":"大きな鳥居の奥に、平安神宮の社殿が見える。"},{"t":"哲学の道","r":"てつがくのみち","d":"銀閣寺のちかくにある小道で、春は桜のトンネルになってとてもきれいだよ。","s":"桜の花びらが舞う、哲学の道をゆっくり歩く。"},{"t":"南禅寺","r":"なんぜんじ","d":"大きな山門とレンガの水路閣がある、とても立派なお寺だよ。","s":"苔むした石段の先に、南禅寺の山門が立つ。"},{"t":"大文字山","r":"だいもんじやま","d":"一乗寺からも見える山で、夏には「大」の字の火がともされるんだよ。","s":"夜になると、大文字山に赤い炎が浮かぶ。"},{"t":"五条大橋","r":"ごじょうおおはし","d":"牛若丸と弁慶が出会ったと言われる有名な橋だよ。","s":"月の光を受けて、五条大橋がしずかに佇む。"},{"t":"北野天満宮","r":"きたのてんまんぐう","d":"学問の神さま菅原道真をまつっていて、受験生がたくさんお参りにくるよ。","s":"梅のつぼみがふくらむ頃、北野天満宮はにぎわう。"},{"t":"下鴨神社","r":"しもがもじんじゃ","d":"糺の森という静かな森にかこまれた、とても古い神社だよ。","s":"糺の森を抜けた先に、下鴨神社の社が現れる。"},{"t":"上賀茂神社","r":"かみがもじんじゃ","d":"京都でもっとも古い神社のひとつで、白い砂で作った円すいの山が有名だよ。","s":"朝露にぬれた砂の上を、上賀茂神社の風が渡る。"},{"t":"三十三間堂","r":"さんじゅうさんげんどう","d":"千体もの仏さまがずらっとならんでいて、そのすがたに圧倒されるよ。","s":"静かに並ぶ千体の仏を、三十三間堂は抱いている。"},{"t":"龍安寺","r":"りょうあんじ","d":"白い砂と石だけで作られた石庭がある、世界的に有名なお寺だよ。","s":"十五の石が並ぶ庭を、龍安寺はそっと守る。"},{"t":"西陣","r":"にしじん","d":"美しい生地「西陣織」で有名な、京都の職人さんの街だよ。","s":"機の音が響く路地は、西陣と呼ばれている。"},{"t":"先斗町","r":"ぽんとちょう","d":"鴨川ぞいにある細い路地で、夜になると灯りがともってとても風情があるよ。","s":"細い路地に灯りがともり、先斗町の夜が始まる。"},{"t":"八坂神社","r":"やさかじんじゃ","d":"祇園祭のときに中心になる神社で、朱色の門がとても美しいよ。","s":"夜風に提灯が揺れると、八坂神社は華やぐ。"},{"t":"貴船","r":"きぶね","d":"夏でもすずしい山あいの場所で、川の上で食べる「川床」が楽しいよ。","s":"川のせせらぎに耳をすませば、貴船の夏を感じる。"},{"t":"大原","r":"おおはら","d":"京都の北にある静かな里で、三千院というお寺がとても有名だよ。","s":"山にかこまれた小さな里が、大原と呼ばれている。"},{"t":"修学院離宮","r":"しゅがくいんりきゅう","d":"一乗寺のちかくにある皇室のお庭で、山の上から見る景色がすばらしいよ。","s":"山すそに広がる庭園が、修学院離宮と呼ばれる。"},{"t":"陶芸","r":"とうげい","d":"土をこねてお皿やお茶碗をつくる芸術で、手で形をつくるのが楽しいよ。","s":"土をこねる手のひらに、陶芸のぬくもりが宿る。"},{"t":"染物","r":"そめもの","d":"布にきれいな色や模様をつける仕事で、京都ではとくに有名だよ。","s":"風にゆれる布から、染物の色があふれ出す。"},{"t":"友禅","r":"ゆうぜん","d":"布にうつくしい絵を描いて染める京都の伝統的な技法だよ。","s":"花や鳥が咲きほこる着物は、友禅と呼ばれている。"},{"t":"扇","r":"おうぎ","d":"パタパタとあおいで風をおくる道具で、きれいな絵がかいてあるよ。","s":"手の中でひらくと、扇はすずしい風を運ぶ。"},{"t":"筆","r":"ふで","d":"墨をつけて字や絵をかく道具で、やわらかい毛でできているよ。","s":"静かに紙をすべる筆から、言葉が生まれてゆく。"},{"t":"墨","r":"すみ","d":"すずりで水と一緒にすると黒い液になる、書道に使う道具だよ。","s":"静かな部屋にただよう香りは、墨のにおいだ。"},{"t":"和紙","r":"わし","d":"日本の伝統的な紙で、ふつうの紙よりもじょうぶで長もちするよ。","s":"やわらかな光をとおすその紙は、和紙と呼ばれる。"},{"t":"漆","r":"うるし","d":"木に塗るとピカピカに光る天然のぬり材で、お椀やお箸に使われるよ。","s":"何度も塗り重ねられて、漆は深い艶を持つ。"},{"t":"金箔","r":"きんぱく","d":"金をうすーくのばしたもので、工芸品やお菓子のかざりに使われるよ。","s":"光を受けてきらめく箔は、金箔と呼ばれている。"},{"t":"織物","r":"おりもの","d":"糸を組み合わせて布をつくることで、京都には美しい織物がたくさんあるよ。","s":"色とりどりの糸が重なり、織物ができあがる。"},{"t":"刺繍","r":"ししゅう","d":"針と糸で布に絵や模様をぬうことで、とても細かくてきれいだよ。","s":"布の上にそっと咲く花は、刺繍で描かれている。"},{"t":"焼き物","r":"やきもの","d":"土や石をこねて形をつくり、かまで焼いてつくるお皿やつぼのことだよ。","s":"土のぬくもりを残したうつわは、焼き物と呼ばれる。"},{"t":"茶碗","r":"ちゃわん","d":"お茶をのむための器で、ひとつひとつ手づくりで形がちがうのが楽しいよ。","s":"両手でそっと包むと、茶碗から湯気がのぼる。"},{"t":"花瓶","r":"かびん","d":"お花をいけるための器で、京都にはうつくしい焼き物の花瓶がたくさんあるよ。","s":"机の上に置かれた花瓶に、朝の光がとどく。"},{"t":"蒔絵","r":"まきえ","d":"漆の上に金や銀の粉で絵をえがく技法で、キラキラしてとても美しいよ。","s":"小さな星をちりばめたように、蒔絵の箱は光る。"},{"t":"屏風","r":"びょうぶ","d":"折りたたみ式の大きなついたてで、きれいな絵がかかれていることが多いよ。","s":"静かな景色をうつしとって、屏風はそこに立つ。"},{"t":"掛け軸","r":"かけじく","d":"絵や書を巻き物にして壁にかける日本の伝統的な飾りだよ。","s":"床の間にかけられた掛け軸が、部屋に静けさを添える。"},{"t":"七宝焼き","r":"しっぽうやき","d":"金属にガラスの粉をのせて焼くと、宝石みたいにきれいな模様ができるよ。","s":"色ガラスの光をまとって、七宝焼きの皿がかがやく。"},{"t":"竹細工","r":"たけざいく","d":"竹をうすく割って編んだり曲げたりして、かごや花入れをつくる仕事だよ。","s":"細くしなる竹を編んで、竹細工のかごができる。"},{"t":"西陣織","r":"にしじんおり","d":"京都の西陣で織られる高級な布で、金糸や銀糸をつかった美しい模様が特徴だよ。","s":"季節の花が織り込まれた帯は、西陣織と呼ばれる。"},{"t":"清水焼","r":"きよみずやき","d":"京都で作られる焼き物のことで、うつくしい色あいが人気だよ。","s":"手のひらをあたためるその湯呑みは、清水焼だ。"},{"t":"能面","r":"のうめん","d":"能というげきで使うお面で、角度によって表情がかわって見えるんだよ。","s":"無表情なはずのその顔に、能面は深い心を映す。"},{"t":"千代紙","r":"ちよがみ","d":"きれいな模様がプリントされた日本の紙で、折り紙にもつかうよ。","s":"小さな手が折り紙をすると、千代紙の鶴が生まれる。"},{"t":"組紐","r":"くみひも","d":"何本もの糸をあんで作るひもで、帯じめなどに使われるきれいな工芸品だよ。","s":"細い糸が結び合わさって、組紐の模様ができあがる。"},{"t":"箔押し","r":"はくおし","d":"金箔や銀箔をおして模様をつける技法で、本の表紙やお菓子の箱にも使われるよ。","s":"文字の上に光を宿すその技は、箔押しと呼ばれる。"},{"t":"大文字焼き","r":"だいもんじやき","d":"8月16日に山に「大」の字の火をともす京都の夏の風物詩だよ。","s":"山の上に大きな火文字が浮かぶ、大文字焼きの夜。"},{"t":"時代祭","r":"じだいまつり","d":"昔の衣装を着た人たちが行列する、京都三大祭りのひとつだよ。","s":"歴史の装束をまとった人々が、時代祭を練り歩く。"},{"t":"節分","r":"せつぶん","d":"2月はじめに「鬼は外、福は内」と言いながら豆をまく行事だよ。","s":"豆のにおいが家じゅうに満ちる、節分の夜がくる。"},{"t":"豆まき","r":"まめまき","d":"節分のときに豆を投げて悪い鬼を追いはらう、楽しい行事だよ。","s":"元気な声が家中にひびく、豆まきの季節がきた。"},{"t":"七夕","r":"たなばた","d":"7月7日に願いごとを短冊に書いて笹にかざる、星のお祭りだよ。","s":"笹の葉に願いをつるすと、七夕の夜が近づく。"},{"t":"お盆","r":"おぼん","d":"ご先祖さまが帰ってくるとされる夏の行事で、家族みんなでお迎えするよ。","s":"遠くにいた人の記憶がよみがえる、お盆の夕暮れ。"},{"t":"盆踊り","r":"ぼんおどり","d":"お盆のときにみんなで輪になっておどる、夏の楽しいイベントだよ。","s":"太鼓の音に合わせて輪をつくる、盆踊りの夜。"},{"t":"初詣","r":"はつもうで","d":"お正月に神社やお寺にお参りして、新しい年のお願いごとをすることだよ。","s":"白い息をはきながら並ぶ、初詣の長い行列。"},{"t":"除夜の鐘","r":"じょやのかね","d":"大みそかの夜に108回つく鐘の音で、新しい年を気持ちよくむかえるんだよ。","s":"夜空にひびく鐘の音が、除夜の鐘だと教えてくれる。"},{"t":"雛祭り","r":"ひなまつり","d":"3月3日に雛人形をかざって女の子のしあわせを願うお祭りだよ。","s":"小さな人形が段に並ぶと、雛祭りの春がくる。"},{"t":"端午の節句","r":"たんごのせっく","d":"5月5日にこいのぼりをあげて、男の子の元気な成長を願う日だよ。","s":"空を泳ぐこいのぼりが、端午の節句を知らせる。"},{"t":"十五夜","r":"じゅうごや","d":"秋の満月を見ながらお月見だんごをたべる、風流な行事だよ。","s":"まるい月が空にのぼる夜を、十五夜と呼んでいる。"},{"t":"お花見","r":"おはなみ","d":"桜の木の下でみんなでお弁当を食べたりして楽しむ、春のすてきな行事だよ。","s":"花びらの下でお弁当を広げる、お花見の午後。"},{"t":"葵祭","r":"あおいまつり","d":"京都三大祭りのひとつで、葵の葉をかざった行列が街を歩くよ。","s":"牛車がゆっくりと進む行列を、葵祭と呼んでいる。"},{"t":"鞍馬の火祭","r":"くらまのひまつり","d":"10月に鞍馬で行われる迫力まんてんの火のお祭りだよ。","s":"山道を照らす松明の炎が、鞍馬の火祭を彩る。"},{"t":"正月","r":"しょうがつ","d":"新しい年のはじまりをお祝いする日本でいちばん大きな行事だよ。","s":"新しい光が差しこむ朝を、正月と呼んでいる。"},{"t":"年越し","r":"としこし","d":"12月31日の夜に古い年をおくり新しい年をむかえることだよ。","s":"時計の針が静かに進む夜、年越しがそっと訪れる。"},{"t":"お月見","r":"おつきみ","d":"きれいな月を見ながらすすきをかざって秋の夜をたのしむ行事だよ。","s":"すすきをかざって月をながめる、お月見の夜がくる。"},{"t":"彼岸","r":"ひがん","d":"春と秋にご先祖さまのお墓まいりをする期間で、おはぎを食べたりするよ。","s":"赤い花がひっそりと道端に咲く頃を、彼岸と呼ぶ。"},{"t":"夏祭り","r":"なつまつり","d":"夏に行われるお祭りで、屋台がならんで花火があがってとてもにぎやかだよ。","s":"太鼓の音が夜の町にひびく、夏祭りが始まる。"},{"t":"秋祭り","r":"あきまつり","d":"実りの秋に感謝するお祭りで、おみこしが出たりしてにぎわうよ。","s":"神輿がゆっくりと村を進む、秋祭りの午後。"},{"t":"餅つき","r":"もちつき","d":"臼と杵をつかってぺったんぺったんとおもちをつく、年末の楽しい行事だよ。","s":"杵の音が冬の朝にひびきわたる、餅つきの日。"},{"t":"書き初め","r":"かきぞめ","d":"お正月に新年のめあてや好きな言葉を筆で書く伝統行事だよ。","s":"新しい年の願いを紙に書きつける、書き初めの朝。"},{"t":"成人式","r":"せいじんしき","d":"20歳になったことをお祝いする式で、はれ着を着ておとなの仲間入りをするんだよ。","s":"晴れ着に朝の光が降りそそぐ、成人式の日がくる。"},{"t":"おでん","r":"おでん","d":"大根やたまごをあったかいだし汁でにこんだ、冬にぴったりの料理だよ。","s":"湯気の立つ鍋を囲む夜は、おでんがよく似合う。"},{"t":"焼き芋","r":"やきいも","d":"さつまいもを焼いたもので、ほくほく甘くて冬のおやつにさいこうだよ。","s":"秋の風にのって届くにおいは、焼き芋のものだ。"},{"t":"たこ焼き","r":"たこやき","d":"まるい生地の中にたこが入った関西の名物で、外はカリカリ中はトロトロだよ。","s":"鉄板の上でくるりと回るのは、たこ焼きの玉だ。"},{"t":"お好み焼き","r":"おこのみやき","d":"キャベツやお肉を生地にまぜて焼く関西のソウルフードだよ。","s":"香ばしいにおいが路地に漂う、お好み焼きの店先。"},{"t":"うどん","r":"うどん","d":"太くてもちもちした食べもので、あたたかいおだしで食べるとほっとするよ。","s":"湯気の立つどんぶりの中で、うどんがゆれている。"},{"t":"そば","r":"そば","d":"そば粉からつくる細い食べもので、京都ではにしんそばが有名だよ。","s":"細く長いその麺は、そばと呼ばれている。"},{"t":"天ぷら","r":"てんぷら","d":"野菜やエビに衣をつけてカラッと揚げた料理で、サクサクでおいしいよ。","s":"油の中ではじける音がすると、天ぷらが揚がる。"},{"t":"寿司","r":"すし","d":"お酢で味つけしたごはんの上にお魚をのせた、日本を代表する食べものだよ。","s":"海の香りをのせた一皿は、寿司と呼ばれている。"},{"t":"おもち","r":"おもち","d":"もち米をついて作るやわらかい食べもので、お正月にはかかせないよ。","s":"炭火の上でゆっくりふくらむのは、おもちだ。"},{"t":"ぜんざい","r":"ぜんざい","d":"あまいあずきの汁におもちを入れたあったかいデザートで、冬にぴったりだよ。","s":"冷えた手をあたためる甘さは、ぜんざいのものだ。"},{"t":"わらび餅","r":"わらびもち","d":"プルプルとした食感のすずしいお菓子で、きな粉をかけて食べるとおいしいよ。","s":"きな粉の中でやさしく揺れるのは、わらび餅だ。"},{"t":"鯖寿司","r":"さばずし","d":"脂ののった鯖を使った押し寿司で、京都の伝統的な味だよ。","s":"竹の葉に包まれて香るのは、鯖寿司だ。"},{"t":"にしんそば","r":"にしんそば","d":"甘く煮たにしんをおそばにのせた京都の名物料理だよ。","s":"出汁の湯気が体を温める、にしんそばの一杯。"},{"t":"千枚漬け","r":"せんまいづけ","d":"かぶをうすーく切ってつけた京都の冬の漬物で、上品な味がするよ。","s":"冬の光のように薄く切られたのは、千枚漬けだ。"},{"t":"生麩","r":"なまふ","d":"もちもちした食感の食べもので、京都ではお料理にもお菓子にも使われるよ。","s":"お椀の中で静かに揺れる白いものは、生麩だ。"},{"t":"懐石料理","r":"かいせきりょうり","d":"季節の食材をうつくしく盛りつけた日本の伝統的なコース料理だよ。","s":"小さな器に季節が並ぶ食事を、懐石料理と呼ぶ。"},{"t":"湯葉","r":"ゆば","d":"豆乳をあたためたときにできるうすい膜で、とってもなめらかでおいしいよ。","s":"湯気の中でそっと持ち上がるのは、湯葉だ。"},{"t":"茶そば","r":"ちゃそば","d":"お茶を練りこんだ緑色のおそばで、香りがよくてさわやかな味だよ。","s":"器の中で緑色に光るのは、茶そばの麺だ。"},{"t":"ちりめん山椒","r":"ちりめんざんしょう","d":"小さなじゃこと山椒をいっしょに炊いた京都のごはんのおともだよ。","s":"小さな粒が春の香りを運ぶ、ちりめん山椒の味。"},{"t":"柚子","r":"ゆず","d":"さわやかな香りのする柑橘で、料理の香りづけやゆず湯に使われるよ。","s":"湯気の中にふわりと広がる香りは、柚子のものだ。"},{"t":"鹿","r":"しか","d":"奈良公園が有名だけど、京都の山にもいる、やさしい目をした動物だよ。","s":"森の奥で鹿が、そっと顔をあげて風をかぐ。"},{"t":"亀","r":"かめ","d":"長生きの象徴で、神社の池でのんびり甲羅干しをしているのを見かけるよ。","s":"池の底から亀が、ゆっくり水面へ上ってくる。"},{"t":"鯉","r":"こい","d":"お寺や神社の池をゆうゆうと泳ぐ大きな魚で、色とりどりでうつくしいよ。","s":"夕日を受けて鯉が、水面に金色の輪を描く。"},{"t":"つばめ","r":"つばめ","d":"春になるとやってきて軒先に巣をつくる鳥で、すばやく飛ぶ姿がかっこいいよ。","s":"春がくると、つばめが軒先に巣をつくる。"},{"t":"すずめ","r":"すずめ","d":"チュンチュンとないて街なかにもいる小さな鳥で、とても身近な存在だよ。","s":"朝になると、すずめが屋根で歌いはじめる。"},{"t":"梅","r":"うめ","d":"まだ寒い早春にさく花で、いい香りがして春がくることを教えてくれるよ。","s":"まだ寒い庭で、梅の花がそっとほころぶ。"},{"t":"藤","r":"ふじ","d":"むらさき色の花がすだれのように垂れさがる、とてもうつくしい花だよ。","s":"棚から紫の花房が垂れ、藤の香りがただよう。"},{"t":"菊","r":"きく","d":"秋に咲く日本を代表する花で、皇室の紋章にもなっているよ。","s":"秋の光を浴びて、菊が静かに咲いている。"},{"t":"杉","r":"すぎ","d":"まっすぐ高くのびる木で、京都の北山杉はとくに美しいことで有名だよ。","s":"まっすぐ伸びた杉の木を、静かな風が抜けてゆく。"},{"t":"しだれ桜","r":"しだれざくら","d":"枝がやわらかく垂れさがる桜で、まるで花のカーテンみたいだよ。","s":"風がふくたびに、しだれ桜の枝がやさしく揺れる。"},{"t":"紫陽花","r":"あじさい","d":"梅雨の時期にさく花で、青やむらさき、ピンクに色がかわるのがふしぎだよ。","s":"雨上がりの庭で、紫陽花の葉に水玉が光る。"},{"t":"蛍","r":"ほたる","d":"夏の夜にお尻を光らせて飛ぶ虫で、鴨川のちかくでも見られることがあるよ。","s":"夏の夜、川辺に小さな蛍の光がともる。"},{"t":"竹","r":"たけ","d":"すくすくまっすぐ伸びる植物で、かごやざるなどいろんなものに使われるよ。","s":"風がわたるたびに、竹の葉がさらさら鳴る。"},{"t":"萩","r":"はぎ","d":"秋の七草のひとつで、小さなむらさき色の花がたくさん咲くかわいい植物だよ。","s":"細い枝の先で、萩の花がふわりと揺れる。"},{"t":"睡蓮","r":"すいれん","d":"水の上にうかぶように咲く花で、お寺の池でよく見かけるよ。","s":"池の水面に、睡蓮の花がひっそり浮かぶ。"},{"t":"山茶花","r":"さざんか","d":"冬の寒い時期にも元気に咲く花で、垣根によく植えられているよ。","s":"冬の庭にひとつ、山茶花の花が咲いている。"},{"t":"柳","r":"やなぎ","d":"細い枝が風にゆれるすがたが美しい木で、川のほとりによく植えられているよ。","s":"川べりに立つ柳の枝が、水面をやさしくなでる。"},{"t":"桔梗","r":"ききょう","d":"むらさき色の星の形をした花で、昔からお寺のお庭に植えられてきたよ。","s":"夏の終わりに、桔梗の花が青紫色にひらく。"},{"t":"百合","r":"ゆり","d":"大きくて香りのよい花で、白い百合はとくに気品があるよ。","s":"風がそよぐたびに、百合の花が甘く香る。"},{"t":"鶴","r":"つる","d":"長生きの象徴とされる美しい鳥で、折り紙でもよく折られるよ。","s":"冬の空を、一羽の鶴が静かに渡ってゆく。"},{"t":"うぐいす","r":"うぐいす","d":"「ホーホケキョ」と美しい声でなく鳥で、春を告げる鳥として親しまれているよ。","s":"春の朝、うぐいすの声が庭にひびきわたる。"},{"t":"風情","r":"ふぜい","d":"なんとも言えない味わい深いようすのことで、京都の街にはこれがたっぷりあるよ。","s":"古い町並みには、独特の風情がただよっている。"},{"t":"趣","r":"おもむき","d":"しみじみとした味わいや感じのことで、古い建物や庭園に感じるよ。","s":"小さな庭にも、深い趣が宿っている。"},{"t":"粋","r":"いき","d":"さりげなくかっこいいようすのことで、おしゃれの最上級みたいな意味だよ。","s":"着こなしのひとつに、粋な心があらわれる。"},{"t":"雅","r":"みやび","d":"上品でうつくしいようすのことで、平安時代の貴族の世界を思わせるよ。","s":"静かな舞の中に、雅なひとときが流れる。"},{"t":"わびさび","r":"わびさび","d":"シンプルで静かなものの中に美しさを見つける、日本ならではの考え方だよ。","s":"欠けた茶碗にも、わびさびの美しさが宿る。"},{"t":"古風","r":"こふう","d":"昔ながらのやり方やようすのことで、京都の街にぴったりの言葉だよ。","s":"石畳の通りには、古風なたたずまいが残る。"},{"t":"凛","r":"りん","d":"きりっとして気高いようすのことで、冬の朝の空気みたいな感じだよ。","s":"冬の朝の空気は、凛としてすがすがしい。"},{"t":"奥ゆかしい","r":"おくゆかしい","d":"ひかえめだけど深い魅力があるようすのことで、日本人が大切にする美しさだよ。","s":"静かにほほえむその姿は、とても奥ゆかしい。"},{"t":"ひっそり","r":"ひっそり","d":"しずかでめだたないようすのことで、京都の路地裏にはひっそりした名店があるよ。","s":"木々の間に、小さな社がひっそりと立つ。"},{"t":"たたずまい","r":"たたずまい","d":"建物や人のそこにある雰囲気やようすのことで、京都のお寺のたたずまいは格別だよ。","s":"古い家の静かなたたずまいに、時の重みを感じる。"},{"t":"しっとり","r":"しっとり","d":"おちついてしずかな雰囲気のことで、雨の日の京都はしっとりしてすてきだよ。","s":"雨にぬれた夜の庭が、しっとりと静まる。"},{"t":"はんなり","r":"はんなり","d":"はなやかでやわらかいようすを表す京都ならではの言葉で、舞妓さんの雰囲気にぴったりだよ。","s":"京都の言葉には、はんなりとした響きがある。"},{"t":"ほのか","r":"ほのか","d":"かすかでうっすらとしたようすのことで、お香のほのかな香りなどに使うよ。","s":"梅の花から、ほのかな香りがただよってくる。"},{"t":"風雅","r":"ふうが","d":"上品で趣のあるようすのことで、和歌やお茶の世界によく使われる言葉だよ。","s":"茶室のひとときに、風雅な時間が流れてゆく。"},{"t":"情緒","r":"じょうちょ","d":"しみじみとした味わいのある雰囲気のことで、京都の街にはあふれているよ。","s":"夕暮れの町に、懐かしい情緒 :"じゆう","d":"やりたいことがやれて、しばられないこと。","s":"空を飛ぶ鳥たちは、どこまでも自由に見える。"},{"t":"特別","r":"とくべつ","d":"ほかとはちがう、とくべつなこと。お誕生日は特別な日だね。","s":"満月の夜だけは、境内の空気が特別に感じる。"},{"t":"普通","r":"ふつう","d":"いつもどおりで、とくにかわったところがないこと。","s":"いつもの散歩道は、なんでもない普通の景色。"},{"t":"不思議","r":"ふしぎ","d":"なんでだろうって、ふしぎに思うこと。","s":"夜に光る苔があるなんて、なんとも不思議な話。"},{"t":"得意","r":"とくい","d":"じょうずにできて、自信があること。","s":"となりの子は、木登りがとても得意だという。"},{"t":"苦手","r":"にがて","d":"うまくできなくて、ちょっとにがてなこと。","s":"おとなしい猫は、大きな音が苦手なようだ。"},{"t":"健康","r":"けんこう","d":"体がげんきで、びょうきじゃないこと。","s":"毎朝の散歩は、体を健康に保ってくれるらしい。"},{"t":"らんぼう","r":"らんぼう","d":"力まかせにあばれたり、ものをこわしたりすること。","s":"強い風は、庭の花をらんぼうに揺らしていく。"},{"t":"ていねい","r":"ていねい","d":"ひとつひとつ気をつけて、きちんとやること。","s":"石を積む職人の手つきは、とてもていねいだ。"},{"t":"いろいろ","r":"いろいろ","d":"たくさんの種類があって、さまざまなこと。","s":"道端の草花には、いろいろな色の名前がある。"},{"t":"まっすぐ","r":"まっすぐ","d":"曲がっていなくて、ぴーんとしていること。","s":"参道の松並木は、空へまっすぐ伸びている。"},{"t":"平気","r":"へいき","d":"こわくもなんともなくて、だいじょうぶなこと。","s":"小さな雨くらいなら、傘がなくても平気だという。"},{"t":"すなお","r":"すなお","d":"人の話をちゃんと聞いて、そのとおりにできること。","s":"子どもたちの笑い声は、いつもすなおなものだ。"},{"t":"のどか","r":"のどか","d":"ゆったりしていて、気持ちがおちつくようなこと。","s":"田んぼの広がる村は、風までのどかな場所。"},{"t":"なめらか","r":"なめらか","d":"でこぼこがなくて、つるんとしていること。","s":"川底の石は、水に磨かれてなめらかになった。"},{"t":"おだやか","r":"おだやか","d":"あらあらしくなくて、やさしくて静かなこと。","s":"夕暮れの湖面は、風もなくおだやかに光る。"},{"t":"まじめ","r":"まじめ","d":"ふざけないで、いっしょうけんめいにとりくむこと。","s":"毎朝掃除をするお坊さんは、とてもまじめな人。"},{"t":"急","r":"きゅう","d":"いきなりで、あわてちゃうこと。急な雨にはびっくりするね。","s":"山の天気は、急に変わることがあるという。"},{"t":"無事","r":"ぶじ","d":"けがも事故もなく、ぶじでいること。","s":"迷子になった子猫は、無事に家へ帰ってきた。"},{"t":"さわやか","r":"さわやか","d":"風が気持ちよくて、すっとするような気分のこと。","s":"朝の風は、木々の香りを運びさわやかに吹く。"},{"t":"ふわふわ","r":"ふわふわ","d":"雲やわたあめみたいに、やわらかくて軽い様子のこと。","s":"綿毛のたんぽぽは、風にのってふわふわ飛ぶ。"},{"t":"きらきら","r":"きらきら","d":"星や宝石みたいに、光がぴかぴか輝いている様子のこと。","s":"川面の光は、太陽を受けてきらきらと揺れる。"},{"t":"ぴかぴか","r":"ぴかぴか","d":"新品みたいにぴっかぴかに光っている様子のこと。","s":"磨かれたお寺の床は、鏡のようにぴかぴかだ。"},{"t":"にこにこ","r":"にこにこ","d":"うれしくて、顔がにこーっとほほえんでいる様子のこと。","s":"おばあさんはいつも、孫の顔を見てにこにこする。"},{"t":"わくわく","r":"わくわく","d":"楽しいことがありそうで、胸がドキドキする気持ちのこと。","s":"お祭りの前の夜は、みんなわくわくして眠れない。"},{"t":"どきどき","r":"どきどき","d":"心臓がバクバクして、ドキーンドキーンとなる様子のこと。","s":"初めての発表会は、胸がどきどきするものだ。"},{"t":"ぐるぐる","r":"ぐるぐる","d":"なんどもなんどもまわっている様子のこと。","s":"風車の羽根は、風を受けてぐるぐる回り続ける。"},{"t":"ころころ","r":"ころころ","d":"ボールみたいにころんところがっている様子のこと。","s":"山栗の実が、坂道をころころ転がっていく。"},{"t":"ぽかぽか","r":"ぽかぽか","d":"おひさまに当たっているみたいに、ぬくぬくあったかい様子のこと。","s":"縁側の日なたは、いつもぽかぽかと暖かい。"},{"t":"ひらひら","r":"ひらひら","d":"チョウや花びらが、風にのってゆれている様子のこと。","s":"桜の花びらが、風にのってひらひら舞い落ちる。"},{"t":"ぱちぱち","r":"ぱちぱち","d":"手をたたいたり、火がはぜたりする音のこと。","s":"焚き火の薪が、夜にぱちぱちと音を立てる。"},{"t":"ぺろぺろ","r":"ぺろぺろ","d":"犬がぺろっとなめているみたいな様子のこと。","s":"子犬は、差し出された手をぺろぺろとなめた。"},{"t":"もぐもぐ","r":"もぐもぐ","d":"口を動かして、おいしそうに食べている様子のこと。","s":"うさぎは、頬いっぱいに草をもぐもぐ食べる。"},{"t":"ごくごく","r":"ごくごく","d":"のどを鳴らして、おいしそうに飲んでいる様子のこと。","s":"汗をかいた後の水は、ごくごくと喉を通る。"},{"t":"すやすや","r":"すやすや","d":"気持ちよさそうに、ぐっすりねむっている様子のこと。","s":"縁側の猫は、日だまりの中ですやすや眠る。"},{"t":"ぐうぐう","r":"ぐうぐう","d":"いびきをかいて、ふかくねむっている様子のこと。","s":"お昼寝の犬は、大きな声でぐうぐう寝ている。"},{"t":"ぱたぱた","r":"ぱたぱた","d":"鳥がつばさを動かしたり、スリッパで歩いたりする音のこと。","s":"蝶々は、羽をぱたぱた動かして花へ向かう。"},{"t":"さらさら","r":"さらさら","d":"小川が流れるみたいに、すべすべで気持ちいい様子のこと。","s":"小川の水は、砂の上をさらさらと流れていく。"},{"t":"ざらざら","r":"ざらざら","d":"さわるとガサガサして、なめらかじゃない様子のこと。","s":"木の幹は、触れるとざらざらしている。"},{"t":"つるつる","r":"つるつる","d":"すべってころびそうなくらい、なめらかな様子のこと。","s":"磨かれた石畳は、雨の日にはつるつる滑る。"},{"t":"ぬるぬる","r":"ぬるぬる","d":"ぬめぬめしていて、つるっとすべる様子のこと。","s":"池のほとりの苔は、踏むとぬるぬるしている。"},{"t":"べたべた","r":"べたべた","d":"のりやシールみたいに、手にくっつく様子のこと。","s":"蜂蜜のついた指は、いつまでもべたべたのまま。"},{"t":"ぎざぎざ","r":"ぎざぎざ","d":"のこぎりの歯みたいに、とがったでこぼこがある様子のこと。","s":"もみじの葉っぱは、ふちがぎざぎざしている。"},{"t":"でこぼこ","r":"でこぼこ","d":"地面や道がたいらじゃなくて、がたがたしている様子のこと。","s":"山道は、石が転がりでこぼこしている。"},{"t":"ぐちゃぐちゃ","r":"ぐちゃぐちゃ","d":"ぐしゃぐしゃにまざって、めちゃくちゃになっている様子のこと。","s":"雨上がりの土は、歩くとぐちゃぐちゃになる。"},{"t":"ばらばら","r":"ばらばら","d":"あちこちに散らばって、まとまっていない様子のこと。","s":"落ち葉は、風に吹かれてばらばらに散っていく。"},{"t":"がたがた","r":"がたがた","d":"古いいすやまどが、ゆれたりきしんだりする音のこと。","s":"木戸は、風が吹くたびにがたがた鳴る。"},{"t":"ぶるぶる","r":"ぶるぶる","d":"寒さやこわさで、体がふるえている様子のこと。","s":"濡れた子犬は、寒さにぶるぶる震えていた。"},{"t":"がちがち","r":"がちがち","d":"寒くて体がかたまったり、氷みたいにカチカチになる様子のこと。","s":"冬の朝の地面は、霜でがちがちに凍っていた。"},{"t":"ぽつぽつ","r":"ぽつぽつ","d":"雨のしずくが、ぽつんぽつんと落ちてくる様子のこと。","s":"空から雨粒が、ぽつぽつと落ちてきた。"},{"t":"ざあざあ","r":"ざあざあ","d":"雨がたくさんふって、じゃあじゃあと音がする様子のこと。","s":"夕立の雨は、屋根をざあざあと打ち鳴らす。"},{"t":"しとしと","r":"しとしと","d":"小さい雨がしずかに、やさしくふっている様子のこと。","s":"梅雨の雨は、朝からしとしと降り続いていた。"},{"t":"ごろごろ","r":"ごろごろ","d":"雷が遠くでなっていたり、ものが転がったりする音のこと。","s":"遠くの空で、雷がごろごろと鳴っている。"},{"t":"びゅうびゅう","r":"びゅうびゅう","d":"強い風がふいて、ひゅうひゅうと音がする様子のこと。","s":"冬の風は、山からびゅうびゅう吹き下ろす。"},{"t":"そよそよ","r":"そよそよ","d":"やさしい風がそっとふいている、気持ちいい様子のこと。","s":"田んぼの稲は、風にそよそよと揺れている。"},{"t":"ぽんぽん","r":"ぽんぽん","d":"ボールをはずませたり、おなかをたたいたりする音のこと。","s":"たき火の中で、栗の実がぽんぽんとはぜる。"},{"t":"ぱくぱく","r":"ぱくぱく","d":"口を大きくあけて、どんどん食べている様子のこと。","s":"お腹をすかせた子は、おにぎりをぱくぱく食べた。"},{"t":"がぶがぶ","r":"がぶがぶ","d":"お水やジュースを、たくさんごくごく飲んでいる様子のこと。","s":"遊び疲れた子どもは、麦茶をがぶがぶ飲んだ。"},{"t":"にやにや","r":"にやにや","d":"ちょっとずるそうに、にやっとわらっている様子のこと。","s":"秘密を知っている子は、なぜかにやにや笑う。"},{"t":"めそめそ","r":"めそめそ","d":"しくしくと泣きそうな顔で、元気がない様子のこと。","s":"転んだ弟は、しばらくめそめそ泣いていた。"},{"t":"しくしく","r":"しくしく","d":"かなしくて、声をころして静かにないている様子のこと。","s":"悲しい話を聞いて、妹はしくしく泣きだした。"},{"t":"わんわん","r":"わんわん","d":"犬がほえている声をまねした言葉だよ。","s":"遠くの家から、犬のわんわんという声がした。"},{"t":"にゃんにゃん","r":"にゃんにゃん","d":"猫が鳴いている声をまねした言葉だよ。","s":"子猫がにゃんにゃんと鳴いて甘えている。"},{"t":"ぴよぴよ","r":"ぴよぴよ","d":"小さいひよこが鳴いている、かわいい声のこと。","s":"ひよこがぴよぴよと庭を歩き回る。"},{"t":"がおー","r":"がおー","d":"ライオンやきょうりゅうが大きな声でほえる音のこと。","s":"男の子ががおーと吠えて恐竜になりきる。"},{"t":"けろけろ","r":"けろけろ","d":"カエルが元気に鳴いている声のこと。","s":"池のカエルがけろけろと歌いだす。"},{"t":"ちゅんちゅん","r":"ちゅんちゅん","d":"スズメが朝に元気よく鳴いている声のこと。","s":"すずめがちゅんちゅんと朝を知らせる。"},{"t":"ぶんぶん","r":"ぶんぶん","d":"ハチやこん虫がとんでいるときの羽の音のこと。","s":"みつばちが花のまわりをぶんぶん飛ぶ。"},{"t":"ちくちく","r":"ちくちく","d":"針やとげがささるみたいに、チクッとする様子のこと。","s":"セーターの毛糸がちくちくとくすぐる。"},{"t":"ほかほか","r":"ほかほか","d":"できたてみたいに、ほんのりあたたかい様子のこと。","s":"できたてのごはんがほかほかと湯気を立てる。"},{"t":"もこもこ","r":"もこもこ","d":"セーターや雲みたいに、もくもくふくらんでいる様子のこと。","s":"白い雲がもこもこと空にうかんでいる。"},{"t":"のろのろ","r":"のろのろ","d":"カメみたいにゆっくりで、なかなか進まない様子のこと。","s":"かたつむりがのろのろと葉の上を進む。"},{"t":"すいすい","r":"すいすい","d":"魚みたいに気持ちよく、スムーズに進む様子のこと。","s":"魚が池の中をすいすいと泳いでいく。"},{"t":"てくてく","r":"てくてく","d":"いっぽいっぽ元気に歩いている様子のこと。","s":"小さな靴音がてくてくと道を進む。"},{"t":"とことこ","r":"とことこ","d":"小さい子が一生けんめい歩いている、かわいい様子のこと。","s":"子犬がとことこと後ろをついてくる。"},{"t":"よちよち","r":"よちよち","d":"赤ちゃんがまだ上手じゃないけど、がんばって歩く様子のこと。","s":"赤ちゃんがよちよちと一歩をふみだす。"},{"t":"ぴょんぴょん","r":"ぴょんぴょん","d":"うさぎみたいに、ぴょんぴょんとはねている様子のこと。","s":"うさぎが草原をぴょんぴょんとはねまわる。"},{"t":"ぐんぐん","r":"ぐんぐん","d":"どんどん大きくなったり、速くなったりする様子のこと。","s":"若い木がぐんぐんと空に向かって伸びる。"},{"t":"のびのび","r":"のびのび","d":"自由にリラックスして、気持ちよくすごしている様子のこと。","s":"子どもたちが公園でのびのびと遊んでいる。"},{"t":"いらいら","r":"いらいら","d":"思いどおりにいかなくて、ムカムカする気持ちのこと。","s":"待たされていらいらした気持ちが顔に出る。"},{"t":"うきうき","r":"うきうき","d":"楽しいことがあって、気持ちがルンルンしている様子のこと。","s":"遠足の朝はうきうきした気分で目がさめる。"},{"t":"そわそわ","r":"そわそわ","d":"落ちつかなくて、じっとしていられない様子のこと。","s":"発表の前はそわそわして落ち着かない。"},{"t":"おろおろ","r":"おろおろ","d":"どうしたらいいかわからなくて、あたふたしている様子のこと。","s":"道に迷っておろおろと立ちつくす。"},{"t":"ぼんやり","r":"ぼんやり","d":"頭がぼーっとして、なにも考えていない様子のこと。","s":"窓の外をぼんやりとながめている。"},{"t":"はきはき","r":"はきはき","d":"元気よく、はっきりとしゃべっている様子のこと。","s":"質問にはきはきと答える声が響く。"},{"t":"にょきにょき","r":"にょきにょき","d":"たけのこや芽がにょきっと出てくる様子のこと。","s":"たけのこが土からにょきにょきと顔を出す。"},{"t":"ぱらぱら","r":"ぱらぱら","d":"雨がぱらっとふったり、本をめくったりする音のこと。","s":"雨が屋根にぱらぱらと降り始めた。"},{"t":"とんとん","r":"とんとん","d":"ドアをノックしたり、肩をたたいたりする音のこと。","s":"木の扉をとんとんとやさしくたたく。"},{"t":"ぎゅっと","r":"ぎゅっと","d":"手や腕でしっかりにぎったり、だきしめたりする様子のこと。","s":"母が子どもをぎゅっとだきしめる。"},{"t":"ぴったり","r":"ぴったり","d":"サイズや形がちょうどよくて、すきまなく合う様子のこと。","s":"二人の心がぴったりと重なり合う。"},{"t":"虹","r":"にじ","d":"雨のあとに空に出る、7色のきれいな光の帯のこと。","s":"雨上がりの空に虹がそっと架かった。"},{"t":"空","r":"そら","d":"見上げるとずーっと広がっている、青くて大きな世界のこと。","s":"空はどこまでも青く広がっている。"},{"t":"雲","r":"くも","d":"空にぷかぷかうかんでいる、白いわたみたいなもののこと。","s":"白い雲がゆっくりと流れていく。"},{"t":"太陽","r":"たいよう","d":"昼間に空でぴかぴか光って、みんなをあたためてくれるお星さまのこと。","s":"太陽が山の向こうから顔を出す。"},{"t":"月","r":"つき","d":"夜の空に出てくる、まんまるだったり三日月だったりする光のこと。","s":"夜空に月が静かに浮かんでいる。"},{"t":"星","r":"ほし","d":"夜の空でちかちか光っている、小さくてきれいな光のこと。","s":"満天の星がきらきらとまたたく。"},{"t":"雨","r":"あめ","d":"空の雲から水のつぶが降ってくること。","s":"やさしい雨が土の匂いを運んでくる。"},{"t":"雪","r":"ゆき","d":"冬に空から白くてふわふわした氷のけっしょうが降ってくること。","s":"一片の雪がそっと手のひらに落ちる。"},{"t":"風","r":"かぜ","d":"空気が動いて、ひゅーっとふいてくるもののこと。","s":"やわらかな風が髪をなでていく。"},{"t":"雷","r":"かみなり","d":"空でゴロゴロ音がなって、ピカッと光ること。","s":"遠くで雷がゴロゴロと鳴っている。"},{"t":"台風","r":"たいふう","d":"とっても強い風と雨がいっしょにやってくる、大きなあらしのこと。","s":"台風が近づき木々が大きく揺れる。"},{"t":"きり","r":"きり","d":"白いもやもやが広がって、前が見えにくくなること。","s":"朝のきりが山をやさしく包みこむ。"},{"t":"しも","r":"しも","d":"寒い朝に草や地面につく、白くてきらきらした氷のつぶのこと。","s":"冷たいしもが庭の草を白くそめる。"},{"t":"つゆ","r":"つゆ","d":"6月ごろに雨の日がつづく季節のこと。あじさいがきれいだよ。","s":"葉先のつゆが朝日にきらめいている。"},{"t":"朝焼け","r":"あさやけ","d":"朝はやくに空がピンクやオレンジに色づくこと。","s":"東の空が朝焼けに染まっていく。"},{"t":"山","r":"やま","d":"土や岩がもりあがって、高くそびえているところのこと。","s":"山のいただきに雲がかかっている。"},{"t":"川","r":"かわ","d":"山から海にむかって、水がさらさら流れているところのこと。","s":"小さな川がさらさらと歌いながら流れる。"},{"t":"海","r":"うみ","d":"しょっぱい水がいっぱいの、とっても広い青い世界のこと。","s":"海の向こうに水平線が広がっている。"},{"t":"湖","r":"みずうみ","d":"山の中などにある、まわりを陸でかこまれた大きな水たまりのこと。","s":"静かな湖に山の影がうつっている。"},{"t":"森","r":"もり","d":"木がたくさん生えていて、うっそうとした緑の場所のこと。","s":"深い森の中で小鳥が鳴いている。"},{"t":"林","r":"はやし","d":"木が何本もならんで生えている場所のこと。森よりすこし明るいよ。","s":"竹の林を風がさわさわと通りぬける。"},{"t":"花","r":"はな","d":"植物がさかせる、色とりどりのきれいな部分のこと。","s":"小さな花が道ばたでほほえんでいる。"},{"t":"木","r":"き","d":"地面から生えて、枝や葉っぱをひろげている大きな植物のこと。","s":"大きな木の下で子どもたちが休む。"},{"t":"草","r":"くさ","d":"地面にぴたっと生えている、緑の小さい植物のこと。","s":"やわらかな草の上に寝ころんでみる。"},{"t":"葉っぱ","r":"はっぱ","d":"木や草についている、緑のひらひらした部分のこと。","s":"一枚の葉っぱが風に舞い落ちる。"},{"t":"石","r":"いし","d":"地面にころがっている、かたくてかたまったもののこと。","s":"丸い石が川底で光を受けている。"},{"t":"砂","r":"すな","d":"石がこなごなになった、さらさらした小さなつぶのこと。","s":"さらさらの砂が足の間からこぼれる。"},{"t":"土","r":"つち","d":"地面をつくっている、茶色でやわらかいもののこと。","s":"雨あがりの土がいいにおいをはなつ。"},{"t":"水","r":"みず","d":"コップに入れたり川に流れたりする、とうめいな液体のこと。","s":"冷たい水が谷を流れくだっていく。"},{"t":"火","r":"ひ","d":"めらめらと燃えている、あかるくてあつい光のこと。","s":"たき火の火がぱちぱちと音をたてる。"},{"t":"氷","r":"こおり","d":"水がこおって、カチカチにかたまったもののこと。","s":"池の氷がうっすらと張りはじめた。"},{"t":"春","r":"はる","d":"さくらが咲いてあたたかくなる、新しいスタートの季節のこと。","s":"春の光がそっと窓辺にさしこんでくる。"},{"t":"夏","r":"なつ","d":"太陽がぎらぎら照って、プールや海が楽しいあつい季節のこと。","s":"夏の光が真っ白な雲を明るく照らす。"},{"t":"秋","r":"あき","d":"葉っぱが赤や黄色に色づいて、すずしくなる季節のこと。","s":"秋の風が葉っぱの色を変えていく。"},{"t":"冬","r":"ふゆ","d":"雪がふって寒くなる、こたつやお鍋がうれしい季節のこと。","s":"冬の朝は白い息がふわりと消える。"},{"t":"つくし","r":"つくし","d":"春になると野原からにょきっと出てくる、かわいい植物のこと。","s":"土手のつくしがぴょこんと顔を出す。"},{"t":"たんぽぽ","r":"たんぽぽ","d":"春に黄色い花をさかせて、わたげを飛ばす野の花のこと。","s":"たんぽぽの綿毛が風に飛ばされていく。"},{"t":"さくら","r":"さくら","d":"春にピンクの花をたくさんさかせる、日本の春をつげる木のこと。","s":"さくらの花びらが川面をすべっていく。"},{"t":"どんぐり","r":"どんぐり","d":"秋にカシやナラの木から落ちてくる、小さいまるい実のこと。","s":"落ち葉の下にどんぐりがころんと転がる。"},{"t":"犬","r":"いぬ","d":"人間のいちばんの友だちで、しっぽをふってよろこぶ動物のこと。","s":"犬がしっぽをふって駆けよってくる。"},{"t":"猫","r":"ねこ","d":"にゃーと鳴いて、ふわふわの毛がきもちいいペットのこと。","s":"猫が窓辺で日なたぼっこをしている。"},{"t":"うさぎ","r":"うさぎ","d":"長い耳とまんまるのしっぽがかわいい、ぴょんぴょんはねる動物のこと。","s":"うさぎが耳をぴんと立てて草を食べる。"},{"t":"ハムスター","r":"はむすたー","d":"ほっぺに食べものをつめこむ、手のひらサイズの小さな動物のこと。","s":"ハムスターが小さな手でひまわりの種を持つ。"},{"t":"鳥","r":"とり","d":"空をとぶことができる、つばさのある動物のこと。","s":"鳥が朝の光の中を飛び立っていく。"},{"t":"金魚","r":"きんぎょ","d":"お祭りの金魚すくいでおなじみの、赤くてきれいなお魚のこと。","s":"金魚が水そうの中をゆらゆら泳ぐ。"},{"t":"カメ","r":"かめ","d":"硬いこうらを背おって、ゆっくり歩く動物のこと。","s":"カメがのんびりと甲羅を日にほす。"},{"t":"カエル","r":"かえる","d":"けろけろと鳴いて、ぴょんとジャンプする生きもののこと。","s":"カエルが葉の上でじっと雨を待つ。"},{"t":"ゾウ","r":"ぞう","d":"長い鼻と大きい体をもつ、陸でいちばん大きい動物のこと。","s":"ゾウが長い鼻で水をくみあげる。"},{"t":"キリン","r":"きりん","d":"首がとっても長くて、高い木の葉っぱを食べる動物のこと。","s":"キリンが高い木の葉を静かに食べる。"},{"t":"ライオン","r":"らいおん","d":"たてがみがかっこいい、百獣の王とよばれる動物のこと。","s":"ライオンが草原の風の中で目を閉じる。"},{"t":"トラ","r":"とら","d":"黄色と黒のしまもようがかっこいい、強い動物のこと。","s":"トラが木かげでゆっくりと横になる。"},{"t":"クマ","r":"くま","d":"森にすんでいる大きくて力持ちの動物で、はちみつが好きだよ。","s":"クマが冬の眠りにつく前に木の実を探す。"},{"t":"パンダ","r":"ぱんだ","d":"白と黒のもようがかわいくて、笹を食べるのが好きな動物のこと。","s":"パンダが竹をぽりぽりとかじっている。"},{"t":"サル","r":"さる","d":"木登りが得意で、人間ににた顔をしている動物のこと。","s":"サルが枝から枝へ身軽に飛びうつる。"},{"t":"ペンギン","r":"ぺんぎん","d":"よちよち歩くけど泳ぎは得意な、タキシードみたいな鳥のこと。","s":"ペンギンが氷の上をよちよちと歩く。"},{"t":"イルカ","r":"いるか","d":"海でぴょんとジャンプする、頭がよくてやさしい動物のこと。","s":"イルカが波の間をすべるように跳ねる。"},{"t":"クジラ","r":"くじら","d":"海にすむ世界でいちばん大きな動物のこと。","s":"クジラが大海原に静かに潮をふく。"},{"t":"タコ","r":"たこ","d":"足が8本あって、海の中にすんでいる生きもののこと。","s":"タコが岩のすきまにそっと身をかくす。"},{"t":"カニ","r":"かに","d":"はさみのような手を持っていて、横歩きをする生きもののこと。","s":"カニが横歩きで砂浜をわたっていく。"},{"t":"チョウ","r":"ちょう","d":"きれいなもようの羽で、花から花へひらひらとぶ虫のこと。","s":"チョウが花から花へふわりと舞う。"},{"t":"テントウムシ","r":"てんとうむし","d":"赤い体に黒い水玉もようがついた、小さくてまるい虫のこと。","s":"テントウムシが葉先でひと休みしている。"},{"t":"カブトムシ","r":"かぶとむし","d":"りっぱなツノがかっこいい、夏に人気の大きな虫のこと。","s":"カブトムシが夜の木の蜜に集まってくる。"},{"t":"セミ","r":"せみ","d":"夏になるとミーンミーンと元気に鳴く虫のこと。","s":"セミが夏の木にとまって鳴きだす。"},{"t":"トンボ","r":"とんぼ","d":"すーっとまっすぐ飛んで、空中でぴたっと止まれる虫のこと。","s":"トンボが水面をすれすれに飛んでいく。"},{"t":"ホタル","r":"ほたる","d":"夏の夜にお尻がぴかぴか光る、すてきな虫のこと。","s":"ホタルが夜の川辺にやさしく光る。"},{"t":"アリ","r":"あり","d":"小さい体で列をつくって、えさをはこぶ働き者の虫のこと。","s":"アリの行列が一列になって歩いていく。"},{"t":"ミツバチ","r":"みつばち","d":"花のみつを集めて、おいしいハチミツをつくる虫のこと。","s":"ミツバチが花から蜜を集めて回る。"},{"t":"ネズミ","r":"ねずみ","d":"小さくてすばしっこい、チューチュー鳴く動物のこと。","s":"ネズミが小さな穴に急いでかくれる。"},{"t":"リス","r":"りす","d":"ふさふさのしっぽで木を走りまわる、どんぐりが大好きな動物のこと。","s":"リスが木の実をほおばって走りまわる。"},{"t":"コアラ","r":"こあら","d":"ユーカリの木にしがみついて、いつもねむそうな動物のこと。","s":"コアラがユーカリの木でぐっすり眠る。"},{"t":"ヒツジ","r":"ひつじ","d":"もこもこの白い毛がふわふわで、メーメーと鳴く動物のこと。","s":"ヒツジの群れが牧場でゆっくり草を食む。"},{"t":"ウマ","r":"うま","d":"走るのがとっても速くて、人をのせてくれる大きな動物のこと。","s":"ウマが広い野原を風のように駆ける。"},{"t":"ブタ","r":"ぶた","d":"ブーブーと鳴いて、まるくてピンクの鼻がかわいい動物のこと。","s":"ブタが泥の中で気持ちよさそうにねむる。"},{"t":"ニワトリ","r":"にわとり","d":"朝にコケコッコーと鳴いておこしてくれる、たまごをうむ鳥のこと。","s":"ニワトリが朝いちばんに大きな声で鳴く。"},{"t":"アヒル","r":"あひる","d":"ガーガーと鳴いて、よちよち歩くすがたがかわいい鳥のこと。","s":"アヒルが列になって池を渡っていく。"},{"t":"スズメ","r":"すずめ","d":"茶色くて小さくて、町のどこにでもいるチュンチュン鳴く鳥のこと。","s":"スズメが電線に並んでおしゃべりする。"},{"t":"カラス","r":"からす","d":"黒い体でカーカーと鳴く、とても頭がいい鳥のこと。","s":"カラスが夕暮れの空を横切っていく。"},{"t":"フクロウ","r":"ふくろう","d":"夜にホーホーと鳴く、くりくりお目めの鳥のこと。","s":"フクロウが夜の森でじっと目を光らせる。"},{"t":"ダンゴムシ","r":"だんごむし","d":"さわるとまるくなる、石の下にいる小さな虫のこと。","s":"ダンゴムシがさわると丸くなって隠れる。"},{"t":"赤","r":"あか","d":"りんごやトマトの色で、信号では「止まれ」のしるしだよ。","s":"赤いポストが角にぽつんと立っている。"},{"t":"青","r":"あお","d":"空や海みたいな色で、さわやかで気持ちいい色のこと。","s":"青い空にひとすじの飛行機雲がのびる。"},{"t":"黄色","r":"きいろ","d":"バナナやひまわりみたいに、ぱっと目立つ明るい色のこと。","s":"黄色い花が畑いっぱいにゆれている。"},{"t":"緑","r":"みどり","d":"葉っぱや草の色で、自然がいっぱいなイメージの色のこと。","s":"緑の葉が風にさらさらと揺れる。"},{"t":"白","r":"しろ","d":"雪やうさぎみたいな色で、なにもまざっていないきれいな色のこと。","s":"白い雲がゆっくり形を変えていく。"},{"t":"黒","r":"くろ","d":"夜の空やカラスの体みたいな、いちばん暗い色のこと。","s":"黒い猫が塀の上を静かに歩いていく。"},{"t":"ピンク","r":"ぴんく","d":"さくらやフラミンゴみたいな、やさしくてかわいい色のこと。","s":"ピンクの花びらが手のひらに舞いおりる。"},{"t":"オレンジ","r":"おれんじ","d":"みかんや夕焼けみたいな、あたたかくて元気な色のこと。","s":"オレンジの夕日が海を染めていく。"},{"t":"むらさき","r":"むらさき","d":"ぶどうやラベンダーみたいな、赤と青をまぜた色のこと。","s":"むらさきの朝顔が垣根にからみつく。"},{"t":"茶色","r":"ちゃいろ","d":"チョコレートや土みたいな、ぬくもりのある色のこと。","s":"茶色い落ち葉が道いっぱいに積もる。"},{"t":"はいいろ","r":"はいいろ","d":"白と黒のあいだくらいの色で、くもりの日の空みたいな色のこと。","s":"はいいろの雲が今にも雨を降らせそう。"},{"t":"金色","r":"きんいろ","d":"きんぴかに光っていて、とくべつでごうかな色のこと。","s":"金色の稲穂が夕風にゆれて光っている。"},{"t":"銀色","r":"ぎんいろ","d":"きらりと光っていて、すずしくてかっこいい色のこと。","s":"銀色の月がしずかに川を照らす。"},{"t":"水色","r":"みずいろ","d":"空や水みたいな、うすくてさわやかな青のこと。","s":"水色のリボンが風になびいている。"},{"t":"丸","r":"まる","d":"ボールやお月さまみたいに、まるくなった形のこと。","s":"丸いボールが坂道をころころ転がる。"},{"t":"三角","r":"さんかく","d":"おにぎりや三角定規みたいに、かどが3つある形のこと。","s":"三角のおにぎりを両手で持ってみる。"},{"t":"四角","r":"しかく","d":"箱やノートみたいに、かどが4つある形のこと。","s":"四角い箱の中に思い出をしまいこむ。"},{"t":"星形","r":"ほしがた","d":"お星さまみたいに、とんがりが何個かある形のこと。","s":"星形のクッキーをそっと窓辺に並べる。"},{"t":"ハート","r":"はーと","d":"だいすきの気持ちをあらわす、ぷっくりした形のこと。","s":"ハートの形をした葉っぱを見つけた。"},{"t":"丸い","r":"まるい","d":"ボールやお月さまみたいに、まんまるな様子のこと。","s":"丸い石を海辺でひとつ拾ってみる。"},{"t":"四角い","r":"しかくい","d":"箱みたいに、かどがあってしかくい様子のこと。","s":"四角い窓から夕日がさしこんでくる。"},{"t":"細長い","r":"ほそながい","d":"ほそくて長い形のこと。えんぴつやストローは細長いね。","s":"細長い橋が川の向こうまで続いている。"},{"t":"まんまる","r":"まんまる","d":"丸よりもっとまるくて、ぱんぱんにまるい様子のこと。","s":"まんまるのお月さまが夜空にうかぶ。"},{"t":"でっかい","r":"でっかい","d":"すごく大きいことを元気よくいうときの言い方だよ。","s":"でっかいスイカを両手で抱えてみる。"},{"t":"ちっちゃい","r":"ちっちゃい","d":"すごく小さいことをかわいくいうときの言い方だよ。","s":"ちっちゃいありがせっせと歩いている。"},{"t":"ぺったんこ","r":"ぺったんこ","d":"ぺちゃんとつぶれて、たいらになっている様子のこと。","s":"つぶれたボールがぺったんこになる。"},{"t":"真っ赤","r":"まっか","d":"これ以上ないくらい赤い、まっかっかな様子のこと。","s":"夕焼けが空を真っ赤に染めていく。"},{"t":"真っ白","r":"まっしろ","d":"よごれがまったくない、まっしろしろな様子のこと。","s":"新雪が庭を真っ白におおいつくす。"},{"t":"真っ黒","r":"まっくろ","d":"すみをぬったように、まっくろくろな様子のこと。","s":"焦げたパンが真っ黒になってしまった。"},{"t":"とうめい","r":"とうめい","d":"むこう側がすけて見えること。ガラスや水はとうめいだね。","s":"とうめいな水が川底の石を見せている。"},{"t":"うれしい","r":"うれしい","d":"いいことがあって、心がぱあっとあかるくなる気持ちのこと。","s":"手紙が届いてうれしい気持ちになる。"},{"t":"悲しい","r":"かなしい","d":"つらいことがあって、涙が出そうになる気持ちのこと。","s":"別れの日は少し悲しい気持ちになる。"},{"t":"楽しい","r":"たのしい","d":"わくわくして、ずっとこうしていたいなと思う気持ちのこと。","s":"友だちと遊ぶ時間はとても楽しい。"},{"t":"さびしい","r":"さびしい","d":"ひとりぼっちで、だれかにそばにいてほしい気持ちのこと。","s":"ひとりの部屋が少しさびしく感じる。"},{"t":"はずかしい","r":"はずかしい","d":"顔が赤くなって、みんなに見られたくない気持ちのこと。","s":"名前を呼ばれてはずかしくなった。"},{"t":"くやしい","r":"くやしい","d":"まけたりしっぱいしたりして、もう一回がんばりたい気持ちのこと。","s":"一歩およばずくやしい思いをする。"},{"t":"なつかしい","r":"なつかしい","d":"むかしのことを思い出して、あったかい気持ちになること。","s":"古い写真を見るとなつかしい気持ちになる。"},{"t":"安心","r":"あんしん","d":"こわいことや心配がなくなって、ほっとする気持ちのこと。","s":"母の声を聞くと安心してねむれる。"},{"t":"不安","r":"ふあん","d":"これからどうなるかわからなくて、心がもやもやする気持ちのこと。","s":"初めての道は少し不安な気持ちになる。"},{"t":"心配","r":"しんぱい","d":"だいじょうぶかなと気になって、落ちつかない気持ちのこと。","s":"帰りが遅い友だちを心配して待つ。"},{"t":"たいくつ","r":"たいくつ","d":"やることがなくて、なんだかひまで面白くない気持ちのこと。","s":"雨の日の午後はたいくつに感じる。"},{"t":"びっくり","r":"びっくり","d":"思ってもみないことが起きて、おどろいた気持ちのこと。","s":"大きな音にびっくりして飛びあがる。"},{"t":"がっかり","r":"がっかり","d":"たのしみにしていたのに、うまくいかなくてしょんぼりすること。","s":"楽しみにしていた花火が中止でがっかりする。"},{"t":"しょんぼり","r":"しょんぼり","d":"元気がなくなって、肩を落としている様子のこと。","s":"雨の日は心もしょんぼりと丸くなる。"},{"t":"ごきげん","r":"ごきげん","d":"にこにこして、とっても気分がいい様子のこと。","s":"朝の光を浴びて、猫もごきげんそうにあくびした。"},{"t":"勇気","r":"ゆうき","d":"こわくても「やるぞ！」と思える、強い心のこと。","s":"小さな一歩が、大きな勇気になる。"},{"t":"やる気","r":"やるき","d":"がんばろう！と思える、前向きな気持ちのこと。","s":"朝ごはんを食べると、やる気がむくむく湧いてきた。"},{"t":"笑顔","r":"えがお","d":"にこっとわらった、みんなを元気にするすてきな顔のこと。","s":"ひまわりのような笑顔が、教室いっぱいに咲いた。"},{"t":"涙","r":"なみだ","d":"泣いたときに目からぽろぽろ出てくる、しずくのこと。","s":"こぼれた涙が、頬をつたって光った。"},{"t":"怒り","r":"いかり","d":"ひどいことをされて、むかっとする気持ちのこと。","s":"怒りは夕立のように、すぐに空を晴れさせた。"},{"t":"喜び","r":"よろこび","d":"うれしいことがあったときの、心がはずむ気持ちのこと。","s":"喜びが胸の中で、小鳥のように跳ねた。"},{"t":"やきもち","r":"やきもち","d":"好きな人がほかの人と仲よくしていて、いやだなと思う気持ちのこと。","s":"弟にだけおやつが多くて、少しやきもちを焼いた。"},{"t":"すっきり","r":"すっきり","d":"もやもやがなくなって、気持ちが晴れた様子のこと。","s":"掃除を終えた部屋は、すっきりと風が通った。"},{"t":"うんざり","r":"うんざり","d":"もういやだなあと思って、あきあきしている気持ちのこと。","s":"長い雨続きに、少しうんざりしてしまう。"},{"t":"にっこり","r":"にっこり","d":"やさしく静かにほほえむ、あたたかい笑顔のこと。","s":"おじいちゃんがにっこり笑うと、部屋が明るくなった。"},{"t":"あこがれ","r":"あこがれ","d":"すてきな人やものに「ああなりたいな」と思う気持ちのこと。","s":"空を飛ぶ鳥に、ずっとあこがれていた。"},{"t":"ときめき","r":"ときめき","d":"すてきなことに出会って、胸がきゅんとする気持ちのこと。","s":"初めての場所には、いつもときめきがあった。"},{"t":"感謝","r":"かんしゃ","d":"だれかにしてもらったことを「ありがとう」と思う気持ちのこと。","s":"お日さまの光に、そっと感謝をつぶやいた。"},{"t":"誇り","r":"ほこり","d":"じぶんやだれかのことを「すごいな」とうれしく思う気持ちのこと。","s":"この町で育ったことが、ぼくの誇りだった。"},{"t":"思いやり","r":"おもいやり","d":"ほかの人の気持ちを考えて、やさしくする心のこと。","s":"小さな思いやりが、誰かの心をあたためる。"},{"t":"きんちょう","r":"きんちょう","d":"ドキドキして、体がかたくなっちゃう気持ちのこと。","s":"発表の前は、心臓がきんちょうでどきどきした。"},{"t":"わがまま","r":"わがまま","d":"じぶんのやりたいことばかりいって、人のことを考えないこと。","s":"少しくらいわがままを言っても、太陽は許してくれる。"},{"t":"つらい","r":"つらい","d":"心がぎゅうっと苦しくて、がまんするのが大変な気持ちのこと。","s":"坂道を登るのはつらいけれど、頂上には星が見える。"},{"t":"ありがたい","r":"ありがたい","d":"だれかのやさしさに「うれしいな」としみじみ思う気持ちのこと。","s":"誰かがそばにいることが、とてもありがたいと思えた。"},{"t":"たのもしい","r":"たのもしい","d":"この人がいれば安心だなと思える、しっかりした様子のこと。","s":"大きな木は、いつだってたのもしい顔をしている。"},{"t":"せつない","r":"せつない","d":"胸がきゅっとなる、ちょっとかなしくてあまい気持ちのこと。","s":"夕焼けを見ていると、少しせつない気持ちになる。"},{"t":"ほっこり","r":"ほっこり","d":"心がぽかぽかして、やさしい気持ちになること。","s":"あたたかいお茶を飲むと、心までほっこりする。"},{"t":"のんき","r":"のんき","d":"あわてないで、のーんびりかまえている様子のこと。","s":"猫はのんきに、日なたで丸くなっていた。"},{"t":"あせり","r":"あせり","d":"はやくしなきゃと思って、心がざわざわする気持ちのこと。","s":"遅刻しそうで、あせりが胸をかけぬけた。"},{"t":"ほのぼの","r":"ほのぼの","d":"見ていると気持ちがあたたかくなるような、やわらかい様子のこと。","s":"家族の笑い声に、ほのぼのとした夜が過ぎていく。"},{"t":"おにぎり","r":"おにぎり","d":"ごはんを手でにぎって作る、三角や丸い形の食べ物だよ。","s":"母が握ったおにぎりには、いつも星の形があった。"},{"t":"たまごやき","r":"たまごやき","d":"たまごをといて、フライパンでくるくる巻きながら焼いた料理だよ。","s":"甘いたまごやきが、お弁当箱の隅で光っていた。"},{"t":"カレーライス","r":"かれーらいす","d":"スパイスのきいたルーをごはんにかけて食べる、みんな大好きな料理だよ。","s":"雨の日の夕食は、決まってカレーライスだった。"},{"t":"お寿司","r":"おすし","d":"すめしの上にお魚などをのせた、日本のごちそうだよ。","s":"お祝いの日には、いつもお寿司が食卓に並んだ。"},{"t":"ハンバーグ","r":"はんばーぐ","d":"ひき肉をこねて丸く焼いた、子どもに人気のおかずだよ。","s":"ふわふわのハンバーグから、湯気がのぼっていく。"},{"t":"からあげ","r":"からあげ","d":"とり肉に味をつけて油であげた、カリカリでジューシーな食べ物だよ。","s":"からあげのにおいが、台所いっぱいに広がった。"},{"t":"コロッケ","r":"ころっけ","d":"じゃがいもやお肉をまぜて、パン粉をつけて揚げた食べ物だよ。","s":"揚げたてのコロッケを、ふうふう冷まして食べた。"},{"t":"サラダ","r":"さらだ","d":"新鮮な野菜をお皿にもって、ドレッシングをかけて食べる料理だよ。","s":"庭でとれた野菜が、サラダになって並んだ。"},{"t":"みそしる","r":"みそしる","d":"おみそをといたあたたかいスープで、朝ごはんによく出るよ。","s":"湯気の立つみそしるが、朝の食卓をあたためる。"},{"t":"パン","r":"ぱん","d":"小麦粉をこねてオーブンで焼いた、ふわふわの食べ物だよ。","s":"焼きたてのパンの香りが、通りまで漂っていた。"},{"t":"ケーキ","r":"けーき","d":"スポンジにクリームやフルーツをかざった、おたんじょう日のおかしだよ。","s":"誕生日には、いちごのケーキが用意されていた。"},{"t":"アイスクリーム","r":"あいすくりーむ","d":"ミルクやさとうを冷たくかためた、夏にうれしいおかしだよ。","s":"夏の午後、アイスクリームがゆっくり溶けていく。"},{"t":"チョコレート","r":"ちょこれーと","d":"カカオから作られた、あまくてとろけるおかしだよ。","s":"ポケットのチョコレートが、少しやわらかくなっていた。"},{"t":"クッキー","r":"くっきー","d":"小麦粉とバターで作って焼いた、サクサクのおかしだよ。","s":"焼きたてのクッキーの香りが、部屋いっぱいに広がった。"},{"t":"プリン","r":"ぷりん","d":"たまごと牛乳で作った、ぷるぷるしたあまいおかしだよ。","s":"冷蔵庫のプリンを、こっそり一口食べてみた。"},{"t":"ゼリー","r":"ぜりー","d":"果物のしるをかためた、つるんとした冷たいおかしだよ。","s":"冷たいゼリーが、夏の日差しにきらきら光った。"},{"t":"おせんべい","r":"おせんべい","d":"お米をうすくのばして焼いた、パリパリのおかしだよ。","s":"縁側で、おせんべいをかじる音がぱりぱり響いた。"},{"t":"りんご","r":"りんご","d":"秋にとれる赤い果物で、シャキシャキした歯ごたえがあるよ。","s":"赤いりんごが、木の枝でゆれていた。"},{"t":"みかん","r":"みかん","d":"冬によく食べるオレンジ色の果物で、手でかわがむけるよ。","s":"こたつの上に、みかんが山になって並んでいた。"},{"t":"バナナ","r":"ばなな","d":"黄色くて長い形の果物で、かわをむいてそのまま食べられるよ。","s":"黄色いバナナが、朝ごはんの主役になった。"},{"t":"いちご","r":"いちご","d":"赤くて小さい果物で、あまずっぱくてケーキにものるよ。","s":"甘いいちごを、そっとケーキの上にのせた。"},{"t":"ぶどう","r":"ぶどう","d":"むらさきや黄緑の小さな実がたくさんついた、あまい果物だよ。","s":"紫のぶどうが、房になって垂れさがっていた。"},{"t":"すいか","r":"すいか","d":"夏に食べる大きくて緑のしましまの果物で、中は赤くてあまいよ。","s":"夏の縁側で、すいかを分け合って食べた。"},{"t":"メロン","r":"めろん","d":"あみもようのある高級な果物で、とってもあまいよ。","s":"甘い香りのメロンが、食卓にどんと置かれた。"},{"t":"もも","r":"もも","d":"うすいピンク色でやわらかくて、あまいしるがたっぷりの果物だよ。","s":"桃色のももが、水にひやされて光っていた。"},{"t":"さくらんぼ","r":"さくらんぼ","d":"小さくて赤い実が二つならんでいる、かわいい果物だよ。","s":"小さなさくらんぼが、二つ仲良く並んでいた。"},{"t":"トマト","r":"とまと","d":"赤くて丸い野菜で、サラダやケチャップに使われるよ。","s":"真っ赤なトマトが、畑の中で光を集めていた。"},{"t":"にんじん","r":"にんじん","d":"オレンジ色の長い野菜で、カレーやサラダによく入っているよ。","s":"オレンジ色のにんじんが、土の中で育っていた。"},{"t":"きゅうり","r":"きゅうり","d":"緑色で細長い野菜で、ポリポリした食感がたのしいよ。","s":"冷たいきゅうりをかじると、夏の音がした。"},{"t":"たまねぎ","r":"たまねぎ","d":"丸い形の野菜で、切ると涙が出るけど炒めるとあまくなるよ。","s":"たまねぎを刻むと、涙がぽろりとこぼれた。"},{"t":"じゃがいも","r":"じゃがいも","d":"土の中にできる丸い野菜で、カレーやポテトサラダに使うよ。","s":"土の中から、丸いじゃがいもが顔を出した。"},{"t":"ピーマン","r":"ぴーまん","d":"緑色の野菜でちょっとにがいけど、栄養がいっぱいだよ。","s":"苦いピーマンも、少しずつ好きになっていった。"},{"t":"とうもろこし","r":"とうもろこし","d":"黄色い粒がいっぱいならんだ、夏においしい野菜だよ。","s":"夏の畑で、とうもろこしが黄金色に輝いていた。"},{"t":"すっぱい","r":"すっぱい","d":"レモンやうめぼしみたいに、口がすぼまるような味のことだよ。","s":"すっぱいレモンを思うだけで、口の中が変わる。"},{"t":"にがい","r":"にがい","d":"ピーマンやお薬みたいな、ちょっと食べにくい味のことだよ。","s":"薬はにがいけれど、元気になる味がした。"},{"t":"あまい","r":"あまい","d":"さとうやチョコレートみたいに、おいしくてしあわせな味のことだよ。","s":"あまい香りが、パン屋の前に漂っていた。"},{"t":"からい","r":"からい","d":"とうがらしみたいに、口がヒリヒリする味のことだよ。","s":"少しからいカレーに、汗がにじんだ。"},{"t":"おべんとう","r":"おべんとう","d":"おかずやごはんを箱につめて持っていく、お昼ごはんのことだよ。","s":"母の作るおべんとうには、いつも愛情が詰まっていた。"},{"t":"おやつ","r":"おやつ","d":"お昼ごはんとよるごはんのあいだに食べる、おかしや果物のことだよ。","s":"三時になると、おやつの匂いが家中に広がる。"},{"t":"ごはん","r":"ごはん","d":"お米をたいて作った白い食べ物で、毎日食べるものだよ。","s":"あたたかいごはんの湯気が、窓ガラスをくもらせた。"},{"t":"おかず","r":"おかず","d":"ごはんといっしょに食べる、お肉や野菜の料理のことだよ。","s":"今日のおかずは、なんだろうとわくわくした。"},{"t":"たいやき","r":"たいやき","d":"おさかなの形をした生地の中に、あんこが入ったおかしだよ。","s":"湯気の立つたいやきを、ふうふう冷まして食べた。"},{"t":"やきいも","r":"やきいも","d":"さつまいもをじっくり焼いた、あまくてほくほくの食べ物だよ。","s":"冬の空気に、やきいもの甘い香りがまじる。"},{"t":"おだんご","r":"おだんご","d":"お米の粉をまるめてゆでた、もちもちした和がしだよ。","s":"三色のおだんごが、串にちょこんと並んでいた。"},{"t":"わたあめ","r":"わたあめ","d":"さとうをくるくる回してふわっと作る、お祭りで人気のおかしだよ。","s":"祭りの夜、わたあめが雲のようにふくらんでいく。"},{"t":"かきごおり","r":"かきごおり","d":"氷をけずってシロップをかけた、夏の冷たいおかしだよ。","s":"夏祭りの屋台で、かきごおりを一口食べた。"},{"t":"ホットケーキ","r":"ほっとけーき","d":"まるくてあまい生地を焼いて、バターやはちみつをかけて食べるよ。","s":"週末の朝は、ホットケーキの甘い匂いで目が覚める。"},{"t":"サンドイッチ","r":"さんどいっち","d":"パンにハムや野菜やたまごをはさんだ食べ物だよ。","s":"遠足の日の朝、サンドイッチをそっと包んだ。"},{"t":"おちゃ","r":"おちゃ","d":"茶葉にお湯をそそいで作る、日本の飲み物だよ。","s":"静かな午後に、おちゃの湯気がゆらゆらのぼる。"},{"t":"ジュース","r":"じゅーす","d":"果物などから作ったあまい飲み物で、子どもに人気だよ。","s":"冷たいジュースを飲むと、暑さが少しやわらいだ。"},{"t":"牛乳","r":"ぎゅうにゅう","d":"牛からとれる白い飲み物で、骨をじょうぶにしてくれるよ。","s":"冷たい牛乳を飲み干すと、口ひげができた。"},{"t":"ふりかけ","r":"ふりかけ","d":"ごはんの上にパラパラかける、味つきの小さな粒だよ。","s":"ごはんにふりかけをかけると、星空みたいになった。"},{"t":"おにく","r":"おにく","d":"牛やぶたやとりの身で、焼いたり煮たりして食べるよ。","s":"焼けたおにくの香りが、庭いっぱいに広がった。"},{"t":"たまご","r":"たまご","d":"にわとりが生む丸い食べ物で、ゆでたり焼いたりいろいろ使えるよ。","s":"白いたまごが、かごの中でそっと光っていた。"},{"t":"えんぴつ","r":"えんぴつ","d":"字や絵をかくための、木でできた細長い道具だよ。","s":"削りたてのえんぴつから、木のにおいがした。"},{"t":"けしゴム","r":"けしごむ","d":"えんぴつで書いたものをこすって消す、やわらかい道具だよ。","s":"小さなけしゴムが、失敗をそっと消してくれる。"},{"t":"はさみ","r":"はさみ","d":"紙やひもを切るための、二つの刃がついた道具だよ。","s":"銀色のはさみが、紙の上をすべっていく。"},{"t":"ノート","r":"のーと","d":"字や絵をかくための、紙をまとめてとじたものだよ。","s":"真っ白なノートに、今日の思い出を書いた。"},{"t":"ランドセル","r":"らんどせる","d":"小学生が教科書やノートを入れてせおうカバンだよ。","s":"新しいランドセルを背負って、初めての道を歩いた。"},{"t":"かさ","r":"かさ","d":"雨の日にさして使う、ぬれないようにする道具だよ。","s":"雨の日には、赤いかさが花のように開く。"},{"t":"ぼうし","r":"ぼうし","d":"頭にかぶって日ざしや寒さからまもる、かぶりものだよ。","s":"風が吹くたびに、ぼうしを両手でおさえた。"},{"t":"くつ","r":"くつ","d":"足にはいて歩くための、そとで使うはきものだよ。","s":"新しいくつが、少しだけ大きく感じた。"},{"t":"くつした","r":"くつした","d":"足にはく布でできたもので、くつの下にはくよ。","s":"片方だけのくつしたが、洗濯かごの中で迷子になった。"},{"t":"タオル","r":"たおる","d":"手や体をふくための、やわらかい布だよ。","s":"洗いたてのタオルから、お日さまの匂いがした。"},{"t":"せっけん","r":"せっけん","d":"手や体をあらうときに使う、あわが出るものだよ。","s":"お風呂場で、せっけんの泡がふわふわ舞った。"},{"t":"歯ブラシ","r":"はぶらし","d":"歯をみがくための、小さいブラシがついた道具だよ。","s":"朝と夜、歯ブラシが小さな冒険をしている。"},{"t":"かがみ","r":"かがみ","d":"自分の顔やすがたをうつして見るための、ぴかぴかした板だよ。","s":"かがみの中の自分が、少し照れて笑っていた。"},{"t":"まくら","r":"まくら","d":"ねるときに頭の下におく、やわらかいものだよ。","s":"やわらかいまくらに、眠気がそっと降りてきた。"},{"t":"ふとん","r":"ふとん","d":"ねるときに体の上にかけたり、下にしいたりするものだよ。","s":"あたたかいふとんの中で、夢が始まっていく。"},{"t":"時計","r":"とけい","d":"今が何時何分かをおしえてくれる道具だよ。","s":"時計の針が、静かに一日を数えていく。"},{"t":"電話","r":"でんわ","d":"はなれた人とおはなしするための道具だよ。","s":"遠くの声が、電話を通じて心に届いた。"},{"t":"テレビ","r":"てれび","d":"映像と音が出る大きな画面で、番組を見るものだよ。","s":"家族みんなで、テレビの前に集まった。"},{"t":"れいぞうこ","r":"れいぞうこ","d":"食べ物を冷やしておいしく保つための、大きな箱の機械だよ。","s":"れいぞうこを開けると、冷たい風が顔をなでた。"},{"t":"せんたくき","r":"せんたくき","d":"よごれた服を水とせんざいであらってくれる機械だよ。","s":"せんたくきが、朝の光の中でくるくる回る。"},{"t":"そうじき","r":"そうじき","d":"ゴミやほこりをすいとってくれる、おそうじの機械だよ。","s":"そうじきの音が、部屋の隅々を掃いていく。"},{"t":"おさら","r":"おさら","d":"ごはんやおかずをのせて食べるための、平たい食器だよ。","s":"洗ったおさらが、日差しの中できらきら光った。"},{"t":"おはし","r":"おはし","d":"食べ物をはさんで口に運ぶための、二本の細い棒だよ。","s":"二本のおはしが、仲良くごはんを運んでいく。"},{"t":"スプーン","r":"すぷーん","d":"スープやプリンをすくって食べるための、くぼみのある道具だよ。","s":"小さなスプーンで、そっとスープをすくった。"},{"t":"コップ","r":"こっぷ","d":"水やジュースなどの飲み物を入れて飲むための器だよ。","s":"水を注いだコップが、朝日を受けて輝いた。"},{"t":"いす","r":"いす","d":"おしりをのせてすわるための家具だよ。","s":"木のいすが、静かに部屋の隅で待っていた。"},{"t":"つくえ","r":"つくえ","d":"勉強をしたり本を読んだりするときに使う、平らな台だよ。","s":"つくえの上に、今日の宿題がそっと置かれた。"},{"t":"ドア","r":"どあ","d":"部屋に出入りするときにあけたりしめたりするものだよ。","s":"古いドアが、ぎいっと風の音をたてて開いた。"},{"t":"まど","r":"まど","d":"外の景色を見たり風を通したりするために、壁にあいたところだよ。","s":"まどの外では、雪がしずかに降り積もっていた。"},{"t":"カーテン","r":"かーてん","d":"まどにかける布で、日の光をさえぎったりするよ。","s":"風がカーテンをゆらして、光を部屋に運んできた。"},{"t":"電気","r":"でんき","d":"部屋を明るくしたり、機械を動かしたりする力のことだよ。","s":"夜になると、電気がぽつんと部屋を照らした。"},{"t":"かぎ","r":"かぎ","d":"ドアにさしてまわすと、しまったりあいたりする小さな道具だよ。","s":"小さなかぎが、大切な思い出をしまっている。"},{"t":"ハンカチ","r":"はんかち","d":"手をふいたり汗をふいたりするための、小さな布だよ。","s":"ポケットのハンカチが、涙をそっと拭いてくれた。"},{"t":"ティッシュ","r":"てぃっしゅ","d":"鼻をかんだり手をふいたりする、うすい紙だよ。","s":"くしゃみをすると、ティッシュがすぐに手をのばした。"},{"t":"ふくろ","r":"ふくろ","d":"物を入れて持ち運ぶための、紙やビニールでできた入れ物だよ。","s":"紙のふくろに、拾った木の実をそっと入れた。"},{"t":"はこ","r":"はこ","d":"物をしまったり送ったりするための、四角い入れ物だよ。","s":"古いはこの中に、思い出がそっと眠っていた。"},{"t":"やかん","r":"やかん","d":"お湯をわかすための、取っ手と口がついた金属の道具だよ。","s":"やかんの中で、お湯が歌うように鳴り始めた。"},{"t":"おふろ","r":"おふろ","d":"お湯をためて体をあたためてきれいにする場所だよ。","s":"あたたかいおふろに、一日の疲れが溶けていく。"},{"t":"スリッパ","r":"すりっぱ","d":"家の中ではくための、かかとのないはきものだよ。","s":"玄関のスリッパが、二つ並んで出迎えてくれた。"},{"t":"クレヨン","r":"くれよん","d":"いろいろな色で絵をかくための、太くてやわらかい棒だよ。","s":"虹色のクレヨンで、空いっぱいに絵を描いた。"},{"t":"ものさし","r":"ものさし","d":"長さをはかったり線を引いたりするための、まっすぐな道具だよ。","s":"まっすぐなものさしで、線を引いてみた。"},{"t":"セロテープ","r":"せろてーぷ","d":"ものをくっつけたりとめたりする、うすくてとうめいなテープだよ。","s":"破れた紙を、セロテープでそっとつなぎ合わせた。"},{"t":"ほうき","r":"ほうき","d":"ゴミやはっぱをはいて集めるための、長い柄のついた道具だよ。","s":"ほうきで庭を掃くと、風まで一緒に集まった。"},{"t":"バケツ","r":"ばけつ","d":"水を入れて運んだり、おそうじに使ったりする入れ物だよ。","s":"赤いバケツに、雨のしずくがたまっていく。"},{"t":"ぞうきん","r":"ぞうきん","d":"ぬらしてしぼって、ゆかやつくえをふくための布だよ。","s":"ぞうきんで床をふくと、部屋がぴかぴか光った。"},{"t":"めがね","r":"めがね","d":"目にかけると遠くのものや小さいものがよく見えるようになる道具だよ。","s":"おじいちゃんのめがねが、日差しにきらりと光った。"},{"t":"カレンダー","r":"かれんだー","d":"今日が何月何日かわかるように、日付がならんで書いてある紙だよ。","s":"壁のカレンダーに、今日という日が丸で囲まれた。"},{"t":"でんちゅう","r":"でんちゅう","d":"道の横に立っている、電線をささえる高い柱のことだよ。","s":"夕暮れの道に、でんちゅうの明かりがともった。"},{"t":"あたま","r":"あたま","d":"体のいちばん上にあって、考えたり覚えたりするところだよ。","s":"考えごとをすると、あたまの中に雲が浮かぶ。"},{"t":"目","r":"め","d":"ものを見るための大切なところで、顔にふたつあるよ。","s":"目を閉じると、風の音がよく聞こえてくる。"},{"t":"耳","r":"みみ","d":"音を聞くための体の部分で、顔の横にあるよ。","s":"小さな耳が、遠くの鳥の声を捉えていた。"},{"t":"鼻","r":"はな","d":"においをかいだり息をしたりする、顔のまんなかにあるところだよ。","s":"鼻をくすぐる花の香りに、思わず立ち止まった。"},{"t":"口","r":"くち","d":"ごはんを食べたりおしゃべりしたりする、顔の下のほうにあるところだよ。","s":"口を大きく開けて、大きなあくびをした。"},{"t":"手","r":"て","d":"ものをつかんだり字を書いたりする、うでの先にある体の部分だよ。","s":"つないだ手のぬくもりが、心にじんわり伝わった。"},{"t":"足","r":"あし","d":"歩いたり走ったりするための、体の下にある部分だよ。","s":"裸足の足が、砂浜のあたたかさを感じ取った。"},{"t":"指","r":"ゆび","d":"手や足の先についている細い部分で、ものをつかむときに使うよ。","s":"小さな指が、母の手をぎゅっと握りしめた。"},{"t":"おなか","r":"おなか","d":"体のまんなかあたりで、ごはんを食べるとここがいっぱいになるよ。","s":"走り回った後は、おなかがぐうと鳴った。"},{"t":"背中","r":"せなか","d":"体のうしろがわの広い部分で、ランドセルをせおうところだよ。","s":"母の背中は、いつもあたたかくて広かった。"},{"t":"ひざ","r":"ひざ","d":"足のまんなかにあって曲がるところで、すわるときに使うよ。","s":"転んですりむいたひざに、そっと絆創膏を貼った。"},{"t":"ほっぺた","r":"ほっぺた","d":"顔の横にあるやわらかい部分で、笑うとふくらむところだよ。","s":"冷たい風に、ほっぺたが赤く染まっていった。"},{"t":"おでこ","r":"おでこ","d":"顔の上のほうにある広いところで、熱があるとさわって確かめるよ。","s":"おでこに手を当てると、熱がこもっていた。"},{"t":"かた","r":"かた","d":"うでのつけねにある体の部分で、重い荷物をのせることもあるよ。","s":"疲れたかたに、そっと手を置いてもらった。"},{"t":"むね","r":"むね","d":"体のまえがわの上のほうで、心ぞうがドキドキしているところだよ。","s":"むねの奥で、小さな希望がふくらんでいく。"},{"t":"走る","r":"はしる","d":"足を速く動かして、すすんでいくことだよ。","s":"風を切って走ると、世界が少し近くなる。"},{"t":"歩く","r":"あるく","d":"足を交互に出して、ゆっくりすすむことだよ。","s":"ゆっくり歩くと、道端の花にも気づける。"},{"t":"泳ぐ","r":"およぐ","d":"水の中で手や足を動かしてすすむことだよ。","s":"川の中を泳ぐ魚が、光の中で銀色に光った。"},{"t":"飛ぶ","r":"とぶ","d":"地面からジャンプしたり、空を移動したりすることだよ。","s":"小鳥が空高く飛ぶと、雲もうれしそうだった。"},{"t":"投げる","r":"なげる","d":"手に持ったものを力をいれてはなすことだよ。","s":"小石を池に投げると、静かな輪が広がった。"},{"t":"つかむ","r":"つかむ","d":"手を使ってものをしっかりにぎることだよ。","s":"小さな手が、母の指をぎゅっとつかんだ。"},{"t":"蹴る","r":"ける","d":"足でボールなどをポーンとうつことだよ。","s":"ボールを蹴ると、風がついてくる。"},{"t":"すわる","r":"すわる","d":"いすや地面におしりをつけて休むことだよ。","s":"ベンチにすわって、雲の形をながめた。"},{"t":"立つ","r":"たつ","d":"足で体をささえて、まっすぐになることだよ。","s":"坂道にそっと立つと、風がやさしい。"},{"t":"転ぶ","r":"ころぶ","d":"バランスをくずして地面にたおれてしまうことだよ。","s":"ちいさく転んでも、空はわらってくれる。"},{"t":"笑う","r":"わらう","d":"おもしろいことやうれしいことがあって、顔がニコニコになることだよ。","s":"友だちと笑うと、木々もゆれる気がした。"},{"t":"泣く","r":"なく","d":"悲しいときやくやしいときに、目から涙が出ることだよ。","s":"泣いたあとの空は、いつもすこし青い。"},{"t":"おどる","r":"おどる","d":"音楽にあわせて体を楽しく動かすことだよ。","s":"木の葉がおどるように、風にまう。"},{"t":"のびる","r":"のびる","d":"体や手足をぐーっと伸ばして大きくすることだよ。","s":"朝の光の中で、体をぐっとのばす。"},{"t":"ねる","r":"ねる","d":"目をとじてふとんに横になり、体を休めることだよ。","s":"布団の中でねると、夢がそっと訪れる。"},{"t":"起きる","r":"おきる","d":"ねていた状態から目をあけて、体を起こすことだよ。","s":"小鳥の声で、朝がしずかに起きる。"},{"t":"まわる","r":"まわる","d":"コマみたいにくるくると、同じところを回ることだよ。","s":"こまが静かに、いつまでもまわっている。"},{"t":"すべる","r":"すべる","d":"つるつるしたところで足がすーっといくことだよ。","s":"坂道をすべるように、風が下りてくる。"},{"t":"つかれた","r":"つかれた","d":"たくさん動いたあとに、体がぐったりする気持ちのことだよ。","s":"遊びつかれた午後、木かげがやさしい。"},{"t":"げんき","r":"げんき","d":"体のちょうしがよくて、たくさん動ける気持ちのことだよ。","s":"朝の挨拶に、げんきな声がひびく。"},{"t":"学校","r":"がっこう","d":"先生に勉強を教えてもらったり友だちと遊んだりする場所だよ。","s":"学校への道に、小さな花がさいていた。"},{"t":"先生","r":"せんせい","d":"学校でみんなにいろいろなことを教えてくれる人だよ。","s":"先生の声は、教室にやさしく響く。"},{"t":"教室","r":"きょうしつ","d":"学校でみんなが集まって勉強する部屋のことだよ。","s":"教室の窓から、山がしずかに見える。"},{"t":"黒板","r":"こくばん","d":"教室の前にある大きな板で、先生がチョークで字を書くよ。","s":"黒板に書いた文字が、光を受けて光る。"},{"t":"チョーク","r":"ちょーく","d":"黒板に字や絵を書くための、白やいろいろな色の棒だよ。","s":"白いチョークの粉が、風にひらひら舞う。"},{"t":"教科書","r":"きょうかしょ","d":"学校の勉強で使う、いろいろなことが書いてある本だよ。","s":"教科書のページに、朝の匂いがのこる。"},{"t":"宿題","r":"しゅくだい","d":"学校から家に帰ってやる、先生から出されたべんきょうだよ。","s":"宿題を終えると、外の光がやわらかい。"},{"t":"給食","r":"きゅうしょく","d":"学校でみんなといっしょに食べる、お昼ごはんのことだよ。","s":"給食の湯気が、教室をあたたかくする。"},{"t":"体育","r":"たいいく","d":"学校で走ったりボールを使ったり体を動かす授業だよ。","s":"体育のあとの空は、いつもより高い。"},{"t":"図工","r":"ずこう","d":"学校で絵をかいたり工作をしたりする授業だよ。","s":"図工の時間に、絵の具の匂いが広がる。"},{"t":"遠足","r":"えんそく","d":"学校のみんなで外に出かけて、自然の中で遊んだりする行事だよ。","s":"遠足の道で、小さな石をひろった。"},{"t":"休み時間","r":"やすみじかん","d":"授業と授業の間にある、自由に遊んだり休んだりできる時間だよ。","s":"休み時間になると、光が校庭にあふれる。"},{"t":"おにごっこ","r":"おにごっこ","d":"おにが友だちを追いかけて、つかまえる遊びだよ。","s":"おにごっこの声が、夕方の道にひびく。"},{"t":"かくれんぼ","r":"かくれんぼ","d":"一人がさがして、ほかの人がかくれる遊びだよ。","s":"かくれんぼの間、木のかげが友だちになる。"},{"t":"なわとび","r":"なわとび","d":"なわをまわして、リズムよくとぶ遊びや運動だよ。","s":"なわとびのリズムに、雲もゆれている。"},{"t":"ボール","r":"ぼーる","d":"まるい形で投げたりけったりしてあそぶ道具だよ。","s":"転がるボールを、風がそっと追いかける。"},{"t":"ブランコ","r":"ぶらんこ","d":"すわってゆらゆら前後にゆれる、公園にある遊具だよ。","s":"ブランコがきしみながら、空をこぐ。"},{"t":"すべりだい","r":"すべりだい","d":"上にのぼって、すーっとすべりおりる公園の遊具だよ。","s":"すべりだいの上から、町が小さく見えた。"},{"t":"砂場","r":"すなば","d":"砂がたくさん入っていて、山やおだんごを作って遊べる場所だよ。","s":"砂場に残った足あとが、風に消えていく。"},{"t":"おりがみ","r":"おりがみ","d":"色のついた四角い紙を折って、いろんな形を作る遊びだよ。","s":"おりがみの鶴が、机の上で羽を休める。"},{"t":"あやとり","r":"あやとり","d":"ひもを指にかけていろいろな形を作る、昔からある遊びだよ。","s":"指先のあやとりに、糸がしずかに笑う。"},{"t":"けんだま","r":"けんだま","d":"先のとがった棒と玉がひもでつながっていて、玉をのせる遊びだよ。","s":"けんだまの音が、静かな午後にひびく。"},{"t":"こま","r":"こま","d":"くるくるまわして遊ぶ、日本の昔からあるおもちゃだよ。","s":"こまが回る音に、時間もゆっくり進む。"},{"t":"たこあげ","r":"たこあげ","d":"風のある日に糸をつけたたこを空高くあげる遊びだよ。","s":"空高くたこあげをすると、風が味方になる。"},{"t":"シャボン玉","r":"しゃぼんだま","d":"石けん水をストローでふくと、きれいな丸い泡ができる遊びだよ。","s":"シャボン玉が、光をつつんで空へのぼる。"},{"t":"お絵かき","r":"おえかき","d":"紙にクレヨンやえんぴつで好きなものの絵をかくことだよ。","s":"お絵かきの紙に、青い空を描いてみた。"},{"t":"ぬりえ","r":"ぬりえ","d":"線で描かれた絵に、好きな色をぬって楽しむ遊びだよ。","s":"ぬりえの中で、太陽をまっ赤にそめた。"},{"t":"トランプ","r":"とらんぷ","d":"数字や絵がかいてあるカードで、いろんなゲームができるよ。","s":"トランプをめくる音が、部屋にひびく。"},{"t":"じゃんけん","r":"じゃんけん","d":"グー・チョキ・パーの手の形で勝ち負けを決める遊びだよ。","s":"じゃんけんの声が、路地にこだまする。"},{"t":"おままごと","r":"おままごと","d":"お料理やお買い物のまねをして遊ぶ、ごっこ遊びだよ。","s":"おままごとの中で、小さな家族ができる。"},{"t":"かけっこ","r":"かけっこ","d":"友だちとどっちが速いか走ってきそう遊びだよ。","s":"かけっこのゴールに、風がまってくれる。"},{"t":"ドッジボール","r":"どっじぼーる","d":"ボールを投げて当てたりよけたりする、チームでやる遊びだよ。","s":"ドッジボールの声が、校庭をかけぬける。"},{"t":"つみき","r":"つみき","d":"四角や三角の木のブロックを積みあげて遊ぶおもちゃだよ。","s":"つみきの塔が、光の中でそっと立つ。"},{"t":"ぬいぐるみ","r":"ぬいぐるみ","d":"動物やキャラクターの形をした、やわらかいおもちゃだよ。","s":"ぬいぐるみをだいて、静かな夢をみる。"},{"t":"えほん","r":"えほん","d":"絵がたくさんあって、おはなしが楽しめる子ども向けの本だよ。","s":"えほんのページから、月の匂いがした。"},{"t":"なぞなぞ","r":"なぞなぞ","d":"ヒントをもとに答えを考える、頭を使う遊びだよ。","s":"なぞなぞの答えは、風の中にかくれていた。"},{"t":"しりとり","r":"しりとり","d":"前の人が言った言葉のさいごの音で始まる言葉をつなげる遊びだよ。","s":"しりとりの言葉が、道をつないでいく。"},{"t":"いっしょ","r":"いっしょ","d":"友だちや家族と同じところにいたり、同じことをすることだよ。","s":"いっしょに歩く道は、いつもより短い。"},{"t":"うた","r":"うた","d":"声にメロディーをつけて気持ちをあらわすもので、音楽の授業でも歌うよ。","s":"小さなうたが、風にのって町を歩く。"},{"t":"ピアノ","r":"ぴあの","d":"白と黒のけんばんをおして音を出す、大きな楽器だよ。","s":"ピアノの音が、窓の外の緑にとどく。"},{"t":"たいこ","r":"たいこ","d":"バチでたたいてドンドンと大きな音を出す楽器だよ。","s":"たいこの音が、祭りの夜をおこす。"},{"t":"リコーダー","r":"りこーだー","d":"穴を指でおさえて息をふきこんで音を出す、学校で使う楽器だよ。","s":"リコーダーの音が、教室の窓から逃げる。"},{"t":"カスタネット","r":"かすたねっと","d":"二つのお皿みたいなものを手でパチパチならす楽器だよ。","s":"カスタネットの音が、リズムをつくる。"},{"t":"すず","r":"すず","d":"ふるとリンリンときれいな音がする、小さな楽器だよ。","s":"すずの音が、風といっしょに鳴る。"},{"t":"タンバリン","r":"たんばりん","d":"手でたたいたりふったりして、シャンシャンと音を出す楽器だよ。","s":"タンバリンをふると、光がこぼれる。"},{"t":"ハーモニカ","r":"はーもにか","d":"口で息をふいたりすったりして音を出す、小さな楽器だよ。","s":"ハーモニカの音が、夕焼けにとける。"},{"t":"木琴","r":"もっきん","d":"木の板をバチでたたいて音を出す、音階がならんだ楽器だよ。","s":"木琴の音が、水の粒のように落ちる。"},{"t":"ギター","r":"ぎたー","d":"弦をはじいたりかきならしたりして音を出す楽器だよ。","s":"ギターの弦が、夜の静けさをふるわす。"},{"t":"トライアングル","r":"とらいあんぐる","d":"三角の金属を棒でたたくと、チーンときれいな音がする楽器だよ。","s":"トライアングルの音が、空にすいこまれる。"},{"t":"リズム","r":"りずむ","d":"音楽のなかで繰りかえされる、トントンという音の流れだよ。","s":"リズムにあわせて、心も少しはずむ。"},{"t":"メロディー","r":"めろでぃー","d":"音が高くなったり低くなったりしてつながる、歌のふしのことだよ。","s":"遠くのメロディーが、風にのってくる。"},{"t":"合唱","r":"がっしょう","d":"たくさんの人が声をあわせて歌うことだよ。","s":"合唱の声が、体育館にあたたかく響く。"},{"t":"えんそう","r":"えんそう","d":"楽器を使って曲を奏でることだよ。","s":"えんそうの音が、夕暮れをつつみこむ。"},{"t":"音楽","r":"おんがく","d":"歌や楽器の音をつかって、気持ちをあらわしたり楽しんだりするものだよ。","s":"音楽が流れると、部屋に光がふえる気がする。"},{"t":"ドレミ","r":"どれみ","d":"音の高さをあらわす名前で、ドレミファソラシドとならんでいるよ。","s":"ドレミの音が、階段をのぼっていく。"},{"t":"しずか","r":"しずか","d":"音がぜんぜんしなくて、おだやかなようすのことだよ。","s":"しずかな夜に、星の音が聞こえる気がする。"},{"t":"ガタガタ","r":"がたがた","d":"かたいものがぶつかって続けて音がするようすだよ。","s":"古い戸がガタガタと、風に応えている。"},{"t":"ドンドン","r":"どんどん","d":"たいこや扉をたたくような、力づよい大きな音のことだよ。","s":"太鼓がドンドンと、夏の夜をたたく。"},{"t":"リンリン","r":"りんりん","d":"すずや電話のベルが鳴るような、かわいい音だよ。","s":"自転車がリンリンと、坂道を下りる。"},{"t":"パチパチ","r":"ぱちぱち","d":"手をたたいて拍手するときの音だよ。","s":"たき火がパチパチと、夜に小さく光る。"},{"t":"ザーザー","r":"ざーざー","d":"つよい雨がたくさんふっているときの音だよ。","s":"雨がザーザーと、屋根の上で歌う。"},{"t":"カンカン","r":"かんかん","d":"かたい金属をたたいたときに出る、高くてひびく音だよ。","s":"鐘がカンカンと、遠くの町にひびく。"},{"t":"ゴロゴロ","r":"ごろごろ","d":"かみなりが遠くで鳴っている音や、何かがころがる音だよ。","s":"雷がゴロゴロと、空の向こうで笑う。"},{"t":"シーン","r":"しーん","d":"まわりがとても静かで、何の音もしないようすだよ。","s":"夜のシーンとした部屋に、月の光が入る。"},{"t":"バタバタ","r":"ばたばた","d":"いそがしくて走りまわっているようすや、その足音のことだよ。","s":"洗濯物がバタバタと、風の中でおどる。"},{"t":"ワンワン","r":"わんわん","d":"犬がほえるときの鳴き声をあらわす言葉だよ。","s":"犬がワンワンと、夕方の道であいさつする。"},{"t":"お正月","r":"おしょうがつ","d":"一年のはじまりをお祝いする日で、おせち料理を食べるよ。","s":"お正月の朝は、空気がすこし新しい。"},{"t":"ひなまつり","r":"ひなまつり","d":"三月三日におひなさまをかざって、女の子の成長をお祝いする行事だよ。","s":"ひなまつりの人形が、静かにほほえむ。"},{"t":"こどもの日","r":"こどものひ","d":"五月五日にこいのぼりをあげて、子どもの元気な成長をねがう日だよ。","s":"こどもの日の空に、鯉のぼりが泳ぐ。"},{"t":"たなばた","r":"たなばた","d":"七月七日に願いごとを短冊に書いて、笹にかざる行事だよ。","s":"たなばたの夜、願いが星にとどく気がする。"},{"t":"夏休み","r":"なつやすみ","d":"学校が長い間お休みになる、夏の楽しい期間だよ。","s":"夏休みの朝は、蝉の声から始まる。"},{"t":"お祭り","r":"おまつり","d":"みんなで集まってやぐらや出店を楽しむ、にぎやかな行事だよ。","s":"お祭りの光が、夜の川面にゆれる。"},{"t":"花火","r":"はなび","d":"夜空にきれいな光と色がパッとひろがる、夏の楽しみだよ。","s":"花火が消えたあと、空に静けさが残る。"},{"t":"運動会","r":"うんどうかい","d":"学校でかけっこやつなひきなど、いろんな競技をする行事だよ。","s":"運動会の空に、白い旗がはためく。"},{"t":"ハロウィン","r":"はろうぃん","d":"十月にかぼちゃをかざったりへんそうしたりして楽しむ行事だよ。","s":"ハロウィンの夜、かぼちゃが道を照らす。"},{"t":"クリスマス","r":"くりすます","d":"十二月にツリーをかざって、サンタさんがプレゼントをくれる日だよ。","s":"クリスマスの窓に、雪がそっと積もる。"},{"t":"大みそか","r":"おおみそか","d":"十二月三十一日で、一年のいちばん最後の日だよ。","s":"大みそかの鐘が、一年をそっと閉じる。"},{"t":"たんじょう日","r":"たんじょうび","d":"自分が生まれた日をお祝いする、とくべつな日だよ。","s":"たんじょう日の朝、光がいつもより優しい。"},{"t":"入学式","r":"にゅうがくしき","d":"学校にはじめて入る日のおいわいで、みんなでお祝いする式だよ。","s":"入学式の桜が、風にそっとゆれていた。"},{"t":"卒業式","r":"そつぎょうしき","d":"学校の勉強が終わって、お別れとお祝いをする式だよ。","s":"卒業式の空は、少しだけ涙の色をしていた。"},{"t":"こいのぼり","r":"こいのぼり","d":"こどもの日にそらにあげる、こいの形をした大きなかざりだよ。","s":"こいのぼりが、青空を静かに泳いでいく。"},{"t":"短冊","r":"たんざく","d":"たなばたに願いごとを書いて笹にかざる、細長い紙だよ。","s":"短冊に書いた願いが、風にそっとゆれる。"},{"t":"サンタクロース","r":"さんたくろーす","d":"赤い服を着た白いひげのおじいさんで、クリスマスにプレゼントをくれるよ。","s":"サンタクロースの足音が、雪の夜に響く。"},{"t":"年賀状","r":"ねんがじょう","d":"お正月に「あけましておめでとう」と送る、おいわいのはがきだよ。","s":"年賀状の文字に、新しい年の光が宿る。"},{"t":"おとしだま","r":"おとしだま","d":"お正月に大人から子どもがもらえる、ぽち袋に入ったお金だよ。","s":"おとしだまの袋が、正月の光をつつむ。"},{"t":"雪だるま","r":"ゆきだるま","d":"雪を丸めて大きい玉と小さい玉を重ねて作る人形だよ。","s":"雪だるまが、庭でひとり空を見上げる。"},{"t":"もみじ","r":"もみじ","d":"秋になると葉っぱが赤や黄色にきれいに色づく木だよ。","s":"もみじが、風に舞って道を赤くそめる。"},{"t":"あじさい","r":"あじさい","d":"つゆの時期にむらさきや青やピンクの花がまるく咲く植物だよ。","s":"あじさいが、雨の中で静かに色を変える。"},{"t":"ひまわり","r":"ひまわり","d":"夏に大きな黄色い花をさかせて、太陽のほうを向く花だよ。","s":"ひまわりが、太陽のほうへ首をむける。"},{"t":"チューリップ","r":"ちゅーりっぷ","d":"春に赤や黄色やピンクのかわいい花をさかせる、球根の花だよ。","s":"チューリップが、春の風にゆれている。"},{"t":"コスモス","r":"こすもす","d":"秋にピンクや白のかわいい花がたくさんさく、ほそい茎の花だよ。","s":"コスモスが、秋の空の下でゆれている。"},{"t":"すずむし","r":"すずむし","d":"秋の夜にリーンリーンときれいな声で鳴く虫だよ。","s":"すずむしの声が、夜の庭にひびいている。"},{"t":"かぶとむし","r":"かぶとむし","d":"大きなツノがかっこいい、夏に人気のある虫だよ。","s":"かぶとむしが、木の幹で夏をだいている。"},{"t":"てんとうむし","r":"てんとうむし","d":"赤い体に黒い水玉もようがある、小さくてかわいい虫だよ。","s":"てんとうむしが、葉の上で光をあびる。"},{"t":"お母さん","r":"おかあさん","d":"自分を生んでくれた女の人で、いつもそばにいてくれるよ。","s":"お母さんの声が、台所からあたたかく届く。"},{"t":"お父さん","r":"おとうさん","d":"家族を大切にしてくれる男の人で、頼りになるよ。","s":"お父さんの背中は、夕焼けより大きい。"},{"t":"お兄ちゃん","r":"おにいちゃん","d":"自分より年上の男の兄弟のことだよ。","s":"お兄ちゃんの自転車が、坂道を駆けおりる。"},{"t":"お姉ちゃん","r":"おねえちゃん","d":"自分より年上の女の兄弟のことだよ。","s":"お姉ちゃんの歌声が、部屋にやさしくひびく。"},{"t":"弟","r":"おとうと","d":"自分より年下の男の兄弟のことだよ。","s":"弟のわらい声が、家じゅうにひびく。"},{"t":"妹","r":"いもうと","d":"自分より年下の女の兄弟のことだよ。","s":"妹の小さな手が、そっと花をつかむ。"},{"t":"おじいちゃん","r":"おじいちゃん","d":"お父さんやお母さんのお父さんで、やさしくていろんなことを知っているよ。","s":"おじいちゃんの話は、時間をゆっくりにする。"},{"t":"おばあちゃん","r":"おばあちゃん","d":"お父さんやお母さんのお母さんで、あたたかくて料理がじょうずだよ。","s":"おばあちゃんの手が、あたたかい茶をそそぐ。"},{"t":"赤ちゃん","r":"あかちゃん","d":"生まれたばかりの小さな人で、泣いたりわらったりするよ。","s":"赤ちゃんの寝顔に、光がそっと重なる。"},{"t":"友だち","r":"ともだち","d":"いっしょに遊んだり話したりする、大切ななかまのことだよ。","s":"友だちと歩く道は、いつも少し明るい。"},{"t":"家族","r":"かぞく","d":"お父さんやお母さん、きょうだいなど、いっしょに暮らす人たちだよ。","s":"家族の声が、夕方の家にあつまってくる。"},{"t":"きょうだい","r":"きょうだい","d":"同じお父さんやお母さんから生まれた、兄弟や姉妹のことだよ。","s":"きょうだいの影が、夕日の道に並ぶ。"},{"t":"おとなりさん","r":"おとなりさん","d":"自分の家のとなりに住んでいる人のことだよ。","s":"おとなりさんの庭に、小さな花がさいた。"},{"t":"男の子","r":"おとこのこ","d":"大きくなると男の人になる、元気な子どものことだよ。","s":"男の子が、坂道を風のように駆けおりる。"},{"t":"女の子","r":"おんなのこ","d":"大きくなると女の人になる、子どものことだよ。","s":"女の子の傘が、雨の中で花のように開く。"},{"t":"おまわりさん","r":"おまわりさん","d":"みんなが安全にくらせるように町を守ってくれる人だよ。","s":"おまわりさんの声が、朝の道をやさしく守る。"},{"t":"お医者さん","r":"おいしゃさん","d":"体のぐあいが悪いときに診てくれて、治してくれる人だよ。","s":"お医者さんの手が、そっと安心をくれる。"},{"t":"
