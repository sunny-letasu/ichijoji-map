<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>一乗寺</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Antique+Soft&family=Noto+Sans+JP:wght@300;400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#f0ece4}
body{font-family:'Noto Sans JP',sans-serif}

#map{position:fixed;inset:0;z-index:1}

.leaflet-tile-pane{
  filter:saturate(0) brightness(1.2) contrast(0.5);
  opacity:.75;
}

#tint{
  position:fixed;inset:0;z-index:2;
  background:rgba(240,236,228,.18);
  pointer-events:none;
}

.leaflet-control-zoom{display:none!important}
.leaflet-control-attribution{
  font-size:8px!important;opacity:.25!important;
  background:transparent!important;color:#888!important;
}
.leaflet-control-attribution a{color:#888!important}

.w{
  font-family:'Zen Antique Soft',serif;
  color:#1a1a1a;
  opacity:0;
  cursor:default;
  white-space:nowrap;
  letter-spacing:4px;
  transition:opacity .8s ease-in,transform .5s;
  transform:scale(1);
  text-shadow:
    0 0 20px rgba(240,236,228,.9),
    0 0 40px rgba(240,236,228,.6);
  user-select:none;
  -webkit-user-select:none;
}
.w.visible{opacity:.45}
.w rt{
  font-size:.45em;
  letter-spacing:1px;
  opacity:.7;
}
.w.on{
  opacity:1!important;
  transform:scale(1.12);
  text-shadow:
    0 0 20px rgba(240,236,228,.9),
    0 0 40px rgba(240,236,228,.6),
    0 1px 3px rgba(0,0,0,.08);
}
.w.on rt{opacity:1}
body.focus .w:not(.on){
  opacity:.10!important;
}

#bar{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  padding:22px 32px 26px;
  background:linear-gradient(transparent 0%,rgba(26,26,20,.6) 25%,rgba(26,26,20,.82) 100%);
  color:#F0E4C4;
  transform:translateY(100%);
  opacity:0;
  transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .5s;
  display:flex;align-items:center;gap:24px;
  pointer-events:none;
}
#bar.show{transform:translateY(0);opacity:1}
#bar .bw{
  font-family:'Zen Antique Soft',serif;
  font-size:28px;letter-spacing:8px;flex-shrink:0;
}
#bar .bw rt{font-size:.45em;letter-spacing:1px}
#bar .bd{
  font-size:14px;line-height:1.8;font-weight:300;
  letter-spacing:.5px;color:rgba(240,228,196,.8);
}

#wm{
  position:fixed;top:18px;left:22px;z-index:100;
  pointer-events:none;transition:opacity .5s;
}
#wm .t1{
  font-family:'Zen Antique Soft',serif;
  font-size:16px;letter-spacing:10px;
  color:rgba(26,26,20,.2);
}
#wm .t1 rt{font-size:.5em;letter-spacing:2px}
#wm .t2{
  font-size:9px;letter-spacing:2px;margin-top:3px;
  color:rgba(26,26,20,.13);font-weight:300;
}
body.focus #wm{opacity:.3}

/* shuffle button */
#shuffle{
  position:fixed;bottom:18px;right:18px;z-index:101;
  width:40px;height:40px;border-radius:50%;
  background:rgba(26,26,20,.08);border:1px solid rgba(26,26,20,.1);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .3s,transform .3s;
  color:rgba(26,26,20,.3);font-size:18px;
}
#shuffle:hover{background:rgba(26,26,20,.15);transform:rotate(180deg)}

@media(max-width:600px){
  .w{letter-spacing:2px}
  #bar{padding:16px 20px 22px;flex-direction:column;gap:8px}
  #bar .bw{font-size:22px;letter-spacing:5px}
  #bar .bd{font-size:12px;line-height:1.7}
  #wm{top:12px;left:14px}
  #wm .t1{font-size:14px;letter-spacing:6px}
  #wm .t2{font-size:8px}
  #shuffle{width:36px;height:36px;bottom:14px;right:14px;font-size:16px}
}
</style>
</head>
<body>

<div id="map"></div>
<div id="tint"></div>

<div id="wm">
  <div class="t1"><ruby>一乗寺<rp>(</rp><rt>いちじょうじ</rt><rp>)</rp></ruby></div>
  <div class="t2">京都 — 文化と味が交差する街</div>
</div>

<div id="bar">
  <div class="bw" id="bw"></div>
  <div class="bd" id="bd"></div>
</div>

<button id="shuffle" title="ことばを入れ替える">&#x21bb;</button>

<script>
var WORDS=[{"t":"濃厚","r":"のうこう","d":"味やにおいがとても濃いこと。一乗寺のラーメンスープによく使われる言葉だよ。"},{"t":"麺","r":"めん","d":"小麦粉などから作られる細長い食べ物。ラーメンやうどんの主役だよ。"},{"t":"鶏白湯","r":"とりぱいたん","d":"鶏の骨をじっくり煮込んで白くにごらせたスープ。一乗寺の人気の味だよ。"},{"t":"豚骨","r":"とんこつ","d":"豚の骨を長い時間煮込んで作る白いスープ。ラーメンの定番の味だよ。"},{"t":"背脂","r":"せあぶら","d":"豚の背中の脂肪のこと。ラーメンに浮かべるとコクが増すよ。"},{"t":"醤油","r":"しょうゆ","d":"大豆と小麦から作る茶色い調味料。日本の食卓に欠かせないものだよ。"},{"t":"味噌","r":"みそ","d":"大豆を発酵させて作る調味料。味噌ラーメンや味噌汁に使われるよ。"},{"t":"塩","r":"しお","d":"海水や岩塩から取れる白い調味料。料理の味を決める大切なものだよ。"},{"t":"叉焼","r":"チャーシュー","d":"豚肉をたれに漬けて焼いたり煮たりしたもの。ラーメンの具の王様だよ。"},{"t":"煮卵","r":"にたまご","d":"たれに漬け込んで味をしみこませたゆで卵。半熟がとろりとおいしいよ。"},{"t":"海苔","r":"のり","d":"海でとれる藻を乾燥させた食べ物。ラーメンやおにぎりに使われるよ。"},{"t":"葱","r":"ねぎ","d":"緑と白の細長い野菜。ラーメンの上にのせると風味がよくなるよ。"},{"t":"白葱","r":"しろねぎ","d":"葱の白い部分のこと。刻んでラーメンにのせるとシャキシャキするよ。"},{"t":"青葱","r":"あおねぎ","d":"葱の緑色の部分のこと。京都では九条ねぎが有名だよ。"},{"t":"九条葱","r":"くじょうねぎ","d":"京都の伝統野菜で、やわらかくて甘い葱。ラーメンとの相性が抜群だよ。"},{"t":"筍","r":"たけのこ","d":"竹の若い芽で、春にとれる野菜。メンマの原料にもなるよ。"},{"t":"メンマ","r":"めんま","d":"筍を発酵させて味付けした食べ物。ラーメンの具としておなじみだよ。"},{"t":"豆腐","r":"とうふ","d":"大豆から作る白くてやわらかい食べ物。京都の豆腐はとても有名だよ。"},{"t":"もやし","r":"もやし","d":"豆を水に浸して発芽させた白い野菜。シャキシャキした食感が特徴だよ。"},{"t":"白菜","r":"はくさい","d":"冬においしい大きな葉っぱの野菜。鍋物やラーメンの具に使われるよ。"},{"t":"玉葱","r":"たまねぎ","d":"丸い形の野菜で、切ると涙が出るよ。炒めると甘くなるんだ。"},{"t":"大蒜","r":"にんにく","d":"強いにおいのある野菜。ラーメンに入れるとパンチのある味になるよ。"},{"t":"生姜","r":"しょうが","d":"ピリッとした辛さのある根っこの野菜。体を温めてくれる食材だよ。"},{"t":"胡椒","r":"こしょう","d":"ピリッとした辛さのある香辛料。ラーメンにふりかけると味が引き締まるよ。"},{"t":"唐辛子","r":"とうがらし","d":"赤くて辛い調味料。一乗寺のある左京区には田中とうがらしという伝統野菜があるよ。"},{"t":"田中唐辛子","r":"たなかとうがらし","d":"京都の伝統野菜の一つ。一乗寺の近くで昔から作られてきた辛い野菜だよ。"},{"t":"出汁","r":"だし","d":"かつお節や昆布を煮出して作る味の基本。和食の大切な土台だよ。"},{"t":"昆布","r":"こんぶ","d":"海でとれる大きな海藻。出汁をとるのに欠かせない食材だよ。"},{"t":"鰹節","r":"かつおぶし","d":"鰹を燻して乾燥させたもの。削ると良い香りの出汁がとれるよ。"},{"t":"煮干","r":"にぼし","d":"小さな魚を干したもの。出汁をとるときに使われる食材だよ。"},{"t":"豚肉","r":"ぶたにく","d":"豚のお肉のこと。ラーメンのチャーシューや餃子の具に使われるよ。"},{"t":"鶏肉","r":"とりにく","d":"鶏のお肉のこと。鶏白湯スープの材料として一乗寺では大活躍だよ。"},{"t":"鶏皮","r":"とりかわ","d":"鶏の皮の部分。煮込むとスープにコクとうまみが出るよ。"},{"t":"鶏卵","r":"けいらん","d":"にわとりが産む卵のこと。ラーメンの煮卵やチャーハンに使われるよ。"},{"t":"魚介","r":"ぎょかい","d":"魚や貝やエビなど海の食べ物の総称。魚介スープのラーメンも人気だよ。"},{"t":"餃子","r":"ぎょうざ","d":"薄い皮で肉や野菜を包んで焼いたり蒸したりする料理。ラーメン屋の人気メニューだよ。"},{"t":"炒飯","r":"チャーハン","d":"ご飯を油で炒めた料理。ラーメンと一緒に注文する人が多いよ。"},{"t":"丼","r":"どんぶり","d":"深くて大きなお椀のこと。ラーメンはこの器に入って出てくるよ。"},{"t":"箸","r":"はし","d":"二本の棒で食べ物をはさむ日本の食器。麺を食べるときに使うよ。"},{"t":"蓮華","r":"れんげ","d":"スープをすくうための小さなスプーン。ラーメンを食べるときに使うよ。"},{"t":"調味料","r":"ちょうみりょう","d":"料理の味をつけるために使うもの。塩や醤油や味噌などのことだよ。"},{"t":"薬味","r":"やくみ","d":"料理に添えて風味をよくするもの。葱や生姜や大蒜などのことだよ。"},{"t":"具材","r":"ぐざい","d":"料理に入れる食べ物のこと。ラーメンならチャーシューや卵などだよ。"},{"t":"替玉","r":"かえだま","d":"ラーメンの麺をおかわりすること。スープが残ったらもう一玉頼めるよ。"},{"t":"大盛","r":"おおもり","d":"普通より量を多くすること。おなかがすいた日は大盛りにしようね。"},{"t":"半熟","r":"はんじゅく","d":"卵の黄身がとろりとした状態のこと。煮卵は半熟がおいしいよ。"},{"t":"太麺","r":"ふとめん","d":"太くてもちもちした麺のこと。濃厚なスープによく合うよ。"},{"t":"細麺","r":"ほそめん","d":"細くてつるっとした麺のこと。あっさりしたスープによく合うよ。"},{"t":"縮麺","r":"ちぢれめん","d":"ウェーブがかかった麺のこと。スープがよくからむのが特徴だよ。"},{"t":"茹加減","r":"ゆでかげん","d":"麺をゆでる時間の調整のこと。固め、普通、やわらかめから選べるよ。"},{"t":"固茹","r":"かたゆで","d":"麺を短い時間でゆでてコシを残すこと。歯ごたえが好きな人に人気だよ。"},{"t":"激戦区","r":"げきせんく","d":"お店がたくさん集まって競い合っている地域。一乗寺はラーメン激戦区だよ。"},{"t":"総本店","r":"そうほんてん","d":"チェーン店のいちばん最初のお店のこと。天下一品の総本店は一乗寺にあるよ。"},{"t":"行列","r":"ぎょうれつ","d":"人が並んで順番を待つこと。人気ラーメン店には長い行列ができるよ。"},{"t":"暖簾","r":"のれん","d":"お店の入口にかかっている布。お店の名前や印が書いてあるよ。"},{"t":"屋台","r":"やたい","d":"車輪のついた小さなお店。昔はラーメンを屋台で売っていたよ。"},{"t":"厨房","r":"ちゅうぼう","d":"お店の料理を作る場所のこと。ラーメン屋の厨房はいつも忙しいよ。"},{"t":"割箸","r":"わりばし","d":"二つに割って使う使い捨ての箸。ラーメン屋でよく見かけるよ。"},{"t":"食券","r":"しょっけん","d":"お店で先にお金を払って買うチケット。食券制のラーメン屋も多いよ。"},{"t":"券売機","r":"けんばいき","d":"食券やきっぷを買うための自動販売機。ボタンを押して注文するよ。"},{"t":"白米","r":"はくまい","d":"精米した白いお米のこと。ラーメンと一緒に食べる人もいるよ。"},{"t":"漬物","r":"つけもの","d":"野菜を塩や糠に漬けて保存した食べ物。京都では千枚漬けが有名だよ。"},{"t":"千枚漬","r":"せんまいづけ","d":"かぶらを薄く切って昆布と漬けた京都の漬物。冬のおいしい味だよ。"},{"t":"湯気","r":"ゆげ","d":"熱い液体から立ちのぼる白い煙のようなもの。できたてラーメンの目印だよ。"},{"t":"香味","r":"こうみ","d":"食べ物のよい香りと味のこと。薬味を加えると香味が豊かになるよ。"},{"t":"旨味","r":"うまみ","d":"おいしさを感じる味の一つ。出汁に含まれる、日本が発見した味覚だよ。"},{"t":"甘味","r":"かんみ","d":"甘い味やお菓子のこと。一乗寺中谷のでっち羊羹は有名な甘味だよ。"},{"t":"羊羹","r":"ようかん","d":"あんこを固めた和菓子。一乗寺中谷のでっち羊羹はとても人気があるよ。"},{"t":"丁稚羊羹","r":"でっちようかん","d":"蒸して作るやわらかい羊羹。一乗寺中谷が1937年から作っている名物だよ。"},{"t":"和菓子","r":"わがし","d":"日本の伝統的なお菓子のこと。抹茶と一緒に食べるととてもおいしいよ。"},{"t":"抹茶","r":"まっちゃ","d":"茶葉を粉にしたお茶。京都のお菓子や飲み物に広く使われているよ。"},{"t":"煎茶","r":"せんちゃ","d":"お湯で淹れる日本茶のこと。食後に飲むとさっぱりするよ。"},{"t":"湯呑","r":"ゆのみ","d":"お茶を飲むための筒形の茶碗。日本の食卓でよく使われるよ。"},{"t":"酢","r":"す","d":"すっぱい味の調味料。餃子のたれに欠かせないものだよ。"},{"t":"七味","r":"しちみ","d":"唐辛子など七つの材料を混ぜた香辛料。うどんやラーメンにふりかけるよ。"},{"t":"胡麻","r":"ごま","d":"小さくて丸い種で、栄養たっぷりの食材。担々麺やごま豆腐に使われるよ。"},{"t":"味醂","r":"みりん","d":"料理に甘みとツヤを出す調味料。日本料理の味付けに欠かせないよ。"},{"t":"料理酒","r":"りょうりしゅ","d":"料理に使うお酒のこと。食材のくさみを消して味をよくするよ。"},{"t":"豆板醤","r":"とうばんじゃん","d":"唐辛子と空豆で作る辛い調味料。ピリ辛のラーメンに使われるよ。"},{"t":"油","r":"あぶら","d":"料理に使う液状の脂肪のこと。ラーメンのスープに浮かぶ油がコクを出すよ。"},{"t":"胡麻油","r":"ごまあぶら","d":"胡麻から絞った香りのよい油。中華料理やラーメンの仕上げに使われるよ。"},{"t":"葱油","r":"ねぎあぶら","d":"葱を油でじっくり加熱して香りを移した油。ラーメンに深い味わいを出すよ。"},{"t":"辣油","r":"らーゆ","d":"唐辛子を油に漬けて作る赤い辛い油。餃子や辛いラーメンに使うよ。"},{"t":"豚骨魚介","r":"とんこつぎょかい","d":"豚骨と魚介を合わせたスープ。濃厚なのに上品な味わいが特徴だよ。"},{"t":"清湯","r":"ちんたん","d":"澄んだきれいなスープのこと。丁寧にアクを取って作る上品な味だよ。"},{"t":"白湯","r":"ぱいたん","d":"骨や肉を強火で煮込んで白くにごらせたスープ。とろっとした食感だよ。"},{"t":"寸胴","r":"ずんどう","d":"大きくて深い円筒形の鍋。ラーメン屋でスープを作るのに使われるよ。"},{"t":"仕込","r":"しこみ","d":"料理を作る前に材料を準備すること。ラーメンのスープは朝早くから仕込むよ。"},{"t":"煮込","r":"にこみ","d":"材料を長い時間煮て味をしみこませること。スープ作りの大切な工程だよ。"},{"t":"炒","r":"いため","d":"油を使って食材を高温で加熱する調理法。野菜炒めや炒飯に使うよ。"},{"t":"蒸","r":"むし","d":"水蒸気の熱で食材を加熱する調理法。蒸し料理は栄養が逃げにくいよ。"},{"t":"茹","r":"ゆで","d":"沸騰したお湯で食材を加熱すること。麺の茹で加減がラーメンの味を左右するよ。"},{"t":"盛付","r":"もりつけ","d":"料理をお皿に美しく並べること。見た目も味のうちと言われるよ。"},{"t":"配膳","r":"はいぜん","d":"できた料理をお客さんに届けること。ラーメンは熱いうちに配膳されるよ。"},{"t":"完食","r":"かんしょく","d":"出された料理を全部食べきること。おいしいラーメンはあっという間に完食だよ。"},{"t":"啜","r":"すすり","d":"麺やスープを音を立てて吸い込むこと。日本ではラーメンは啜って食べるよ。"},{"t":"お冷","r":"おひや","d":"お店で出される冷たいお水のこと。ラーメンを食べた後に飲むとさっぱりするよ。"},{"t":"満腹","r":"まんぷく","d":"おなかがいっぱいになること。大盛りラーメンを食べると満腹になるよ。"},{"t":"空腹","r":"くうふく","d":" ,"d":"一年中緑の葉をつける木。一乗寺下り松は宮本武蔵ゆかりの松だよ。"},{"t":"下松","r":"さがりまつ","d":"一乗寺にある歴史的な松の木。宮本武蔵が決闘をした場所に立っているよ。"},{"t":"杉","r":"すぎ","d":"まっすぐ高く伸びる日本の代表的な木。お寺の参道によく植えられているよ。"},{"t":"楓","r":"かえで","d":"秋に美しく紅葉する木。手のひらのような形の葉が特徴だよ。"},{"t":"銀杏","r":"いちょう","d":"秋に葉が黄色くなる背の高い木。扇のような形の葉が特徴だよ。"},{"t":"藤","r":"ふじ","d":"春に紫や白の花が房のように垂れ下がる植物。棚仕立てにして楽しむよ。"},{"t":"萩","r":"はぎ","d":"秋の七草の一つで、小さなピンクの花が咲く。お寺の庭に植えられていることが多いよ。"},{"t":"蓮","r":"はす","d":"夏に大きな花が咲く水草。仏教ではとても大切な花とされているよ。"},{"t":"睡蓮","r":"すいれん","d":"池に浮かぶ葉の上に花が咲く水草。蓮に似ているけれど別の植物だよ。"},{"t":"菊","r":"きく","d":"秋に咲く日本を代表する花の一つ。皇室の紋章にも使われているよ。"},{"t":"牡丹","r":"ぼたん","d":"春に大きくて豪華な花を咲かせる植物。花の王様とも呼ばれるよ。"},{"t":"紫陽花","r":"あじさい","d":"梅雨の時期に青や紫の花が咲く植物。雨の季節を彩ってくれるよ。"},{"t":"彼岸花","r":"ひがんばな","d":"秋のお彼岸の頃に咲く赤い花。田んぼの近くでよく見かけるよ。"},{"t":"木蓮","r":"もくれん","d":"春に白や紫の大きな花が咲く木。花びらが肉厚で美しいよ。"},{"t":"山茶花","r":"さざんか","d":"冬に咲く椿に似た花。寒い季節に庭を彩ってくれるよ。"},{"t":"石","r":"いし","d":"自然にある固いかたまり。枯山水の庭では山や島を表す大切な要素だよ。"},{"t":"庭石","r":"にわいし","d":"庭に配置された石のこと。大きさや形を選んで美しく置かれるよ。"},{"t":"飛石","r":"とびいし","d":"庭の中で歩くために置かれた平らな石。一歩ずつ踏んで歩くよ。"},{"t":"石灯籠","r":"いしどうろう","d":"石で作られた灯りを入れる道具。日本庭園の大切な飾りだよ。"},{"t":"池","r":"いけ","d":"水をたたえた庭の一部。鯉が泳いだり蓮が咲いたりするよ。"},{"t":"泉","r":"いずみ","d":"地面から水が自然にわき出る場所。清らかで冷たい水が出てくるよ。"},{"t":"滝","r":"たき","d":"水が高い所から落ちる自然の景色。枯山水では石で滝を表現するよ。"},{"t":"渓流","r":"けいりゅう","d":"山の谷間を流れる小さな川。さらさらと水の音が心地よいよ。"},{"t":"清流","r":"せいりゅう","d":"澄んでいてきれいな川の流れ。比叡山の麓には清流が多いよ。"},{"t":"露","r":"つゆ","d":"朝に草や花の上に光る小さな水滴。季節の移り変わりを感じさせるよ。"},{"t":"霜","r":"しも","d":"寒い朝に地面やものの表面にできる白い氷の結晶。冬の訪れを告げるよ。"},{"t":"霧","r":"きり","d":"空気中の小さな水滴で視界が悪くなること。山の朝に霧がかかることがあるよ。"},{"t":"朝靄","r":"あさもや","d":"朝に立ちこめる薄い霧のこと。幻想的な風景を作り出すよ。"},{"t":"木漏日","r":"こもれび","d":"木の葉の間から差し込む太陽の光。地面にまだら模様を作るよ。"},{"t":"夕焼","r":"ゆうやけ","d":"夕方に西の空が赤く染まる現象。美しい夕焼けは翌日晴れると言われるよ。"},{"t":"月","r":"つき","d":"夜空に輝く地球の衛星。満月の夜はお月見をして楽しむよ。"},{"t":"月見","r":"つきみ","d":"秋の夜に美しい月を眺める行事。団子やすすきをお供えするよ。"},{"t":"星","r":"ほし","d":"夜空に光り輝く天体のこと。一乗寺は比叡山が近くて星がきれいに見えるよ。"},{"t":"虹","r":"にじ","d":"雨上がりに空にかかる七色の弧。太陽の光がプリズムになって見えるよ。"},{"t":"風","r":"かぜ","d":"空気が動くこと。竹林を吹き抜ける風はとても心地よいよ。"},{"t":"微風","r":"そよかぜ","d":"穏やかに吹くやさしい風のこと。庭園を散策するのに気持ちいいよ。"},{"t":"春","r":"はる","d":"桜が咲き花々が芽吹く季節。一乗寺のお寺の庭も春の花で彩られるよ。"},{"t":"夏","r":"なつ","d":"暑くて日差しが強い季節。お寺の木陰はひんやりして涼しいよ。"},{"t":"秋","r":"あき","d":"紅葉が美しく実りの多い季節。一乗寺は秋の紅葉シーズンに多くの人が訪れるよ。"},{"t":"冬","r":"ふゆ","d":"寒くて雪が降る季節。雪化粧した一乗寺のお寺はとても幻想的だよ。"},{"t":"雪","r":"ゆき","d":"空から降る白い結晶。庭園に積もった雪は静かで美しい風景を作るよ。"},{"t":"氷","r":"こおり","d":"水が凍って固くなったもの。冬の朝には池の水面が氷で覆われるよ。"},{"t":"雨","r":"あめ","d":"空から水の粒が降ってくること。雨に濡れた苔庭はいっそう鮮やかだよ。"},{"t":"梅雨","r":"つゆ","d":"6月頃に続く長い雨の季節。苔や紫陽花がいちばん美しい時期だよ。"},{"t":"時雨","r":"しぐれ","d":"晩秋から冬にかけて降ったりやんだりする雨。京都の風情ある天気だよ。"},{"t":"山","r":"やま","d":"地面が高く盛り上がった地形。一乗寺は比叡山のふもとにある町だよ。"},{"t":"山麓","r":"さんろく","d":"山のふもとの部分。一乗寺は比叡山の山麓に位置しているよ。"},{"t":"谷","r":"たに","d":"山と山の間のくぼんだ低い場所。狸谷山の名前にも谷が入っているよ。"},{"t":"丘","r":"おか","d":"小さくなだらかに高くなった地形。見晴らしが良くて気持ちいい場所だよ。"},{"t":"野原","r":"のはら","d":"草が一面に生えた広い土地。春にはたくさんの花が咲くよ。"},{"t":"小径","r":"こみち","d":"細い道のこと。お寺や庭園の中にある小径を歩くのは楽しいよ。"},{"t":"鹿威","r":"ししおどし","d":"竹の筒に水がたまると倒れてカコンと音がする庭の仕掛け。詩仙堂が発祥の地だよ。"},{"t":"蛙","r":"かえる","d":"水辺に住む両生類。古池に蛙が飛び込む音は芭蕉の有名な俳句だよ。"},{"t":"蝉","r":"せみ","d":"夏に大きな声で鳴く昆虫。お寺の境内で蝉の声が響くと夏を感じるよ。"},{"t":"蛍","r":"ほたる","d":"夏の夜にお尻が光る昆虫。きれいな川の近くに住んでいるよ。"},{"t":"鯉","r":"こい","d":"池や川に住む大きな魚。お寺の池で優雅に泳いでいるよ。"},{"t":"鶯","r":"うぐいす","d":"春にホーホケキョと美しく鳴く鳥。春を告げる鳥として親しまれているよ。"},{"t":"雀","r":"すずめ","d":"身近にいる小さな茶色い鳥。庭先でチュンチュンと鳴くかわいい鳥だよ。"},{"t":"鴉","r":"からす","d":"黒い体と賢い頭を持つ大きな鳥。カーカーと鳴く声はよく聞こえるよ。"},{"t":"蝶","r":"ちょう","d":"美しい羽を持つ昆虫。花から花へひらひらと飛んでいくよ。"},{"t":"蜻蛉","r":"とんぼ","d":"大きな目と透明な羽を持つ昆虫。秋の空をすいすい飛ぶ姿が見られるよ。"},{"t":"猫","r":"ねこ","d":"人に懐く小さな動物。お寺の境内でのんびり寝ている猫を見かけることがあるよ。"},{"t":"紅","r":"くれない","d":"深い赤色のこと。紅葉の紅は秋の京都を代表する色だよ。"},{"t":"翠","r":"みどり","d":"鮮やかな緑色のこと。新緑の季節のお寺の庭は翠に輝くよ。"},{"t":"落葉","r":"おちば","d":"木から落ちた葉っぱのこと。秋の庭を歩くと落葉がカサカサと音を立てるよ。"},{"t":"常緑","r":"じょうりょく","d":"一年中緑の葉をつけていること。松や杉は常緑樹の代表だよ。"},{"t":"若葉","r":"わかば","d":"春に芽吹いたばかりの柔らかい緑色の葉。生命力を感じさせるよ。"},{"t":"花弁","r":"はなびら","d":"花の一枚一枚の部分。桜の花弁が風に舞い散る姿は美しいよ。"},{"t":"蕾","r":"つぼみ","d":"花が咲く前のまだ閉じた状態。蕾が膨らむと開花が近い合図だよ。"},{"t":"種","r":"たね","d":"植物が増えるための小さな粒。土に蒔くと芽が出て成長するよ。"},{"t":"根","r":"ね","d":"植物が地中に伸ばす部分。水や栄養分を吸い上げる大切な役割があるよ。"},{"t":"幹","r":"みき","d":"木の中心になる太い部分。古い木の幹は太くてごつごつしているよ。"},{"t":"枝","r":"えだ","d":"木の幹から伸びる細い部分。枝に葉や花がつくよ。"},{"t":"葉","r":"は","d":"植物が光合成をする緑色の部分。秋になると色が変わる葉もあるよ。"},{"t":"芽","r":"め","d":"植物が新しく出す若い部分。春になると木々から小さな芽が出てくるよ。"},{"t":"土","r":"つち","d":"地面を作っている柔らかい物質。植物が育つために欠かせないものだよ。"},{"t":"岩","r":"いわ","d":"とても大きな石のこと。庭園では岩が山や島を表す大事な要素だよ。"},{"t":"砂利","r":"じゃり","d":"小さな石のこと。お寺の参道に敷かれて歩くとザクザク音がするよ。"},{"t":"築山","r":"つきやま","d":"庭園の中に土を盛って作った小さな山。景色に変化をつけるためだよ。"},{"t":"石組","r":"いしぐみ","d":"庭園で石を組み合わせて配置すること。自然の風景を表現する技法だよ。"},{"t":"垣根","r":"かきね","d":"竹や木で作った庭の仕切り。京都の庭園には美しい竹垣が多いよ。"},{"t":"生垣","r":"いけがき","d":"植物を並べて作った庭の仕切り。刈り込んで形を整えるよ。"},{"t":"縁側","r":"えんがわ","d":"日本の家屋で部屋と庭の間にある板敷き。座って庭を眺められるよ。"},{"t":"宮本武蔵","r":"みやもとむさし","d":"江戸時代初期の伝説的な剣豪。一乗寺下り松で吉岡一門と決闘したよ。"},{"t":"吉岡一門","r":"よしおかいちもん","d":"京都の有名な剣術の一族。宮本武蔵と一乗寺で戦ったと伝えられるよ。"},{"t":"決闘","r":"けっとう","d":"二人が約束して戦うこと。武蔵と吉岡一門の決闘は一乗寺で行われたよ。"},{"t":"剣術","r":"けんじゅつ","d":"刀を使う戦いの技術。日本の武道の中でもっとも歴史が長いものの一つだよ。"},{"t":"剣豪","r":"けんごう","d":"刀の腕前がとても優れた武人。宮本武蔵は日本一の剣豪と呼ばれるよ。"},{"t":"二刀流","r":"にとうりゅう","d":"両手に一本ずつ刀を持って戦う技。宮本武蔵が考え出した戦い方だよ。"},{"t":"五輪書","r":"ごりんのしょ","d":"宮本武蔵が書いた武道と人生の教えの本。地水火風空の五つに分かれるよ。"},{"t":"刀","r":"かたな","d":"武士が使う片刃の長い刃物。日本の伝統的な武器だよ。"},{"t":"太刀","r":"たち","d":"刀よりも長くて反りが大きい日本刀。腰から下げて使うよ。"},{"t":"脇差","r":"わきざし","d":"刀より短い日本刀のこと。武士は刀と脇差の二本を差していたよ。"},{"t":"鞘","r":"さや","d":"刀を収めておく筒状の入れ物。刀を守り安全に持ち運ぶためのものだよ。"},{"t":"鍔","r":"つば","d":"刀の柄と刃の間にある丸い金属。手を守る役目がある装飾品だよ。"},{"t":"柄","r":"つか","d":"刀や道具の手で握る部分。紐が巻かれていて滑りにくくなっているよ。"},{"t":"武士","r":"ぶし","d":"戦いを仕事とした日本の戦士。名誉と忠義を大切にしていたよ。"},{"t":"侍","r":"さむらい","d":"主君に仕えた日本の武士のこと。世界中で知られる日本の象徴だよ。"},{"t":"武士道","r":"ぶしどう","d":"武士が守るべき道徳や生き方。忠義や礼儀を重んじる精神だよ。"},{"t":"武者","r":"むしゃ","d":"鎧を着て戦う武士のこと。武者修行は腕を磨くための旅のことだよ。"},{"t":"修業","r":"しゅうぎょう","d":"技術や学問を学んで身につけること。武蔵も若い頃から剣の修業をしたよ。"},{"t":"道場","r":"どうじょう","d":"武道の練習をする場所。剣道や柔道の稽古をする建物だよ。"},{"t":"稽古","r":"けいこ","d":"武道や芸事の練習をすること。毎日の稽古が上達への近道だよ。"},{"t":"鎧","r":"よろい","d":"戦いで体を守るための防具。金属や革で作られた武士の装備だよ。"},{"t":"兜","r":"かぶと","d":"頭を守るための防具。武将の兜には立派な飾りがついていたよ。"},{"t":"弓","r":"ゆみ","d":"矢を飛ばすためのしなる武器。弓道は日本の伝統的な武道だよ。"},{"t":"矢","r":"や","d":"弓で飛ばす先のとがった棒。的に当てる技術が弓道では大切だよ。"},{"t":"槍","r":"やり","d":"長い柄の先にとがった刃がついた武器。戦場では刀より使われたこともあるよ。"},{"t":"盾","r":"たて","d":"敵の攻撃を防ぐための板状の防具。身を守る大切な道具だよ。"},{"t":"武芸","r":"ぶげい","d":"武器を使う技術のこと。剣術や弓術などいろいろな種類があるよ。"},{"t":"兵法","r":"へいほう","d":"戦いの作戦や方法のこと。宮本武蔵の五輪書は兵法の名著だよ。"},{"t":"真剣","r":"しんけん","d":"本物の刀のこと。また、ものすごく本気で取り組むという意味もあるよ。"},{"t":"切先","r":"きっさき","d":"刀の先端の部分。鋭くとがっていて最も切れ味が良い場所だよ。"},{"t":"構","r":"かまえ","d":"刀や体を戦いの姿勢に整えること。正しい構えが勝負を左右するよ。"},{"t":"一閃","r":"いっせん","d":"刀を一瞬で振り抜くこと。素早い一閃が勝負を決めることもあるよ。"},{"t":"石川丈山","r":"いしかわじょうざん","d":"武士から文人になった人物。一乗寺に詩仙堂を建てた江戸時代初期の人だよ。"},{"t":"徳川家康","r":"とくがわいえやす","d":"江戸幕府を開いた初代将軍。圓光寺を学問のために建てさせたよ。"},{"t":"将軍","r":"しょうぐん","d":"武士の最高指導者。幕府の長として日本を治めた人だよ。"},{"t":"幕府","r":"ばくふ","d":"将軍が政治を行った武士の政府。江戸幕府は約260年続いたよ。"},{"t":"合戦","r":"かっせん","d":"大勢の兵士が戦う戦のこと。歴史には有名な合戦がたくさんあるよ。"},{"t":"城","r":"しろ","d":"敵から身を守るために石垣や堀で囲んだ建物。京都には二条城があるよ。"},{"t":"天守","r":"てんしゅ","d":"お城の中でいちばん高い建物。遠くまで見渡せるお城の象徴だよ。"},{"t":"石垣","r":"いしがき","d":"石を積み上げて作った壁。お城や段差のある土地を支えるものだよ。"},{"t":"堀","r":"ほり","d":"城の周りに掘った水路。敵の侵入を防ぐために作られたよ。"},{"t":"戦国","r":"せんごく","d":"武将たちが天下を争った時代。15世紀後半から16世紀にかけての動乱期だよ。"},{"t":"天下","r":"てんか","d":"国全体のこと。天下を統一するとは国をまとめることだよ。"},{"t":"忠義","r":"ちゅうぎ","d":"主君に誠実に仕えること。武士にとって最も大切な徳とされたよ。"},{"t":"名誉","r":"めいよ","d":"立派な行いによって得られる評判。武士は名誉を命より大切にしたよ。"},{"t":"覚悟","r":"かくご","d":"困難に立ち向かう心の準備をすること。武蔵は常に覚悟を持って戦ったよ。"},{"t":"胆力","r":"たんりょく","d":"恐ろしいことにも動じない心の強さ。武道では胆力が大切だよ。"},{"t":"気迫","r":"きはく","d":"相手を圧倒するほどの強い気持ち。勝負の場面では気迫が重要だよ。"},{"t":"達人","r":"たつじん","d":"技術がとても優れた人のこと。剣の達人は何年もの修行を積んでいるよ。"},{"t":"流派","r":"りゅうは","d":"武道や芸術の技の系統。剣術にはたくさんの流派があるよ。"},{"t":"師範","r":"しはん","d":"武道や芸事を教える先生のこと。弟子たちの指導をする立場だよ。"},{"t":"弟子","r":"でし","d":"先生に教えを受けて学ぶ人。師匠について技や知識を身につけるよ。"},{"t":"師匠","r":"ししょう","d":"弟子に技術や教えを授ける先生。敬意を込めてお師匠様とも呼ぶよ。"},{"t":"奥義","r":"おうぎ","d":"最も深く秘められた技 いこと。海水のように塩味が強い食べ物のことだよ。"},{"t":"淡白","r":"たんぱく","d":"味や性格があっさりしていること。淡白な味の料理もおいしいよ。"},{"t":"芳醇","r":"ほうじゅん","d":"香りや味がとても豊かなこと。よく熟成されたお酒は芳醇な味がするよ。"},{"t":"熱","r":"あつい","d":"温度が高いこと。ラーメンは熱々のうちに食べるのがいちばんだよ。"},{"t":"冷","r":"つめたい","d":"温度が低いこと。冷たいお水はラーメンの後にぴったりだよ。"},{"t":"温","r":"あたたかい","d":"心地よいくらいの熱さがあること。温かいスープは体も心も温めてくれるよ。"},{"t":"涼","r":"すずしい","d":"暑くなくて心地よいこと。木陰にいると涼しい風が吹いてくるよ。"},{"t":"美","r":"うつくしい","d":"見た目がとてもきれいなこと。紅葉に彩られたお寺は美しいよ。"},{"t":"醜","r":"みにくい","d":"見た目がよくないこと。見かけが悪くてもおいしい料理はたくさんあるよ。"},{"t":"大","r":"おおきい","d":"サイズや量が多いこと。大きな丼いっぱいのラーメンは食べごたえがあるよ。"},{"t":"小","r":"ちいさい","d":"サイズや量が少ないこと。小さなお寺にも素晴らしい庭園があるよ。"},{"t":"長","r":"ながい","d":"端から端までの距離があること。ラーメン屋の行列が長い日もあるよ。"},{"t":"短","r":"みじかい","d":"端から端までの距離がないこと。俳句は短い言葉で深い意味を表すよ。"},{"t":"高","r":"たかい","d":"位置や値段が上にあること。比叡山は一乗寺から見上げる高い山だよ。"},{"t":"低","r":"ひくい","d":"位置や高さが下にあること。一乗寺駅は低い場所にあって山に向かって登るよ。"},{"t":"広","r":"ひろい","d":"面積や空間が大きいこと。広い庭園を歩くのは気持ちがいいよ。"},{"t":"狭","r":"せまい","d":"面積や空間が小さいこと。人気ラーメン店は狭い店内に人がぎっしりだよ。"},{"t":"深","r":"ふかい","d":"表面から底までの距離があること。一乗寺の歴史はとても深いよ。"},{"t":"浅","r":"あさい","d":"表面から底までの距離がないこと。浅い器にスープを注ぐと冷めやすいよ。"},{"t":"太","r":"ふとい","d":"幅や直径が大きいこと。太い麺は食べごたえがあってもちもちするよ。"},{"t":"細","r":"ほそい","d":"幅や直径が小さいこと。細い路地を歩くと京都の風情を感じるよ。"},{"t":"重","r":"おもい","d":"物の質量が大きいこと。石灯籠はとても重い石でできているよ。"},{"t":"軽","r":"かるい","d":"物の質量が小さいこと。軽い味わいのラーメンもさっぱりしておいしいよ。"},{"t":"硬","r":"かたい","d":"力を加えても形が変わりにくいこと。固茹での麺はコシがあるよ。"},{"t":"柔","r":"やわらかい","d":"力を加えると形が変わりやすいこと。柔らかいチャーシューは口の中でとろけるよ。"},{"t":"明","r":"あかるい","d":"光があって見やすいこと。朝の日差しが明るくお寺を照らすよ。"},{"t":"暗","r":"くらい","d":"光が少なくて見にくいこと。夜の参道は暗くて静かな雰囲気だよ。"},{"t":"静","r":"しずか","d":"音がなくて落ち着いていること。早朝のお寺はとても静かだよ。"},{"t":"騒","r":"さわがしい","d":"音が多くてうるさいこと。お昼時のラーメン屋は活気があって賑やかだよ。"},{"t":"速","r":"はやい","d":"動きのスピードが大きいこと。武蔵の剣はとても速かったと言われるよ。"},{"t":"遅","r":"おそい","d":"動きのスピードが小さいこと。ゆっくりと庭園を歩くと発見が多いよ。"},{"t":"新","r":"あたらしい","d":"できてからあまり時間が経っていないこと。一乗寺には新しいお店もできるよ。"},{"t":"古","r":"ふるい","d":"長い時間が経っていること。古いお寺には深い歴史が刻まれているよ。"},{"t":"若","r":"わかい","d":"年齢が少ないこと。若い店主が新しいラーメンを生み出しているよ。"},{"t":"丸","r":"まるい","d":"角がなくて円の形をしていること。丸い器にラーメンが盛り付けられるよ。"},{"t":"白","r":"しろい","d":"雪や牛乳のような色のこと。白いスープの鶏白湯ラーメンは見た目も美しいよ。"},{"t":"黒","r":"くろい","d":"墨やカラスのような色のこと。黒い器に盛るとラーメンが映えるよ。"},{"t":"赤","r":"あかい","d":"血や炎のような色のこと。紅葉は赤く色づいた葉がとても美しいよ。"},{"t":"青","r":"あおい","d":"空や海のような色のこと。青い空に映える紅葉の赤は息をのむ美しさだよ。"},{"t":"黄","r":"きいろい","d":"たんぽぽやバナナのような色のこと。銀杏の黄色い葉は秋の風物詩だよ。"},{"t":"緑","r":"みどり","d":"草や木の葉のような色のこと。苔の緑は京都の庭園を美しく彩るよ。"},{"t":"紫","r":"むらさき","d":"藤の花や茄子のような色のこと。京都では高貴な色として大切にされたよ。"},{"t":"金","r":"きん","d":"輝く黄色い貴金属の色。金箔は京都の工芸品によく使われるよ。"},{"t":"銀","r":"ぎん","d":"白く輝く貴金属の色。銀閣寺の名前はこの色から来ているよ。"},{"t":"透明","r":"とうめい","d":"向こう側が見えるほど澄んでいること。清らかな泉の水は透明だよ。"},{"t":"鮮","r":"あざやか","d":"色や味がはっきりしていること。秋の紅葉は鮮やかな赤やオレンジに染まるよ。"},{"t":"淡","r":"あわい","d":"色や味がうすくてやさしいこと。淡い色の花は控えめな美しさがあるよ。"},{"t":"濃","r":"こい","d":"色や味が強いこと。濃い味のスープは食べごたえがあるよ。"},{"t":"香","r":"かおり","d":"よいにおいのこと。線香やお花の香りがお寺に漂っているよ。"},{"t":"匂","r":"におい","d":"鼻で感じるもののにおい。ラーメンのいい匂いはお店の外まで漂うよ。"},{"t":"艶","r":"つや","d":"表面がなめらかに光っている状態。みずみずしい苔には美しい艶があるよ。"},{"t":"滑","r":"なめらか","d":"表面にでこぼこがなくすべすべしていること。クリーミーなスープは滑らかだよ。"},{"t":"粗","r":"あらい","d":"表面や質感がざらざらしていること。粗い石の表面は触ると独特の感触だよ。"},{"t":"濡","r":"ぬれた","d":"水分を含んでいること。雨に濡れた石畳は光を反射して美しいよ。"},{"t":"乾","r":"かわいた","d":"水分がない状態のこと。乾いた白砂に描かれた模様は美しいよ。"},{"t":"柔和","r":"にゅうわ","d":"優しくて穏やかなこと。仏様の柔和な表情は見る人の心を落ち着かせるよ。"},{"t":"厳粛","r":"げんしゅく","d":"厳かでおごそかなこと。お寺の法要は厳粛な雰囲気で行われるよ。"},{"t":"荘厳","r":"そうごん","d":"立派でおごそかなこと。大きなお寺の本堂は荘厳な雰囲気に包まれるよ。"},{"t":"優雅","r":"ゆうが","d":"上品で美しいこと。庭園を眺めながらのお茶の時間は優雅だよ。"},{"t":"素朴","r":"そぼく","d":"飾り気がなく自然なこと。素朴な味わいの料理にはほっとするよ。"},{"t":"質素","r":"しっそ","d":"地味でつつましいこと。石川丈山は質素な暮らしの中で詩を楽しんだよ。"},{"t":"華麗","r":"かれい","d":"はなやかで美しいこと。牡丹の花は華麗な姿で人を魅了するよ。"},{"t":"壮大","r":"そうだい","d":"規模が大きくて立派なこと。比叡山の眺めは壮大で心が洗われるよ。"},{"t":"繊細","r":"せんさい","d":"細かくてデリケートなこと。京都の工芸品は繊細な技術で作られるよ。"},{"t":"豪快","r":"ごうかい","d":"大胆で力強いこと。山盛りのラーメンを豪快に食べるのは気持ちいいよ。"},{"t":"穏","r":"おだやか","d":"落ち着いていて静かなこと。一乗寺の住宅街は穏やかな雰囲気だよ。"},{"t":"厳","r":"きびしい","d":"ルールが厳しいこと。武道の修行は厳しいけれど人を成長させるよ。"},{"t":"清浄","r":"せいじょう","d":"汚れがなくきよらかなこと。朝のお寺の空気は清浄でさわやかだよ。"},{"t":"神聖","r":"しんせい","d":"神様に関わるおごそかなこと。神社の境内は神聖な空間だよ。"},{"t":"豊","r":"ゆたか","d":"たくさんあって満ち足りていること。一乗寺の文化は豊かで多様だよ。"},{"t":"乏","r":"とぼしい","d":"あるべきものが足りないこと。水が乏しい枯山水はかえって美を生むよ。"},{"t":"賑","r":"にぎやか","d":"人が多くて活気があること。お昼時のラーメン街道は賑やかだよ。"},{"t":"寂寥","r":"せきりょう","d":"ものさびしいこと。冬枯れの庭園には寂寥とした美しさがあるよ。"},{"t":"勇敢","r":"ゆうかん","d":"恐れずに立ち向かう心の強さ。宮本武蔵は勇敢な剣士だったよ。"},{"t":"堅固","r":"けんご","d":"しっかりとして壊れにくいこと。お城の石垣は堅固に作られているよ。"},{"t":"端正","r":"たんせい","d":"きちんと整っていて美しいこと。日本庭園は端正な美しさが魅力だよ。"},{"t":"壮観","r":"そうかん","d":"規模が大きくてすばらしい眺め。紅葉に染まった山の景色は壮観だよ。"},{"t":"幻想的","r":"げんそうてき","d":"まるで夢のように美しいこと。霧に包まれた朝のお寺は幻想的だよ。"},{"t":"清楚","r":"せいそ","d":"清らかで飾り気がなく美しいこと。白い花が咲く庭は清楚な美しさだよ。"},{"t":"円熟","r":"えんじゅく","d":"経験を積んで完成度が高くなること。匠の技は長い年月で円熟するよ。"},{"t":"素晴","r":"すばらしい","d":"とても優れていて感動するほどよいこと。一乗寺の紅葉は素晴らしいよ。"},{"t":"懐","r":"なつかしい","d":"昔のことを思い出して温かい気持ちになること。昔ながらの町並みは懐かしいよ。"},{"t":"珍","r":"めずらしい","d":"あまり見かけなくて特別なこと。珍しい植物がお寺の庭にあることもあるよ。"},{"t":"愉快","r":"ゆかい","d":"楽しくて心が弾むこと。友達と一乗寺を散策するのは愉快だよ。"},{"t":"快適","r":"かいてき","d":"気持ちよくて心地いいこと。お寺の縁側に座ると快適で眠くなるよ。"},{"t":"清涼","r":"せいりょう","d":"さわやかで涼しいこと。山から吹く風は清涼感があるよ。"},{"t":"格別","r":"かくべつ","d":"ほかと比べて特別に優れていること。行列して食べたラーメンの味は格別だよ。"},{"t":"凛","r":"りん","d":"きりっとして引き締まっていること。冬の朝のお寺の空気は凛としているよ。"},{"t":"瑞々","r":"みずみずしい","d":"新鮮でうるおいがあること。朝露に濡れた葉は瑞々しくて美しいよ。"},{"t":"芳","r":"かんばしい","d":"とてもよい香りがすること。梅の花は芳しい香りで春を知らせるよ。"},{"t":"崇高","r":"すうこう","d":"気高くてとても尊いこと。比叡山の頂は崇高な雰囲気に包まれているよ。"},{"t":"清閑","r":"せいかん","d":"静かで落ち着いていること。詩仙堂は清閑なたたずまいが魅力だよ。"},{"t":"朗","r":"ほがらか","d":"明るくて元気がよいこと。ラーメン屋の店主は朗らかな人が多いよ。"},{"t":"滋味","r":"じみ","d":"栄養があって深い味わいのこと。出汁のきいた料理は滋味深いよ。"},{"t":"典雅","r":"てんが","d":"上品で格式のある美しさ。曼殊院の庭園は典雅な趣があるよ。"},{"t":"柔軟","r":"じゅうなん","d":"しなやかで曲げやすいこと。柔軟な考え方が新しいものを生むよ。"},{"t":"茶道","r":"さどう","d":"お茶を点てておもてなしする日本の伝統文化。わびさびの精神を大切にするよ。"},{"t":"茶室","r":"ちゃしつ","d":"茶道のお稽古やお茶会をする小さな部屋。にじり口から入る質素な空間だよ。"},{"t":"茶碗","r":"ちゃわん","d":"お茶を飲むための器。一つ一つ形や色が違って個性があるよ。"},{"t":"茶杓","r":"ちゃしゃく","d":"抹茶をすくうための細い竹のさじ。茶道で使う大切な道具だよ。"},{"t":"茶筅","r":"ちゃせん","d":"抹茶をたてるための竹の道具。お湯と抹茶を混ぜてふわふわにするよ。"},{"t":"点前","r":"てまえ","d":"茶道でお茶を点てる一連の動作。決められた美しい所作で行うよ。"},{"t":"陶芸","r":"とうげい","d":"粘土を形作って焼き物を作る工芸。京都には清水焼などの伝統がある。"},{"t":"清水焼","r":"きよみずやき","d":"京都で作られる伝統的な焼き物。繊細な絵付けが特徴の美しい器だよ。"},{"t":"釉薬","r":"ゆうやく","d":"焼き物の表面に塗るガラス質のうわぐすり。色や光沢を出すのに使うよ。"},{"t":"窯","r":"かま","d":"焼き物を高温で焼くための炉。陶芸家にとって窯は大切な道具だよ。"},{"t":"轆轤","r":"ろくろ","d":"陶芸で粘土を回しながら形を作る道具。くるくる回して器の形を作るよ。"},{"t":"着物","r":"きもの","d":"日本の伝統的な衣服。帯を締めて着る美しい衣装だよ。"},{"t":"帯","r":"おび","d":"着物の腰に巻く幅広い布。結び方にいろいろな種類があるよ。"},{"t":"袴","r":"はかま","d":"着物の上から履くズボン状の和服。武道や卒業式で着ることがあるよ。"},{"t":"紋","r":"もん","d":"家や家族を表す印のデザイン。着物や旗に入れて使うよ。"},{"t":"友禅","r":"ゆうぜん","d":"京都の伝統的な着物の染め方。美しい模様を布に描く技法だよ。"},{"t":"西陣織","r":"にしじんおり","d":"京都の西陣で作られる高級な織物。帯や着物に使われる華やかな布だよ。"},{"t":"染色","r":"せんしょく","d":"布に色をつける技術のこと。京都には藍染めなど様々な染色の伝統があるよ。"},{"t":"藍染","r":"あいぞめ","d":"藍という植物で布を青く染める技法。深い青色がとても美しいよ。"},{"t":"扇子","r":"せんす","d":"折りたたみ式のうちわ。涼を取ったり舞いに使ったりする日本の道具だよ。"},{"t":"団扇","r":"うちわ","d":"あおいで風を起こす平たい道具。夏にあおぐと涼しくなるよ。"},{"t":"漆器","r":"しっき","d":"木の器に漆を塗った伝統工芸品。つやがあって美しい食器だよ。"},{"t":"漆","r":"うるし","d":"木から取れる天然の塗料。何度も塗り重ねると光沢のある美しい仕上がりになるよ。"},{"t":"蒔絵","r":"まきえ","d":"漆の上に金粉や銀粉で模様を描く技法。日本独特の美しい装飾だよ。"},{"t":"竹工芸","r":"たけこうげい","d":"竹を編んだり加工したりして作る工芸品。かごや花入れなどがあるよ。"},{"t":"組紐","r":"くみひも","d":"糸を組んで作る紐の工芸。着物の帯締めや刀の柄に巻くよ。"},{"t":"正月","r":"しょうがつ","d":"一年の始まりを祝う行事。初詣にお寺や神社にお参りするよ。"},{"t":"初詣","r":"はつもうで","d":"新年最初に神社やお寺にお参りすること。一年の無事を祈るよ。"},{"t":"節分","r":"せつぶん","d":"2月3日頃に行う豆まきの行事。鬼を追い出して福を呼び込むよ。"},{"t":"雛祭","r":"ひなまつり","d":"3月3日に女の子の健やかな成長を願う行事。お雛様を飾るよ。"},{"t":"端午","r":"たんご","d":"5月5日の子供の日のこと。鯉のぼりを立てて男の子の成長を祝うよ。"},{"t":"七夕","r":"たなばた","d":"7月7日に願い事を短冊に書く行事。織姫と彦星の伝説がもとになったよ。"},{"t":"盆","r":"ぼん","d":"8月にご先祖様の魂をお迎えする行事。京都では大文字焼きが有名だよ。"},{"t":"大文字","r":"だいもんじ","d":"8月16日に山の斜面に大の字の火を灯す京都の行事。一乗寺からもよく見えるよ。"},{"t":"五山送火","r":"ござんのおくりび","d":"お盆の精霊を送る京都の伝統行事。五つの山に火を灯して送り出すよ。"},{"t":"七五三","r":"しちごさん","d":"3歳5歳7歳の子供の成長を祝う行事。神社にお参りして千歳飴をもらうよ。"},{"t":"花見","r":"はなみ","d":"桜の花を眺めて楽しむ春の行事。家族や友達でお弁当を食べるよ。"},{"t":"紅葉狩","r":"もみじがり","d":"紅葉を見に出かけること。秋に一乗寺のお寺を巡るのにぴったりだよ。"},{"t":"茶懐石","r":"ちゃかいせき","d":"茶会でお茶の前に出される料理。季節感のある品々が美しく並ぶよ。"},{"t":"能","r":"のう","d":"面をつけて舞う日本の伝統芸能。幽玄の美を表現する格式高い舞台だよ。"},{"t":"狂言","r":"きょうげん","d":"能の合間に演じられるユーモラスな劇。笑いのある伝統芸能だよ。"},{"t":"歌舞伎","r":"かぶき","d":"派手な化粧と衣装で演じる日本の伝統演劇。京都の南座は有名な劇場だよ。"},{"t":"雅楽","r":"ががく","d":"日本に古くから伝わる宮廷音楽。笛や太鼓で奏でるゆったりとした音楽だよ。"},{"t":"三味線","r":"しゃみせん","d":"三本の弦を弾いて音を出す日本の楽器。独特の音色が特徴だよ。"},{"t":"琴","r":"こと","d":"十三本の弦を弾いて演奏する日本の楽器。雅やかな音色が美しいよ。"},{"t":"笛","r":"ふえ","d":"息を吹き込んで音を出す管楽器。竹で作った笛は日本の伝統楽器だよ。"},{"t":"太鼓","r":"たいこ","d":"革を張った面を叩いて音を出す打楽器。祭りでは力強い太鼓の音が響くよ。"},{"t":"千利休","r":"せんのりきゅう","d":"茶道を大成させた安土桃山時代の茶人。わび茶の精神を確立したよ。"},{"t":"人間国宝","r":"にんげんこくほう","d":"伝統工芸や芸能の技を極めた人への称号。日本の宝として認められた人だよ。"},{"t":"無形文化財","r":"むけいぶんかざい","d":"形のない芸能や技術で守るべき文化財。伝統芸能や工芸技術が指定されるよ。"},{"t":"活字","r":"かつじ","d":"印刷に使う一つ一つの文字の型。圓光寺には日本最古の木活字が残っているよ。"},{"t":"木活字","r":"もくかつじ","d":"木で作った印刷用の文字の型。圓光寺にあるものは日本でいちばん古いよ。"},{"t":"印刷","r":"いんさつ","d":"文字や絵を紙などに写す技術。活字の発明で本がたくさん作られるようになったよ。"},{"t":"学問所","r":"がくもんじょ","d":"学問を教え研究する施設。圓光寺は家康が開いた学問所が始まりだよ。"},{"t":"儒学","r":"じゅがく","d":"孔子の教えをもとにした学問。道徳や礼儀を大切にする考え方だよ。"},{"t":"論語","r":"ろんご","d":"孔子とその弟子の言行をまとめた本。人の道を教えてくれる古典だよ。"},{"t":"漢学","r":"かんがく","d":"中国の文学や思想を学ぶ学問。江戸時代の武士はみんな漢学を学んだよ。"},{"t":"国学","r":"こくがく","d":"日本独自の文化や精神を研究する学問。万葉集など古い文学を大切にしたよ。"},{"t":"文学","r":"ぶんがく","d":"言葉を使って人の心や社会を表現する芸術。小説や詩や随筆などがあるよ。"},{"t":"哲学","r":"てつがく","d":"ものごとの真理を深く考える学問。哲学の道は一乗寺の近くにあるよ。"},{"t":"思想","r":"しそう","d":"考えや思いの体系のこと。禅の思想は日本の文化に深く影響しているよ。"},{"t":"教養","r":"きょうよう","d":"幅広い知識と物事を考える力。本を読むことは教養を身につける近道だよ。"},{"t":"知恵","r":"ちえ","d":"物事をうまく解決する賢い考え。昔の人の知恵は今も役に立つよ。"},{"t":"読書","r":"どくしょ","d":"本を読むこと。恵文社のような素敵な書店は読書への扉を開くよ。"},{"t":"書物","r":"しょもつ","d":"文字が書かれた本のこと。昔の書物には先人の知恵が詰まっているよ。"},{"t":"巻物","r":"まきもの","d":"紙や布を棒に巻いた昔の書き物の形式。絵巻物は日本の大切な美術品だよ。"},{"t":"写本","r":"しゃほん","d":"本を手で書き写したもの。印刷術がなかった時代は写本で本を増やしたよ。"},{"t":"版木","r":"はんぎ","d":"木の板に文字や絵を彫って印刷する道具。活字が使われる前の印刷方法だよ。"},{"t":"教育","r":"きょういく","d":"人に知識や技術を教えて育てること。圓光寺は教育のために作られたよ。"},{"t":"師弟","r":"してい","d":"先生と弟子の関係のこと。師弟の絆が技や知恵を次の世代に伝えるよ。"},{"t":"学舎","r":"まなびや","d":"学びの場所、学校のこと。圓光寺は江戸時代の大切な学舎だったよ。"},{"t":"研鑽","r":"けんさん","d":"学問や技術を磨き上げること。日々の研鑽が人を成長させるよ。"},{"t":"探求","r":"たんきゅう","d":"深く調べて真理を求めること。学問は未知への探求の旅だよ。"},{"t":"智慧","r":"ちえ","d":"仏教でいう物事の本質を見抜く力。深い理解と判断力のことだよ。"},{"t":"修養","r":"しゅうよう","d":"学問や徳を積んで人格を磨くこと。日々の修養が立派な人を育てるよ。"},{"t":"講義","r":"こうぎ","d":"先生が学問について説明すること。大学や学問所で行われる授業だよ。"},{"t":"典籍","r":"てんせき","d":"大切な書物や文献のこと。古い典籍には先人の知恵が記されているよ。"},{"t":"古典","r":"こてん","d":"昔から伝わる価値のある作品。源氏物語は日本の代表的な古典文学だよ。"},{"t":"碑","r":"ひ","d":"石に文字を刻んだ記念物。一乗寺にも歴史を伝える石碑があるよ。"},{"t":"記録","r":"きろく","d":"出来事を文字や映像で残すこと。歴史は人々の記録によって伝わるよ。"},{"t":"年表","r":"ねんぴょう","d":"出来事を年代順に並べた表。歴史の流れを一目で理解できるよ。"},{"t":"暦","r":"こよみ","d":"月日や季節を記した表。日本には旧暦と新暦の二つの暦があるよ。"},{"t":"文化財","r":"ぶんかざい","d":"歴史的に大切な建物や美術品。国や自治体が保護して未来に伝えるよ。"},{"t":"重要文化財","r":"じゅうようぶんかざい","d":"国が特に大切だと認めた文化財。建物や美術品が指定されるよ。"},{"t":"考古学","r":"こうこがく","d":"遺跡や出土品を調べて昔の暮らしを研究する学問。過去の人々を知る手がかりだよ。"},{"t":"歴史","r":"れきし","d":"過去に起きた出来事の積み重ね。一乗寺には長い歴史が刻まれているよ。"},{"t":"伝承","r":"でんしょう","d":"昔からの話や技を次の世代に伝えること。口伝えで受け継がれるよ。"},{"t":"民俗","r":"みんぞく","d":"地域の人々の暮らしの習慣や文化。祭りや年中行事は民俗文化の一つだよ。"},{"t":"地名","r":"ちめい","d":"土地につけられた名前のこと。一乗寺という地名は昔のお寺に由来するよ。"},{"t":"学識","r":"がくしき","d":"学問によって得た深い知識。林羅山は豊かな学識で家康に仕えたよ。"},{"t":"博識","r":"はくしき","d":"幅広い分野の知識を持っていること。石川丈山は博識な文人だったよ。"},{"t":"書院","r":"しょいん","d":"読書や学問をするための建物。書院造は日本建築の重要な様式だよ。"},{"t":"蔵","r":"くら","d":"大切なものを保管するための建物。古い蔵には貴重な品物が眠っていることがあるよ。"},{"t":"文献","r":"ぶんけん","d":"研究や調査の参考になる本や記録。歴史を学ぶには文献を読むことが大切だよ。"},{"t":"墨蹟","r":"ぼくせき","d":"筆と墨で書かれた書の作品。高僧の墨蹟はとても価値があるよ。"},{"t":"篆刻","r":"てんこく","d":"石に文字を彫ってハンコを作る芸術。書道や絵画と合わせて楽しむよ。"},{"t":"紙漉","r":"かみすき","d":"和紙を手作りする伝統の技。水に溶いた繊維を簾ですくって紙を作るよ。"},{"t":"製本","r":"せいほん","d":"紙を綴じて本の形にすること。和綴じは日本の伝統的な製本方法だよ。"},{"t":"原典","r":"げんてん","d":"翻訳や引用のもとになった元の本。原典にあたることで正確な理解ができるよ。"},{"t":"叡智","r":"えいち","d":"深くすぐれた知恵のこと。先人の叡智は今を生きる私たちの道しるべだよ。"},{"t":"丼物","r":"どんぶりもの","d":"丼に盛ったご飯の上におかずをのせた料理。カツ丼や親子丼などがあるよ。"},{"t":"鍋","r":"なべ","d":"食材を煮るための調理器具。冬の鍋料理は体が温まるよ。"},{"t":"蕎麦","r":"そば","d":"蕎麦の実を粉にして作る細い麺。京都にはにしんそばという名物があるよ。"},{"t":"饂飩","r":"うどん","d":"小麦粉で作る太くてやわらかい麺。きつねうどんは京都の定番だよ。"},{"t":"握飯","r":"おにぎり","d":"ご飯を手で三角や丸に握った食べ物。海苔で巻いて食べることが多いよ。"},{"t":"粥","r":"かゆ","d":"お米をたくさんの水で柔らかく煮た食べ物。体調が悪い時にも食べやすいよ。"},{"t":"煎餅","r":"せんべい","d":"米や小麦を焼いて作るお菓子。パリパリした食感が楽しいよ。"},{"t":"饅頭","r":"まんじゅう","d":"あんこを皮で包んで蒸したお菓子。お茶と一緒に食べるとおいしいよ。"},{"t":"最中","r":"もなか","d":"薄い皮であんこを挟んだ和菓子。パリッとした皮ともちっとしたあんこの組み合わせだよ。"},{"t":"団子","r":"だんご","d":"もち粉や米粉を丸めて作るお菓子。串に刺してたれをつけて食べるよ。"},{"t":"餅","r":"もち","d":"もち米を蒸してついた食べ物。お正月にはお雑煮に入れて食べるよ。"},{"t":"大福","r":"だいふく","d":"柔らかいお餅であんこを包んだ和菓子。ふわふわの食感がたまらないよ。"},{"t":"葛切","r":"くずきり","d":"葛粉で作る透明な麺状のお菓子。冷たい水と黒蜜で食べると涼しげだよ。"},{"t":"八橋","r":"やつはし","d":"京都を代表するお菓子。ニッキの香りがする焼き菓子や生八橋が有名だよ。"},{"t":"味付","r":"あじつけ","d":"食べ物に味をつけること。ラーメンの味付けは店ごとに個性があるよ。"},{"t":"焦味","r":"こげあじ","d":"少し焦がしたことで出る香ばしい味。焦がしネギ油はラーメンに深みを出すよ。"},{"t":"余韻","r":"よいん","d":"味や感動が後に残ること。おいしいラーメンは食べた後も余韻が続くよ。"},{"t":"素材","r":"そざい","d":"料理の元になる食べ物のこと。素材の味を活かすのが京料理の基本だよ。"},{"t":"盛況","r":"せいきょう","d":"人が多く集まって賑わうこと。人気ラーメン店はいつも盛況だよ。"},{"t":"一杯","r":"いっぱい","d":"丼に入った一つ分のラーメン。一杯のラーメンに職人の技が詰まっているよ。"},{"t":"茶漬","r":"ちゃづけ","d":"ご飯にお茶やだしをかけた食べ物。京都のぶぶ漬けは茶漬けの一種だよ。"},{"t":"味見","r":"あじみ","d":"料理の味を確かめること。調理中に味見をして味を調整するよ。"},{"t":"刺身","r":"さしみ","d":"新鮮な魚を薄く切って生で食べる料理。醤油とわさびをつけて食べるよ。"},{"t":"焼鳥","r":"やきとり","d":"鶏肉を串に刺して炭火で焼いた料理。塩やたれで味付けするよ。"},{"t":"串揚","r":"くしあげ","d":"食材を串に刺して衣をつけて油で揚げた料理。いろいろな具が楽しめるよ。"},{"t":"酒","r":"さけ","d":"米から作る日本の伝統的なお酒。京都の伏見は酒造りの名所だよ。"},{"t":"地酒","r":"じざけ","d":"その土地で作られたお酒のこと。京都には有名な地酒がたくさんあるよ。"},{"t":"甘酒","r":"あまざけ","d":"米と麹で作る甘い飲み物。冬に神社で振る舞われることがあるよ。"},{"t":"番茶","r":"ばんちゃ","d":"普段飲みのお茶のこと。京都ではほうじ茶のことを番茶と呼ぶこともあるよ。"},{"t":"焙茶","r":"ほうじちゃ","d":"緑茶を炒って作る香ばしいお茶。食後にぴったりのさっぱりした味だよ。"},{"t":"玄米茶","r":"げんまいちゃ","d":"炒った玄米と緑茶を混ぜたお茶。香ばしい香りが特徴的だよ。"},{"t":"境内","r":"けいだい","d":"神社やお寺の敷地の中のこと。境内を歩くと心が落ち着くよ。"},{"t":"庫裏","r":"くり","d":"お寺の台所がある建物。お坊さんの生活の場としても使われるよ。"},{"t":"方丈","r":"ほうじょう","d":"お寺の住職が住む建物。方丈庭園は禅寺によく見られるよ。"},{"t":"鷹峯","r":"たかがみね","d":"京都の北にある地域。芸術家たちが集まった歴史のある場所だよ。"},{"t":"念仏","r":"ねんぶつ","d":"仏様の名前を唱えること。南無阿弥陀仏と唱えるのが有名だよ。"},{"t":"托鉢","r":"たくはつ","d":"お坊さんが鉢を持って食べ物をもらう修行。早朝に行われることが多いよ。"},{"t":"精進","r":"しょうじん","d":"一生懸命に努力すること。仏教では肉を食べない精進潔斎の意味もあるよ。"},{"t":"三門","r":"さんもん","d":"お寺の正面にある大きな門。空・無相・無願の三解脱を意味するよ。"},{"t":"講堂","r":"こうどう","d":"お坊さんが仏法を説く建物。お寺の中で教えを学ぶ場所だよ。"},{"t":"五重塔","r":"ごじゅうのとう","d":"五つの屋根が重なった仏教の塔。お釈迦様の遺骨を納めるために建てられたよ。"},{"t":"仁王","r":"におう","d":"お寺の門に立つ二体の守護神。力強い姿で悪いものを追い払うよ。"},{"t":"天井画","r":"てんじょうが","d":"建物の天井に描かれた絵。お寺の天井に龍などの絵が描かれていることがあるよ。"},{"t":"厄除","r":"やくよけ","d":"悪い運気を払いのけること。八大神社は厄除けのご利益があるよ。"},{"t":"祈願","r":"きがん","d":"神様や仏様に願い事をすること。合格祈願や安産祈願などいろいろあるよ。"},{"t":"永代供養","r":"えいたいくよう","d":"お寺がずっとご先祖様を供養してくれること。安心してお任せできる制度だよ。"},{"t":"朝顔","r":"あさがお","d":"夏の朝に咲くラッパ型の花。赤や青や紫などいろいろな色があるよ。"},{"t":"金木犀","r":"きんもくせい","d":"秋に甘い香りの小さなオレンジ色の花を咲かせる木。よい香りで秋を感じるよ。"},{"t":"南天","r":"なんてん","d":"冬に赤い実をつける低い木。難を転じる縁起のよい植物だよ。"},{"t":"侘助","r":"わびすけ","d":"冬に咲く小さな椿の仲間。茶花として茶室に飾られることが多いよ。"},{"t":"苔玉","r":"こけだま","d":"土を丸めて苔で覆った小さな鉢植え。可愛らしいインテリアとして人気だよ。"},{"t":"水鏡","r":"みずかがみ","d":"水面が鏡のように景色を映すこと。池に紅葉が映る姿はとても美しいよ。"},{"t":"川床","r":"かわどこ","d":"川の上に作った涼を楽しむための座敷。京都の夏の風物詩だよ。"},{"t":"落水","r":"らくすい","d":"水が高い所から落ちること。庭園の滝や手水鉢の水の流れを表すよ。"},{"t":"遣水","r":"やりみず","d":"庭園の中を流れる人工の小川。自然の流れを再現して涼しさを演出するよ。"},{"t":"州浜","r":"すはま","d":"庭園で砂や小石で海辺を表現したもの。水辺の風景を小さく再現するよ。"},{"t":"花筏","r":"はないかだ","d":"水面に浮かんだ桜の花びらが流れていく様子。春の終わりの美しい風景だよ。"},{"t":"錦","r":"にしき","d":"色とりどりに美しいこと。秋の山は錦のように紅葉が美しいよ。"},{"t":"霞","r":"かすみ","d":"春の朝にぼんやりかかる薄い霧。遠くの山がかすんで見える春の風物詩だよ。"},{"t":"稲妻","r":"いなずま","d":"雷の時に空に走る光のこと。一瞬だけ空が明るく光るよ。"},{"t":"木枯","r":"こがらし","d":"晩秋から冬にかけて吹く冷たい北風。葉を散らす季節の変わり目の風だよ。"},{"t":"東風","r":"こち","d":"春に東から吹く暖かい風。梅の花の香りを運んでくるとされるよ。"},{"t":"夕立","r":"ゆうだち","d":"夏の午後に突然降る激しい雨。すぐにやんで虹が出ることもあるよ。"},{"t":"初雪","r":"はつゆき","d":"その冬に初めて降る雪のこと。初雪が降ると冬の始まりを感じるよ。"},{"t":"吹雪","r":"ふぶき","d":"激しい風とともに雪が降ること。視界が真っ白になるほどの猛吹雪もあるよ。"},{"t":"残雪","r":"ざんせつ","d":"春になってもまだ残っている雪。比叡山の頂には春まで残雪が見えるよ。"},{"t":"甲冑","r":"かっちゅう","d":"鎧と兜を合わせた武具のこと。武士が戦で身を守るために身につけたよ。"},{"t":"薙刀","r":"なぎなた","d":"長い柄の先に曲がった刃がついた武器。女性の武道としても知られるよ。"},{"t":"手裏剣","r":"しゅりけん"," 走る小さな電車だよ。"},{"t":"爽快","r":"そうかい","d":"さわやかで気持ちがよいこと。山からの風を受けると爽快な気分になるよ。"},{"t":"精悍","r":"せいかん","d":"引き締まって力強い印象のこと。武蔵は精悍な顔つきの剣豪だったよ。"},{"t":"朦朧","r":"もうろう","d":"ぼんやりしてはっきり見えないこと。霧に包まれた風景は朦朧としているよ。"},{"t":"整然","r":"せいぜん","d":"きちんと整っている様子。枯山水の庭は砂紋が整然と描かれているよ。"},{"t":"雄大","r":"ゆうだい","d":"大きくて堂々としていること。比叡山の雄大な姿は一乗寺から一望できるよ。"},{"t":"精密","r":"せいみつ","d":"とても細かくて正確なこと。京都の伝統工芸品は精密な技で作られるよ。"},{"t":"清々","r":"すがすがしい","d":"さわやかで気持ちがいいこと。朝のお寺の空気は清々しいよ。"},{"t":"円満","r":"えんまん","d":"丸く穏やかで問題がないこと。仏様の顔は円満な表情をしているよ。"},{"t":"厳格","r":"げんかく","d":"厳しくきちんとしていること。禅寺の修行は厳格な規律のもとで行われるよ。"},{"t":"寡黙","r":"かもく","d":"口数が少なくて静かなこと。黙々とラーメンを作る職人は寡黙で格好いいよ。"},{"t":"堪能","r":"たんのう","d":"十分に楽しむこと。一乗寺の魅力を堪能するには一日では足りないよ。"},{"t":"華道","r":"かどう","d":"花を美しく生ける日本の芸術。季節の花を選んで器に生けるよ。"},{"t":"花器","r":"かき","d":"花を生けるための器のこと。焼き物や竹で作られた花器があるよ。"},{"t":"剣山","r":"けんざん","d":"花を生ける時に茎を固定する針のついた道具。花器の中に置いて使うよ。"},{"t":"水盤","r":"すいばん","d":"花を生けるための浅くて広い器。剣山を置いて花を立てるよ。"},{"t":"香道","r":"こうどう","d":"香りを楽しむ日本の伝統文化。お香を焚いて香りを聞き分けるよ。"},{"t":"沈香","r":"じんこう","d":"とてもよい香りがする貴重な木。香道で大切にされている最高級のお香だよ。"},{"t":"白檀","r":"びゃくだん","d":"甘くて上品な香りの木。お香や仏像の材料として使われるよ。"},{"t":"螺鈿","r":"らでん","d":"貝殻を薄く切って模様を作る工芸技法。虹色に光るきれいな装飾だよ。"},{"t":"象嵌","r":"ぞうがん","d":"金属や木に別の材料をはめ込む技法。繊細な模様を作り出す職人技だよ。"},{"t":"金継","r":"きんつぎ","d":"割れた器を漆と金で修復する技法。傷を美しく生まれ変わらせる日本の美意識だよ。"},{"t":"匠","r":"たくみ","d":"技術にとても優れた職人のこと。京都には伝統の技を受け継ぐ匠がたくさんいるよ。"},{"t":"数寄屋","r":"すきや","d":"茶室の影響を受けた自由な建築様式。洗練された美しさが特徴だよ。"},{"t":"暖炉","r":"いろり","d":"家の中の床に設けた火をたく場所。昔の日本の家では暖房や料理に使ったよ。"},{"t":"行灯","r":"あんどん","d":"紙と木で作った室内用の照明器具。やわらかい灯りが部屋を照らすよ。"},{"t":"輪島塗","r":"わじまぬり","d":"石川県輪島で作られる高級漆器。丈夫で美しく何世代も使えるよ。"},{"t":"聖賢","r":"せいけん","d":"とても優れた知恵と徳のある人。儒学では聖人と賢人を合わせてこう呼ぶよ。"},{"t":"素読","r":"そどく","d":"意味を考えずに声に出して読む勉強法。江戸時代の子供は論語を素読したよ。"},{"t":"寺子屋","r":"てらこや","d":"江戸時代に読み書きそろばんを教えた学校。お寺が教室になったことが多いよ。"},{"t":"和算","r":"わさん","d":"日本独自に発展した数学のこと。江戸時代には世界水準の研究がされたよ。"},{"t":"天文","r":"てんもん","d":"星や月など天体を観察する学問。暦を作るのに天文の知識が必要だったよ。"},{"t":"本草学","r":"ほんぞうがく","d":"薬になる植物や鉱物を研究する学問。今の植物学や薬学のもとになったよ。"},{"t":"陰陽 祖様を偲ぶ大切な行事だよ。"},{"t":"戒律","r":"かいりつ","d":"仏教で守るべき決まりごと。お坊さんは戒律を守って暮らすよ。"},{"t":"禅問答","r":"ぜんもんどう","d":"師匠と弟子が交わす禅の深い問いかけ。考えを深めるための修行だよ。"},{"t":"如来","r":"にょらい","d":"悟りを開いた最高の仏様。釈迦如来や阿弥陀如来などがいるよ。"},{"t":"菩薩","r":"ぼさつ","d":"悟りを求めて修行している仏様。人々を救うために働いてくれるよ。"},{"t":"曼荼羅","r":"まんだら","d":"仏教の世界を絵で表した図。宇宙の真理を色と形で表現するよ。"},{"t":"瓦当","r":"がとう","d":"屋根の瓦の先端にある丸い装飾。お寺の紋や蓮の模様が刻まれているよ。"},{"t":"鬼瓦","r":"おにがわら","d":"屋根の端に取り付ける鬼の顔の飾り瓦。悪いものを追い払うまじないだよ。"},{"t":"万両","r":"まんりょう","d":"冬に赤い実をつける縁起のよい植物。お正月の飾りに使われるよ。"},{"t":"水仙","r":"すいせん","d":"冬から早春に白や黄色の花を咲かせる植物。清楚な香りが魅力だよ。"},{"t":"石楠花","r":"しゃくなげ","d":"春に大きなピンクや白の花を咲かせる木。山寺の境内でよく見かけるよ。"},{"t":"百日紅","r":"さるすべり","d":"夏から秋にかけてピンクの花が長く咲く木。幹がつるつるしているよ。"},{"t":"桔梗","r":"ききょう","d":"秋に青紫色の星形の花を咲かせる植物。秋の七草の一つだよ。"},{"t":"撫子","r":"なでしこ","d":"ピンクの可愛い花を咲かせる秋の七草の一つ。大和撫子の語源になったよ。"},{"t":"沢蟹","r":"さわがに","d":"きれいな山の沢に住む小さな蟹。清流の近くで見つけられるよ。"},{"t":"翡翠","r":"かわせみ","d":"美しい青い羽を持つ小さな鳥。水辺で魚を取る姿が美しいよ。"},{"t":"山吹","r":"やまぶき","d":"春に鮮やかな黄色い花が咲く低木。雨に濡れた山吹の花は特に美しいよ。"},{"t":"柿","r":"かき","d":"秋にオレンジ色の実がなる果物。お寺の庭に柿の木がある風景は日本らしいよ。"},{"t":"栗","r":"くり","d":"秋にイガに包まれた茶色い実がなる木。栗ご飯や栗きんとんにして食べるよ。"},{"t":"楠","r":"くすのき","d":"大きく育つ常緑樹。神社の境内に巨大な楠が立っていることがあるよ。"},{"t":"足利義政","r":"あしかがよしまさ","d":"室町幕府の八代将軍。銀閣寺を建てた東山文化の中心人物だよ。"},{"t":"応仁之乱","r":"おうにんのらん","d":"京都を焼き野原にした室町時代の大きな戦い。京都の歴史を大きく変えたよ。"},{"t":"最澄","r":"さいちょう","d":"天台宗を開いた奈良時代の僧。比叡山に延暦寺を建てたよ。"},{"t":"道元","r":"どうげん","d":"曹洞宗を開いた鎌倉時代の僧。ただひたすら座禅をすることを教えたよ。"},{"t":"太閤","r":"たいこう","d":"豊臣秀吉の別称。天下統一を成し遂げた戦国時代の英雄だよ。"},{"t":"関白","r":"かんぱく","d":"天皇を助けて政治を行う最高の地位。藤原氏や豊臣秀吉が就いたよ。"},{"t":"大名","r":"だいみょう","d":"領地を治めた有力な武士。江戸時代には各地の藩を治めていたよ。"},{"t":"家臣","r":"かしん","d":"主君に仕える武士のこと。家臣は主君への忠義を第一に考えたよ。"},{"t":"軍配","r":"ぐんばい","d":"武将が戦場で指揮をとるための団扇型の道具。相撲の行司も持っているよ。"},{"t":"火縄銃","r":"ひなわじゅう","d":"火縄で火薬に点火して弾を発射する銃。戦国時代の合戦を変えた武器だよ。"},{"t":"源氏物語","r":"げんじものがたり","d":"紫式部が書いた世界最古の長編小説。平安時代の宮廷生活を描いたよ。"},{"t":"枕草子","r":"まくらのそうし","d":"清少納言が書いた平安時代の随筆。春はあけぼので始まる名文だよ。"},{"t":"徒然草","r":"つれづれぐさ","d":"吉田兼好が書いた鎌倉時代の随筆。人生や世の中について語る名作だよ。"},{"t":"方丈記","r":"ほうじょうき","d":"鴨長明が書いた鎌倉時代の随筆。ゆく河の流れは絶えずしてで始まるよ。"},{"t":"奥細道","r":"おくのほそみち","d":"松尾芭蕉が東北を旅して書いた紀行文。俳句と散文が交じる名作だよ。"},{"t":"万葉集","r":"まんようしゅう","d":"日本最古の和歌集。天皇から庶民まで幅広い人の歌が収められているよ。"},{"t":"百人一首","r":"ひゃくにんいっしゅ","d":"百人の歌人から一首ずつ選んだ和歌集。かるた遊びとしても親しまれるよ。"},{"t":"御伽草子","r":"おとぎぞうし","d":"室町時代に書かれた短い物語の総称。浦島太郎や一寸法師が有名だよ。"},{"t":"浮世絵","r":"うきよえ","d":"江戸時代に流行した色鮮やかな版画。葛飾北斎や歌川広重が有名だよ。"},{"t":"文机","r":"ふづくえ","d":"座って書き物をするための低い机。文人が書を書いたり本を読んだりする場所だよ。"},{"t":"煙突","r":"えんとつ","d":"煙を外に出すための筒。銭湯の煙突は街のシンボルだったよ。"},{"t":"郵便局","r":"ゆうびんきょく","d":"手紙や荷物を届ける仕事をする施設。赤いポストが目印だよ。"},{"t":"交番","r":"こうばん","d":"警察官がいる小さな建物。道に迷った時に教えてもらえるよ。"},{"t":"公園","r":"こうえん","d":"みんなが遊んだり休んだりできる広場。子供たちの遊び場でもあるよ。"},{"t":"街灯","r":"がいとう","d":"道路を照らすための灯り。夜の一乗寺を優しく照らしてくれるよ。"},{"t":"用水","r":"ようすい","d":"田畑に水を引くための水路。一乗寺の近くにも昔からの用水路があるよ。"},{"t":"田畑","r":"たはた","d":"お米や野菜を作る農地のこと。京都の郊外にはまだ田畑が残っているよ。"},{"t":"稲","r":"いね","d":"お米の実がなる植物。秋に黄金色に実った稲を刈り取るよ。"},{"t":"納涼","r":"のうりょう","d":"夏の暑さをしのいで涼しさを楽しむこと。川床や花火は納涼の楽しみだよ。"},{"t":"花火","r":"はなび","d":"火薬を燃やして夜空に美しい光を作ること。夏の夜の風物詩だよ。"},{"t":"渋","r":"しぶい","d":"地味だけど深い味わいがあること。渋い色の焼き物は日本人に好まれるよ。"},{"t":"儚","r":"はかない","d":"すぐに消えてしまいそうなこと。桜の花は儚くて美しいよ。"},{"t":"逞","r":"たくましい","d":"体や心が強くて力強いこと。武蔵は逞しい体つきだったと伝わるよ。"},{"t":"切実","r":"せつじつ","d":"とても身近で大切に感じること。食の文化は人々の切実な暮らしから生まれるよ。"},{"t":"気品","r":"きひん","d":"上品で品格がある様子。京都のお寺の庭園は気品にあふれているよ。"},{"t":"清廉","r":"せいれん","d":"心が清くて正しいこと。石川丈山は清廉な暮らしを送った文人だよ。"},{"t":"淑","r":"しとやか","d":"物静かで品がよい様子。京都の町並みにはしとやかな美しさがあるよ。"},{"t":"頑丈","r":"がんじょう","d":"壊れにくくて丈夫なこと。お寺の柱は太くて頑丈に作られているよ。"},{"t":"簡素","r":"かんそ","d":"飾りが少なくすっきりしていること。茶室は簡素ながらも美しい空間だよ。"},{"t":"豪華","r":"ごうか","d":"はなやかで立派なこと。金箔を使った装飾は豪華で目を引くよ。"},{"t":"素敵","r":"すてき","d":"とてもよくて心を引かれること。一乗寺には素敵なお店がたくさんあるよ。"},{"t":"爽","r":"さわやか","d":"すっきりしていて気持ちがいいこと。秋の朝の風はさわやかだよ。"},{"t":"穏健","r":"おんけん","d":"おだやかで行き過ぎがないこと。穏健な考え方は争いを防ぐよ。"},{"t":"荘重","r":"そうちょう","d":"おごそかで重々しいこと。お寺の読経の声は荘重な響きがあるよ。"},{"t":"雅趣","r":"がしゅ","d":"風流で趣のある味わい。京都の庭園は雅趣に富んだ空間だよ。"},{"t":"棟","r":"むね","d":"建物の屋根の一番高い部分。お寺の棟には飾り瓦がのっているよ。"},{"t":"柱","r":"はしら","d":"建物を支える縦の構造物。古いお寺の柱は太くて歴史を感じさせるよ。"},{"t":"梁","r":"はり","d":"建物の柱の上にかけわたす横の材木。建物の重さを支える大切な部分だよ。"},{"t":"礎石","r":"そせき","d":"柱の下に置く土台の石。何百年も建物を支え続ける縁の下の力持ちだよ。"},{"t":"土壁","r":"つちかべ","d":"土を塗って作った日本の伝統的な壁。調湿効果があって住み心地がよいよ。"},{"t":"茅葺","r":"かやぶき","d":"かやで葺いた伝統的な屋根。日本の山村や古い茶室に見られるよ。"},{"t":"欄間","r":"らんま","d":"天井と鴨居の間にある透かし彫りの装飾。光や風を通す美しい建具だよ。"},{"t":"敷居","r":"しきい","d":"襖や障子の下にある横木。部屋と部屋を分ける境目の役目があるよ。"},{"t":"釘隠","r":"くぎかくし","d":"柱の釘を隠すための金属製の飾り。花や鳥の形をしたものが多いよ。"},{"t":"懸魚","r":"げぎょ","d":"屋根の棟の端につける板状の飾り。火除けの意味が込められているよ。"},{"t":"鶏鳴","r":"けいめい","d":"にわとりが鳴くこと。夜明けを告げる鶏の声は朝の始まりの合図だよ。"},{"t":"暁","r":"あかつき","d":"夜がほんのり明けてくる頃。暁の光に照らされた山は美しいよ。"},{"t":"黄昏","r":"たそがれ","d":"夕方の薄暗くなる頃。黄昏時のお寺は神秘的な雰囲気に包まれるよ。"},{"t":"宵","r":"よい","d":"日が暮れてまだ間もない頃。宵の口にラーメンを食べに出かけるのもいいね。"},{"t":"夜半","r":"やはん","d":"夜中のこと。夜半すぎの一乗寺はひっそりと静まり返っているよ。"},{"t":"師走","r":"しわす","d":"12月のこと。年末の忙しい時期で師匠も走り回るという意味だよ。"},{"t":"如月","r":"きさらぎ","d":"2月のこと。まだ寒くて衣を更に重ねることから名づけられたよ。"},{"t":"弥生","r":"やよい","d":"3月のこと。草木がいよいよ芽吹く春の季節を表しているよ。"},{"t":"卯月","r":"うづき","d":"4月のこと。卯の花が咲く季節という意味の古い呼び方だよ。"},{"t":"五月雨","r":"さみだれ","d":"梅雨の時期に降り続く雨のこと。五月雨を集めた川は水量が増すよ。"},{"t":"文月","r":"ふみづき","d":"7月のこと。七夕に詩歌や文を書くことから名づけられたよ。"},{"t":"葉月","r":"はづき","d":"8月のこと。木の葉が落ち始める季節という意味があるよ。"},{"t":"長月","r":"ながつき","d":"9月のこと。夜が長くなっていく季節だからこう呼ばれるよ。"},{"t":"神無月","r":"かんなづき","d":"10月のこと。全国の神様が出雲に集まって留守になるという伝説があるよ。"},{"t":"霜月","r":"しもつき","d":"11月のこと。霜が降り始める季節を表しているよ。"},{"t":"睦月","r":"むつき","d":"1月のこと。家族で睦まじく過ごす新年の月という意味だよ。"},{"t":"水無月","r":"みなづき","d":"6月のこと。京都では三角形の和菓子「水無月」を食べる習慣があるよ。"},{"t":"情緒","r":"じょうちょ","d":"しみじみとした味わいのある雰囲気。一乗寺の路地には情緒があるよ。"},{"t":"風致","r":"ふうち","d":"自然の風景が持つおもむきのこと。一乗寺は風致地区に指定されている場所もあるよ。"},{"t":"佇","r":"たたずまい","d":"建物や人がそこにある様子や雰囲気。詩仙堂の静かな佇まいは心に残るよ。"},{"t":"面影","r":"おもかげ","d":"昔の姿を思い起こさせるもの。古い町並みには昔の面影が残っているよ。"},{"t":"名残","r":"なごり","d":"過ぎ去ったものが残した跡。秋の名残の紅葉は冬の訪れを感じさせるよ。"},{"t":"奥行","r":"おくゆき","d":"入口から奥までの深さのこと。京都の町家は奥行きがとても深いよ。"},{"t":"間","r":"ま","d":"空間や時間の余白のこと。日本の美意識では間の取り方がとても大切だよ。"},{"t":"心得","r":"こころえ","d":"大切にすべき考えや態度のこと。茶道には客と亭主それぞれの心得があるよ。"},{"t":"自然体","r":"しぜんたい","d":"無理をしないありのままの姿勢。一乗寺の暮らしには自然体の心地よさがあるよ。"},{"t":"木目","r":"もくめ","d":"木材の表面に現れる年輪の模様。美しい木目は日本建築の見どころだよ。"},{"t":"黄金比","r":"おうごんひ","d":"もっとも美しいとされるバランスの比率。日本庭園にもこの美の法則が隠れているよ。"},{"t":"照葉","r":"てりは","d":"つやつやと光る葉っぱのこと。雨上がりの照葉は太陽を反射して美しいよ。"},{"t":"薄氷","r":"うすらい","d":"水面にうっすら張った薄い氷。冬の朝に池の水面に見られる儚い美だよ。"},{"t":"木霊","r":"こだま","d":"山で声がはね返ってくるやまびこのこと。山に向かって叫ぶと木霊が返ってくるよ。"},{"t":"東雲","r":"しののめ","d":"夜明け前に東の空がほんのり明るくなる頃。一日の始まりを告げる美しい時間だよ。"},{"t":"微塵","r":"みじん","d":"とても小さな粒のこと。微塵切りは食材をとても細かく切る調理法だよ。"},{"t":"一期一会","r":"いちごいちえ","d":"一生に一度きりの出会いを大切にする茶道の心。人との出会いは宝物だよ。"},{"t":"花鳥風月","r":"かちょうふうげつ","d":"自然の美しい景色を楽しむこと。花と鳥と風と月は日本の美の象徴だよ。"}];

/* ── Config ── */
var SHOW_COUNT=35;
var CENTER=[35.0425,135.7870];
var SPREAD_LAT=0.0035;
var SPREAD_LNG=0.0040;
var SIZES=[14,15,16,17,18,19,20,22,24,26];

/* ── Helpers ── */
function rb(t,r){return '<ruby>'+t+'<rp>(</rp><rt>'+r+'</rt><rp>)</rp></ruby>'}
function rand(a,b){return a+Math.random()*(b-a)}
function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;
  }
  return arr;
}
function pick(arr,n){return shuffle(arr.slice()).slice(0,n)}

/* ── Map ── */
var map=L.map('map',{
  center:CENTER,
  zoom:17,
  zoomControl:false,
  attributionControl:true,
  zoomSnap:0.5,
  maxZoom:19,
  minZoom:16,
  maxBounds:[[CENTER[0]-0.008,CENTER[1]-0.010],[CENTER[0]+0.008,CENTER[1]+0.010]]
});

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',{
  attribution:'&copy; Esri &copy; OSM',maxZoom:19
}).addTo(map);

/* subtle boundary */
L.polygon([
  [35.0455,135.7835],[35.0458,135.7870],[35.0455,135.7908],
  [35.0435,135.7915],[35.0400,135.7910],
  [35.0392,135.7880],[35.0395,135.7840],
  [35.0420,135.7830],[35.0445,135.7832]
],{
  color:'rgba(160,140,110,0.12)',weight:1.5,
  fill:true,fillColor:'rgba(160,140,110,0.02)',fillOpacity:1,
  interactive:false
}).addTo(map);

/* ── State ── */
var barEl=document.getElementById('bar');
var bwEl=document.getElementById('bw');
var bdEl=document.getElementById('bd');
var curOn=null;
var markers=[];

/* ── Generate random positions ── */
function genPositions(n){
  var pts=[];
  for(var i=0;i<n;i++){
    var angle=Math.random()*Math.PI*2;
    var radius=Math.sqrt(Math.random());
    pts.push([
      CENTER[0]+Math.cos(angle)*radius*SPREAD_LAT,
      CENTER[1]+Math.sin(angle)*radius*SPREAD_LNG
    ]);
  }
  return pts;
}

/* ── Place words on map ── */
function placeWords(){
  /* dismiss any active state */
  if(curOn){
    curOn.classList.remove('on');
    curOn=null;
    document.body.classList.remove('focus');
    barEl.classList.remove('show');
  }
  /* remove old markers */
  markers.forEach(function(m){map.removeLayer(m)});
  markers=[];

  var chosen=pick(WORDS,SHOW_COUNT);
  var positions=genPositions(SHOW_COUNT);

  chosen.forEach(function(w,i){
    var s=SIZES[Math.floor(Math.random()*SIZES.length)];
    var cw=s*1.15;
    var tw=w.t.length*cw+(w.t.length-1)*4;
    var icon=L.divIcon({
      html:'<div class="w" style="font-size:'+s+'px">'+rb(w.t,w.r)+'</div>',
      className:'',
      iconSize:[tw+24,s+20],
      iconAnchor:[(tw+24)/2,(s+20)/2]
    });
    var m=L.marker(positions[i],{icon:icon,interactive:true,keyboard:false}).addTo(map);

    /* stagger fade-in */
    setTimeout(function(){
      var el=getW(m);
      if(el)el.classList.add('visible');
    },100+i*60);

    m.on('mouseover',function(){show(m,w)});
    m.on('mouseout',function(){hide(m)});
    m.on('click',function(e){
      L.DomEvent.stopPropagation(e);
      if(curOn===getW(m)){hide(m)} else {show(m,w)}
    });

    markers.push(m);
  });
}

function getW(m){return m.getElement()?m.getElement().querySelector('.w'):null}

function show(m,w){
  var el=getW(m);if(!el)return;
  if(curOn&&curOn!==el)curOn.classList.remove('on');
  curOn=el;
  el.classList.add('on');
  document.body.classList.add('focus');
  bwEl.innerHTML=rb(w.t,w.r);
  bdEl.textContent=w.d;
  barEl.classList.add('show');
}

function hide(m){
  var el=getW(m);if(!el)return;
  el.classList.remove('on');
  if(curOn===el){
    curOn=null;
    document.body.classList.remove('focus');
    barEl.classList.remove('show');
  }
}

map.on('click',function(){
  if(curOn){
    curOn.classList.remove('on');
    curOn=null;
    document.body.classList.remove('focus');
    barEl.classList.remove('show');
  }
});

/* ── Shuffle button ── */
document.getElementById('shuffle').addEventListener('click',function(e){
  e.stopPropagation();
  placeWords();
});

/* ── Initial placement ── */
placeWords();
</script>
