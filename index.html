<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>一乗寺</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Antique+Soft&family=Noto+Sans+JP:wght@300;400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#f0ece4}
body{font-family:'Noto Sans JP',sans-serif}

#map{position:fixed;top:0;right:0;bottom:0;left:0;z-index:1}

.leaflet-tile-pane{
  filter:grayscale(1) brightness(1.45) contrast(0.3);
  opacity:.6;
}

#tint{
  position:fixed;top:0;right:0;bottom:0;left:0;z-index:2;
  background:rgba(240,236,228,.18);
  pointer-events:none;
}

.leaflet-control-zoom{display:none!important}
.leaflet-control-attribution{
  font-size:8px!important;opacity:.25!important;
  background:transparent!important;color:#888!important;
}
.leaflet-control-attribution a{color:#888!important}

.w{
  font-family:'Zen Antique Soft',serif;
  color:#000;
  opacity:0;
  cursor:default;
  white-space:nowrap;
  letter-spacing:4px;
  transition:opacity .8s ease-in,transform .5s;
  transform:scale(1);
  text-shadow:
    0 0 20px rgba(240,236,228,.9),
    0 0 40px rgba(240,236,228,.6);
  user-select:none;
  -webkit-user-select:none;
}
.w.visible{opacity:.75}
.w rt{
  font-size:.45em;
  letter-spacing:1px;
  opacity:.7;
}
.w.on{
  opacity:1!important;
  transform:scale(1.12);
  text-shadow:
    0 0 20px rgba(240,236,228,.9),
    0 0 40px rgba(240,236,228,.6),
    0 1px 3px rgba(0,0,0,.08);
}
.w.on rt{opacity:1}
.w.local{color:#b22222}
.w.local.on{
  text-shadow:
    0 0 20px rgba(240,236,228,.9),
    0 0 40px rgba(240,236,228,.6),
    0 1px 3px rgba(178,34,34,.12);
}
body.focus .w:not(.on){
  opacity:.18!important;
}

#bar{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  padding:22px 32px 26px;
  background:linear-gradient(transparent 0%,rgba(26,26,20,.6) 25%,rgba(26,26,20,.82) 100%);
  color:#F0E4C4;
  transform:translateY(100%);
  opacity:0;
  transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .5s;
  display:flex;align-items:center;gap:24px;
  pointer-events:none;
}
#bar.show{transform:translateY(0);opacity:1}
#bar .bw{
  font-family:'Zen Antique Soft',serif;
  font-size:28px;letter-spacing:8px;flex-shrink:0;
}
#bar .bw rt{font-size:.45em;letter-spacing:1px}
#bar .bd{
  font-size:14px;line-height:1.8;font-weight:300;
  letter-spacing:.5px;color:rgba(240,228,196,.8);
}

#wm{
  position:fixed;top:18px;left:22px;z-index:100;
  pointer-events:none;transition:opacity .5s;
}
#wm .t1{
  font-family:'Zen Antique Soft',serif;
  font-size:16px;letter-spacing:10px;
  color:rgba(26,26,20,.2);
}
#wm .t1 rt{font-size:.5em;letter-spacing:2px}
#wm .t2{
  font-size:9px;letter-spacing:2px;margin-top:3px;
  color:rgba(26,26,20,.13);font-weight:300;
}
body.focus #wm{opacity:.3}

/* shuffle button */
#shuffle{
  position:fixed;bottom:18px;right:18px;z-index:101;
  width:40px;height:40px;border-radius:50%;
  background:rgba(26,26,20,.08);border:1px solid rgba(26,26,20,.1);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .3s,transform .3s;
  color:rgba(26,26,20,.3);font-size:18px;
}
#shuffle:hover{background:rgba(26,26,20,.15);transform:rotate(180deg)}

/* park zone */
.park-zone{
  border:1.5px dashed rgba(80,130,80,.25)!important;
  background:rgba(80,130,80,.06)!important;
}
#park-label{
  position:fixed;z-index:50;
  pointer-events:none;
  font-family:'Zen Antique Soft',serif;
  font-size:11px;letter-spacing:3px;
  color:rgba(80,130,80,.35);
  text-align:center;
  white-space:nowrap;
}

/* dragging state */
.w.dragging{
  opacity:1!important;
  transform:scale(1.15);
  cursor:grabbing;
  z-index:9999;
}
.leaflet-marker-icon{cursor:grab}
.leaflet-dragging .leaflet-marker-icon{cursor:grabbing}

/* absorb animation */
.w.absorbing{
  transition:transform .6s cubic-bezier(.6,.04,.98,.34),opacity .6s ease-in;
  transform:scale(0)!important;
  opacity:0!important;
}

/* sentence popup */
#sentence{
  position:fixed;top:50%;left:50%;z-index:200;
  transform:translate(-50%,-50%) scale(0.8);
  opacity:0;
  background:rgba(26,26,20,.88);
  color:#F0E4C4;
  padding:28px 36px;
  border-radius:12px;
  font-family:'Zen Antique Soft',serif;
  font-size:20px;
  letter-spacing:2px;
  line-height:1.8;
  text-align:center;
  max-width:85vw;
  pointer-events:none;
  transition:transform .5s cubic-bezier(.2,.8,.3,1),opacity .5s;
}
#sentence.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}
#sentence .sword{
  color:#e8c87a;
  font-size:1.15em;
}

@media(max-width:600px){
  .w{letter-spacing:2px}
  #bar{padding:16px 20px 22px;flex-direction:column;gap:8px}
  #bar .bw{font-size:22px;letter-spacing:5px}
  #bar .bd{font-size:12px;line-height:1.7}
  #wm{top:12px;left:14px}
  #wm .t1{font-size:14px;letter-spacing:6px}
  #wm .t2{font-size:8px}
  #shuffle{width:36px;height:36px;bottom:14px;right:14px;font-size:16px}
  #sentence{font-size:16px;padding:20px 24px;max-width:92vw}
}
</style>
</head>
<body>

<div id="map"></div>
<div id="tint"></div>

<div id="wm">
  <div class="t1"><ruby>一乗寺<rp>(</rp><rt>いちじょうじ</rt><rp>)</rp></ruby></div>
  <div class="t2">京都 — 文化と味が交差する街</div>
</div>

<div id="bar">
  <div class="bw" id="bw"></div>
  <div class="bd" id="bd"></div>
</div>

<button id="shuffle" title="ことばを入れ替える">&#x21bb;</button>
<div id="sentence"></div>

<script>
var LOCAL=[{"t":"ラーメン","r":"らーめん","d":"小麦粉の麺をスープで食べる料理で、一乗寺はラーメンの街として有名だよ。","s":"ラーメンはあたたかくておいしい。"},{"t":"麺","r":"めん","d":"小麦粉をこねてのばして作る細長い食べもののことだよ。","s":"麺はつるつるしていて食べやすい。"},{"t":"スープ","r":"すーぷ","d":"ラーメンの味を決める大事な汁のことだよ。","s":"スープはお店によって味が違う。"},{"t":"チャーシュー","r":"ちゃーしゅー","d":"豚肉をたれにつけてじっくり焼いたり煮たりしたお肉のことだよ。","s":"チャーシューはやわらかくてジューシーだ。"},{"t":"煮卵","r":"にたまご","d":"たまごをゆでてからたれにつけて味をしみこませたものだよ。","s":"煮卵は味がしっかりしみておいしい。"},{"t":"背脂","r":"せあぶら","d":"豚の背中の脂のことで、ラーメンに浮かべるとこってりするよ。","s":"背脂はスープにコクを出してくれる。"},{"t":"醤油","r":"しょうゆ","d":"大豆から作られる茶色い調味料で、ラーメンのスープにも使われるよ。","s":"醤油は黒っぽい色をした調味料だ。"},{"t":"味噌","r":"みそ","d":"大豆を発酵させて作る調味料で、味噌ラーメンの味のもとだよ。","s":"味噌は大豆から作られる調味料だ。"},{"t":"塩","r":"しお","d":"海水から作られる白い調味料で、塩ラーメンはあっさりした味だよ。","s":"塩はしょっぱい味がする調味料だ。"},{"t":"太麺","r":"ふとめん","d":"ふつうより太い麺のことで、もちもちした食感が楽しめるよ。","s":"太麺は普通の麺より食べごたえがある。"},{"t":"細麺","r":"ほそめん","d":"ふつうより細い麺のことで、スープがよくからむよ。","s":"細麺はするすると食べやすい麺だ。"},{"t":"こってり","r":"こってり","d":"脂が多くて濃い味のことで、一乗寺のラーメンに多いよ。","s":"こってりは味が濃くてクセになる。"},{"t":"あっさり","r":"あっさり","d":"脂が少なくてさっぱりした味のことだよ。","s":"あっさりは味が軽くてさっぱりする。"},{"t":"替え玉","r":"かえだま","d":"ラーメンの麺だけをおかわりすることだよ。","s":"替え玉は麺のおかわりのことだ。"},{"t":"丼","r":"どんぶり","d":"ラーメンや親子丼を入れる大きくて深いお茶碗のことだよ。","s":"丼はラーメンを入れる大きくて深い器だ。"},{"t":"箸","r":"はし","d":"ごはんや麺を食べるときに使う二本の棒のことだよ。","s":"箸は食べ物をはさんで食べる道具だ。"},{"t":"れんげ","r":"れんげ","d":"ラーメンのスープをすくうときに使う小さなスプーンだよ。","s":"れんげはスープをすくう道具だ。"},{"t":"のり","r":"のり","d":"海藻を薄くして乾かしたもので、ラーメンにのせることもあるよ。","s":"のりは黒くてぱりぱりしている。"},{"t":"ねぎ","r":"ねぎ","d":"細く切ってラーメンの上にのせる緑色の野菜だよ。","s":"ねぎはラーメンの上にのっている。"},{"t":"にんにく","r":"にんにく","d":"香りが強い野菜で、ラーメンに入れるとパンチが出るよ。","s":"にんにくは香りが強い野菜の仲間だ。"},{"t":"もやし","r":"もやし","d":"豆から出た白い芽で、ラーメンの具としてよく使われるよ。","s":"もやしは白くてシャキシャキしている。"},{"t":"メンマ","r":"めんま","d":"たけのこを発酵させて作ったラーメンの具だよ。","s":"メンマは竹から作られる食べ物だ。"},{"t":"餃子","r":"ぎょうざ","d":"肉と野菜をうすい皮で包んで焼いた料理で、ラーメンと一緒に食べることが多いよ。","s":"餃子はラーメンとよく合う料理だ。"},{"t":"唐揚げ","r":"からあげ","d":"鶏肉に味をつけて油で揚げたおかずのことだよ。","s":"唐揚げはカリッとしていておいしい。"},{"t":"炒飯","r":"ちゃーはん","d":"ごはんを卵や具と一緒に炒めた料理だよ。","s":"炒飯はパラパラしていておいしい。"},{"t":"ラーメン屋","r":"らーめんや","d":"ラーメンを出すお店のことで、一乗寺にはたくさんあるよ。","s":"ラーメン屋は町のあちこちにある。"},{"t":"行列","r":"ぎょうれつ","d":"人が順番にならんで待つことで、人気のラーメン屋にはよくできるよ。","s":"行列は人気のお店の前にできる列だ。"},{"t":"食べ歩き","r":"たべあるき","d":"いろいろなお店をまわりながら食べることだよ。","s":"食べ歩きは歩きながら食べることだ。"},{"t":"暖簾","r":"のれん","d":"お店の入り口にかかっている布のことで、お店の目印になるよ。","s":"暖簾はお店の入り口にかかっている。"},{"t":"湯気","r":"ゆげ","d":"熱いラーメンから立ちのぼる白いけむりのようなものだよ。","s":"湯気はスープからもくもくと立ちのぼる。"},{"t":"出汁","r":"だし","d":"昆布やかつお節からとったうまみたっぷりの汁のことだよ。","s":"出汁はスープのもとになる大切な味だ。"},{"t":"豚骨","r":"とんこつ","d":"豚の骨をじっくり煮込んで作る白くて濃いスープのことだよ。","s":"豚骨は白くて濃いラーメンのスープだ。"},{"t":"鶏ガラ","r":"とりがら","d":"鶏の骨を煮込んで作るスープのもとのことだよ。","s":"鶏ガラはあっさりしたスープになる。"},{"t":"味玉","r":"あじたま","d":"味がしっかりしみた半熟のゆでたまごのことだよ。","s":"味玉は味のしみたおいしいゆで卵だ。"},{"t":"食券","r":"しょっけん","d":"ラーメン屋で先にきっぷを買って注文する仕組みのことだよ。","s":"食券は先にお金を払って買うチケットだ。"},{"t":"大盛り","r":"おおもり","d":"ふつうよりたくさん麺やごはんが入っていることだよ。","s":"大盛りは普通より量が多いことだ。"},{"t":"カウンター","r":"かうんたー","d":"お店の人のすぐ前にある細長い席のことだよ。","s":"カウンターは一人で座れる席だ。"},{"t":"すする","r":"すする","d":"麺やスープを音をたてて口に吸い込むことだよ。","s":"すするは麺を音を立てて食べることだ。"},{"t":"完食","r":"かんしょく","d":"出された料理を残さず全部食べきることだよ。","s":"完食は料理を全部食べ終わることだ。"},{"t":"一杯","r":"いっぱい","d":"ラーメンやうどんを数えるときの言い方だよ。","s":"一杯はラーメン一つ分のことだ。"},{"t":"お寺","r":"おてら","d":"お坊さんがいて仏さまをまつっている建物のことだよ。","s":"お寺は静かで落ち着いた場所だ。"},{"t":"本堂","r":"ほんどう","d":"お寺の中で一番大切な建物のことだよ。","s":"本堂はお寺の中心にある建物だ。"},{"t":"仏像","r":"ぶつぞう","d":"仏さまの姿を木や石で作ったもののことだよ。","s":"仏像は木や石で作られた仏の像だ。"},{"t":"お坊さん","r":"おぼうさん","d":"お寺で修行をしてお経を読む人のことだよ。","s":"お坊さんはお寺で修行をしている。"},{"t":"鐘","r":"かね","d":"お寺にある大きな金属の鐘で、つくとゴーンと鳴るよ。","s":"鐘はたたくとゴーンと大きな音がする。"},{"t":"お線香","r":"おせんこう","d":"火をつけるとよい香りのけむりが出る細い棒のことだよ。","s":"お線香は火をつけるといい香りがする。"},{"t":"お参り","r":"おまいり","d":"神社やお寺に行って手を合わせておいのりすることだよ。","s":"お参りはお寺や神社に行くことだ。"},{"t":"石段","r":"いしだん","d":"石で作られた階段のことで、お寺によくあるよ。","s":"石段は石でできた長い階段のことだ。"},{"t":"山門","r":"さんもん","d":"お寺の入り口にある大きな門のことだよ。","s":"山門はお寺の正面に立つ大きな門だ。"},{"t":"灯籠","r":"とうろう","d":"石や金属で作られた明かりを入れるための台のことだよ。","s":"灯籠は石や金属でできた明かりだ。"},{"t":"苔","r":"こけ","d":"石や地面に生える緑色の小さな植物で、京都のお寺によく見られるよ。","s":"苔は緑色をしていてしっとりしている。"},{"t":"静寂","r":"せいじゃく","d":"音がまったくしない静かな状態のことだよ。","s":"静寂はとても静かな様子のことだ。"},{"t":"お地蔵さん","r":"おじぞうさん","d":"道ばたやお寺にいる子どもを守ってくれるやさしい仏さまだよ。","s":"お地蔵さんは道のそばに立っている。"},{"t":"手水","r":"ちょうず","d":"神社やお寺で手と口を水できれいにすることだよ。","s":"手水は手や口を清めるための水だ。"},{"t":"おみくじ","r":"おみくじ","d":"神社やお寺で引く占いの紙のことで、大吉が一番いいよ。","s":"おみくじは運勢を占うための紙だ。"},{"t":"絵馬","r":"えま","d":"願いごとを書いて神社やお寺にかける木の板のことだよ。","s":"絵馬は願いごとを書く木の板だ。"},{"t":"お守り","r":"おまもり","d":"持っていると守ってもらえるという小さなふくろのことだよ。","s":"お守りは願いをこめた小さな布の袋だ。"},{"t":"境内","r":"けいだい","d":"お寺や神社のしきちの中のことだよ。","s":"境内はお寺や神社の敷地のことだ。"},{"t":"紅葉","r":"こうよう","d":"秋に葉っぱが赤や黄色に色づくことで、京都の秋はとてもきれいだよ。","s":"紅葉は秋に葉が赤や黄色になることだ。"},{"t":"枯山水","r":"かれさんすい","d":"水を使わずに石や砂で山や川を表した庭のことだよ。","s":"枯山水は石と砂で作られた庭だ。"},{"t":"写経","r":"しゃきょう","d":"お経の文字を一つずつていねいに書き写す修行のことだよ。","s":"写経はお経を静かに書き写すことだ。"},{"t":"御朱印","r":"ごしゅいん","d":"お寺や神社でもらえる特別なはんこと手書きの記念だよ。","s":"御朱印はお寺や神社でもらえる印だ。"},{"t":"参道","r":"さんどう","d":"神社やお寺の入り口まで続く道のことだよ。","s":"参道はお寺や神社へ続く道のことだ。"},{"t":"仁王","r":"におう","d":"お寺の門で怖い顔をして守っている大きな像のことだよ。","s":"仁王は山門を守る力強い像のことだ。"},{"t":"精進料理","r":"しょうじんりょうり","d":"お肉や魚を使わずに野菜だけで作るお寺の料理のことだよ。","s":"精進料理は肉を使わない料理だ。"},{"t":"梵鐘","r":"ぼんしょう","d":"お寺にある大きな鐘のことで、大みそかにつくことで有名だよ。","s":"梵鐘はお寺にある大きくて重い鐘だ。"},{"t":"瓦","r":"かわら","d":"屋根にならべる焼き物のことで、お寺の屋根によく使われるよ。","s":"瓦は屋根の上をおおう板のことだ。"},{"t":"庫裏","r":"くり","d":"お寺の中でお坊さんたちがごはんを作ったり暮らしたりする建物だよ。","s":"庫裏はお坊さんが暮らす建物だ。"},{"t":"座禅","r":"ざぜん","d":"足を組んで静かに座り心をしずめる修行のことだよ。","s":"座禅は静かに座って心を整えることだ。"},{"t":"蓮","r":"はす","d":"泥の中から美しい花を咲かせる植物で、仏さまと関係が深いよ。","s":"蓮は夏になると池に咲く美しい花だ。"},{"t":"比叡山","r":"ひえいざん","d":"京都の北東にそびえる大きな山で、一乗寺からもよく見えるよ。","s":"比叡山は京都にある大きな山だ。"},{"t":"東山","r":"ひがしやま","d":"京都の東がわにある山なみのことだよ。","s":"東山は京都の東側に連なる山のことだ。"},{"t":"疏水","r":"そすい","d":"琵琶湖から京都に水を引くために作られた水路のことだよ。","s":"疏水は人の手で作られた水路のことだ。"},{"t":"小川","r":"おがわ","d":"小さな川のことで、一乗寺のまわりにも流れているよ。","s":"小川は水がさらさらと流れる細い川だ。"},{"t":"石畳","r":"いしだたみ","d":"平たい石をしきつめた道のことで、京都の古い道によくあるよ。","s":"石畳は石を敷き詰めて作られた道だ。"},{"t":"竹林","r":"ちくりん","d":"竹がたくさん生えている林のことだよ。","s":"竹林は竹がたくさん生えている林だ。"},{"t":"朝霧","r":"あさぎり","d" ゃ","d":"緑色のお茶の粉で、お茶をたてるときに使うよ。","s":"抹茶は茶葉をすりつぶした緑色の粉だ。"},{"t":"和菓子","r":"わがし","d":"日本の伝統的なお菓子で、きれいな形のものがたくさんあるよ。","s":"和菓子は日本の伝統的なお菓子だ。"},{"t":"団子","r":"だんご","d":"お米の粉をこねて丸めた和菓子で、串にさして食べるよ。","s":"団子は丸くてもちもちしている。"},{"t":"豆腐","r":"とうふ","d":"大豆から作る白くてやわらかい食べもので、京都の豆腐は有名だよ。","s":"豆腐は大豆から作られた食べ物だ。"},{"t":"漬物","r":"つけもの","d":"野菜を塩やぬかにつけて作る保存食で、京都は漬物の種類が多いよ。","s":"漬物は野菜を塩などに漬けた食べ物だ。"},{"t":"おばんざい","r":"おばんざい","d":"京都のおうちで昔から作られてきたおかずのことだよ。","s":"おばんざいは京都の家庭料理だ。"},{"t":"番茶","r":"ばんちゃ","d":"京都の人がふだん飲んでいるあっさりしたお茶のことだよ。","s":"番茶は毎日の食事でよく飲むお茶だ。"},{"t":"銭湯","r":"せんとう","d":"みんなが入れる大きなおふろ屋さんのことだよ。","s":"銭湯はお金を払って入るお風呂だ。"},{"t":"自転車","r":"じてんしゃ","d":"京都の人がよく使うのりもので、一乗寺を走るのも気持ちいいよ。","s":"自転車は二つの車輪で走る乗り物だ。"},{"t":"商店街","r":"しょうてんがい","d":"いろいろなお店がならんでいる通りのことだよ。","s":"商店街は小さなお店がたくさん並ぶ通りだ。"},{"t":"古本屋","r":"ふるほんや","d":"読み終わった本を売ったり買ったりするお店のことだよ。","s":"古本屋は古くなった本を売っているお店だ。"},{"t":"銘菓","r":"めいか","d":"その土地で有名なおいしいお菓子のことだよ。","s":"銘菓はその土地で有名なお菓子だ。"},{"t":"八つ橋","r":"やつはし","d":"ニッキの香りがする京都のおみやげの定番のお菓子だよ。","s":"八つ橋は京都の有名なお菓子だ。"},{"t":"京野菜","r":"きょうやさい","d":"京都で昔から育てられてきた特別な野菜のことだよ。","s":"京野菜は京都で昔から育てられた野菜だ。"},{"t":"湯豆腐","r":"ゆどうふ","d":"豆腐をお鍋であたためて食べるシンプルな京都の料理だよ。","s":"湯豆腐は豆腐をお湯で温めた料理だ。"},{"t":"床几","r":"しょうぎ","d":"お店の前に置いてある木の長いすのことで、京都のお茶屋さんで見かけるよ。","s":"床几は屋外に置く簡単な椅子だ。"},{"t":"打ち水","r":"うちみず","d":"暑い日に道に水をまいて涼しくすることだよ。","s":"打ち水は暑い日に道に水をまくことだ。"},{"t":"五山送り火","r":"ございおくりび","d":"お盆に京都の山で大きな火を燃やす伝統行事で、一乗寺からもよく見えるよ。","s":"五山送り火は夏に山で火をたく行事だ。"},{"t":"祇園祭","r":"ぎおんまつり","d":"毎年七月に京都で行われる日本で一番有名なお祭りの一つだよ。","s":"祇園祭は京都の夏の有名なお祭りだ。"},{"t":"お茶会","r":"おちゃかい","d":"抹茶をたてておもてなしをする集まりのことだよ。","s":"お茶会はお茶を楽しむ集まりだ。"},{"t":"地蔵盆","r":"じぞうぼん","d":"夏に子どもたちがお地蔵さんのまわりに集まってお祝いする行事だよ。","s":"地蔵盆は子どものための夏の行事だ。"},{"t":"暮らし","r":"くらし","d":"毎日の生活のことで、一乗寺はのんびりした暮らしが楽しめる町だよ。","s":"暮らしは毎日の生活のことを指す言葉だ。"},{"t":"金閣寺","r":"きんかくじ","d":"金色にかがやくお寺で、京都でいちばん有名な建物のひとつだよ。","s":"金閣寺は京都にある金色のお寺だ。"},{"t":"銀閣寺","r":"ぎんかくじ","d":"一乗寺のちかくにある落ちついたお寺で、わびさびの美しさを感じられるよ。","s":"銀閣寺は京都にある静かなお寺だ。"},{"t":"清水寺","r":"きよみずでら","d":"大きな舞台があるお寺で、「清水の舞台から飛びおりる」ということわざでも有名だよ。","s":"清水寺は京都でとても有名なお寺だ。"},{"t":"嵐山","r":"あらしやま","d":"京都の西にある自然がいっぱいの場所で、春は桜、秋は色づく木々がきれいだよ。","s":"嵐山は秋に紅葉がきれいな場所だ。"},{"t":"鴨川","r":"かもがわ","d":"京都の街なかを流れる川で、川べりをさんぽするのがとっても気持ちいいよ。","s":"鴨川は京都の中心を流れる川だ。"},{"t":"祇園","r":"ぎおん","d":"舞妓さんに会えるかもしれない、昔ながらの美しい街なみが残るところだよ。","s":"祇園は京都にある有名な繁華街だ。"},{"t":"伏見稲荷","r":"ふしみいなり","d":"赤い鳥居がずらっとならんでいる神社で、まるでトンネルみたいだよ。","s":"伏見稲荷は鳥居がたくさんある神社だ。"},{"t":"二条城","r":"にじょうじょう","d":"徳川家康がつくったお城で、歩くとキュッと鳴る「うぐいす張り」の廊下があるよ。","s":"二条城は京都にある古いお城だ。"},{"t":"平安神宮","r":"へいあんじんぐう","d":"大きくて赤い鳥居がめじるしの神社で、広いお庭もすてきだよ。","s":"平安神宮は大きくて立派な神社だ。"},{"t":"哲学の道","r":"てつがくのみち","d":"銀閣寺のちかくにある小道で、春は桜のトンネルになってとてもきれいだよ。","s":"哲学の道は桜がきれいな散歩道だ。"},{"t":"南禅寺","r":"なんぜんじ","d":"大きな山門とレンガの水路閣がある、とても立派なお寺だよ。","s":"南禅寺は京都にある大きなお寺だ。"},{"t":"大文字山","r":"だいもんじやま","d":"一乗寺からも見える山で、夏には「大」の字の火がともされるんだよ。","s":"大文字山は京都にある有名な山だ。"},{"t":"五条大橋","r":"ごじょうおおはし","d":"牛若丸と弁慶が出会ったと言われる有名な橋だよ。","s":"五条大橋は鴨川にかかる大きな橋だ。"},{"t":"北野天満宮","r":"きたのてんまんぐう","d":"学問の神さま菅原道真をまつっていて、受験生がたくさんお参りにくるよ。","s":"北野天満宮は学問の神様を祀る神社だ。"},{"t":"下鴨神社","r":"しもがもじんじゃ","d":"糺の森という静かな森にかこまれた、とても古い神社だよ。","s":"下鴨神社は京都にある古い神社だ。"},{"t":"上賀茂神社","r":"かみがもじんじゃ","d":"京都でもっとも古い神社のひとつで、白い砂で作った円すいの山が有名だよ。","s":"上賀茂神社は京都にある有名な神社だ。"},{"t":"三十三間堂","r":"さんじゅうさんげんどう","d":"千体もの仏さまがずらっとならんでいて、そのすがたに圧倒されるよ。","s":"三十三間堂はたくさんの仏像があるお寺だ。"},{"t":"龍安寺","r":"りょうあんじ","d":"白い砂と石だけで作られた石庭がある、世界的に有名なお寺だよ。","s":"龍安寺は美しい石庭で有名なお寺だ。"},{"t":"西陣","r":"にしじん","d":"美しい生地「西陣織」で有名な、京都の職人さんの街だよ。","s":"西陣は京都にある織物で有名な地域だ。"},{"t":"先斗町","r":"ぽんとちょう","d":"鴨川ぞいにある細い路地で、夜になると灯りがともってとても風情があるよ。","s":"先斗町は京都の細い路地の街だ。"},{"t":"八坂神社","r":"やさかじんじゃ","d":"祇園祭のときに中心になる神社で、朱色の門がとても美しいよ。","s":"八坂神社は祇園にある有名な神社だ。"},{"t":"貴船","r":"きぶね","d":"夏でもすずしい山あいの場所で、川の上で食べる「川床」が楽しいよ。","s":"貴船は川床料理で有名な場所だ。"},{"t":"大原","r":"おおはら","d":"京都の北にある静かな里で、三千院というお寺がとても有名だよ。","s":"大原は京都にある静かな田舎町だ。"},{"t":"修学院離宮","r":"しゅがくいんりきゅう","d":"一乗寺のちかくにある皇室のお庭で、山の上から見る景色がすばらしいよ。","s":"修学院離宮は広い庭園がある建物だ。"},{"t":"陶芸","r":"とうげい","d":"土をこねてお皿やお茶碗をつくる芸術で、手で形をつくるのが楽しいよ。","s":"陶芸は土で器を作る伝統的な芸術だ。"},{"t":"染物","r":"そめもの","d":"布にきれいな色や模様をつける仕事で、京都ではとくに有名だよ。","s":"染物は布に色をつける伝統的な技術だ。"},{"t":"友禅","r":"ゆうぜん","d":"布にうつくしい絵を描いて染める京都の伝統的な技法だよ。","s":"友禅は美しい模様を染める技法だ。"},{"t":"扇","r":"おうぎ","d":"パタパタとあおいで風をおくる道具で、きれいな絵がかいてあるよ。","s":"扇は手で仰いで風を送る道具だ。"},{"t":"筆","r":"ふで","d":"墨をつけて字や絵をかく道具で、やわらかい毛でできているよ。","s":"筆は毛でできた字を書く道具だ。"},{"t":"墨","r":"すみ","d":"すずりで水と一緒にすると黒い液になる、書道に使う道具だよ。","s":"墨は書道で使う黒くて濃い液体だ。"},{"t":"和紙","r":"わし","d":"日本の伝統的な紙で、ふつうの紙よりもじょうぶで長もちするよ。","s":"和紙は日本に伝わる伝統的な紙だ。"},{"t":"漆","r":"うるし","d":"木に塗るとピカピカに光る天然のぬり材で、お椀やお箸に使われるよ。","s":"漆は木の器に塗る天然の塗料だ。"},{"t":"金箔","r":"きんぱく","d":"金をうすーくのばしたもので、工芸品やお菓子のかざりに使われるよ。","s":"金箔は金を薄く伸ばした美しい箔だ。"},{"t":"織物","r":"おりもの","d":"糸を組み合わせて布をつくることで、京都には美しい織物がたくさんあるよ。","s":"織物は糸を織って作る美しい布だ。"},{"t":"刺繍","r":"ししゅう","d":"針と糸で布に絵や模様をぬうことで、とても細かくてきれいだよ。","s":"刺繍は糸で模様を作る伝統技術だ。"},{"t":"焼き物","r":"やきもの","d":"土や石をこねて形をつくり、かまで焼いてつくるお皿やつぼのことだよ。","s":"焼き物は土を焼いて作る美しい器だ。"},{"t":"茶碗","r":"ちゃわん","d":"お茶をのむための器で、ひとつひとつ手づくりで形がちがうのが楽しいよ。","s":"茶碗はご飯やお茶を入れる器だ。"},{"t":"花瓶","r":"かびん","d":"お花をいけるための器で、京都にはうつくしい焼き物の花瓶がたくさんあるよ。","s":"花瓶はきれいな花を生ける器だ。"},{"t":"蒔絵","r":"まきえ","d":"漆の上に金や銀の粉で絵をえがく技法で、キラキラしてとても美しいよ。","s":"蒔絵は漆に金粉で模様を描く技法だ。"},{"t":"屏風","r":"びょうぶ","d":"折りたたみ式の大きなついたてで、きれいな絵がかかれていることが多いよ。","s":"屏風は部屋を仕切る絵の入った家具だ。"},{"t":"掛け軸","r":"かけじく","d":"絵や書を巻き物にして壁にかける日本の伝統的な飾りだよ。","s":"掛け軸は壁に掛ける絵の作品だ。"},{"t":"七宝焼き","r":"しっぽうやき","d":"金属にガラスの粉をのせて焼くと、宝石みたいにきれいな模様ができるよ。","s":"七宝焼きは色ガラスで作る美しい工芸品だ。"},{"t":"竹細工","r":"たけざいく","d":"竹をうすく割って編んだり曲げたりして、かごや花入れをつくる仕事だよ。","s":"竹細工は竹で作る伝統的な工芸品だ。"},{"t":"西陣織","r":"にしじんおり","d":"京都の西陣で織られる高級な布で、金糸や銀糸をつかった美しい模様が特徴だよ。","s":"西陣織は京都で作られる高級な織物だ。"},{"t":"清水焼","r":"きよみずやき","d":"京都で作られる焼き物のことで、うつくしい色あいが人気だよ。","s":"清水焼は京都で作られる焼き物だ。"},{"t":"能面","r":"のうめん","d":"能というげきで使うお面で、角度によって表情がかわって見えるんだよ。","s":"能面は能楽で役者がつける木の面だ。"},{"t":"千代紙","r":"ちよがみ","d":"きれいな模様がプリントされた日本の紙で、折り紙にもつかうよ。","s":"千代紙は模様がきれいな和紙だ。"},{"t":"組紐","r":"くみひも","d":"何本もの糸をあんで作るひもで、帯じめなどに使われるきれいな工芸品だよ。","s":"組紐は色々な糸を組んで作るひもだ。"},{"t":"箔押し","r":"はくおし","d":"金箔や銀箔をおして模様をつける技法で、本の表紙やお菓子の箱にも使われるよ。","s":"箔押しは紙や布に金箔をつける技術だ。"},{"t":"大文字焼き","r":"だいもんじやき","d":"8月16日に山に「大」の字の火をともす京都の夏の風物詩だよ。","s":"大文字焼きは夏に山で火を灯す行事だ。"},{"t":"時代祭","r":"じだいまつり","d":"昔の衣装を着た人たちが行列する、京都三大祭りのひとつだよ。","s":"時代祭は京都で行われる有名なお祭りだ。"},{"t":"節分","r":"せつぶん","d":"2月はじめに「鬼は外、福は内」と言いながら豆をまく行事だよ。","s":"節分は豆をまいて鬼を追い払う行事だ。"},{"t":"豆まき","r":"まめまき","d":"節分のときに豆を投げて悪い鬼を追いはらう、楽しい行事だよ。","s":"豆まきは節分に豆を投げる行事だ。"},{"t":"七夕","r":"たなばた","d":"7月7日に願いごとを短冊に書いて笹にかざる、星のお祭りだよ。","s":"七夕は星に願い事をする行事だ。"},{"t":"お盆","r":"おぼん","d":"ご先祖さまが帰ってくるとされる夏の行事で、家族みんなでお迎えするよ。","s":"お盆はご先祖様を迎える行事だ。"},{"t":"盆踊り","r":"ぼんおどり","d":"お盆のときにみんなで輪になっておどる、夏の楽しいイベントだよ。","s":"盆踊りは夏祭りの夜に踊る踊りだ。"},{"t":"初詣","r":"はつもうで","d":"お正月に神社やお寺にお参りして、新しい年のお願いごとをすることだよ。","s":"初詣は正月に神社へお参りする行事だ。"},{"t":"除夜の鐘","r":"じょやのかね","d":"大みそかの夜に108回つく鐘の音で、新しい年を気持ちよくむかえるんだよ。","s":"除夜の鐘は大晦日の夜につく鐘だ。"},{"t":"雛祭り","r":"ひなまつり","d":"3月3日に雛人形をかざって女の子のしあわせを願うお祭りだよ。","s":"雛祭りは女の子の成長を祝う行事だ。"},{"t":"端午の節句","r":"たんごのせっく","d":"5月5日にこいのぼりをあげて、男の子の元気な成長を願う日だよ。","s":"端午の節句は男の子の成長を祝う日だ。"},{"t":"十五夜","r":"じゅうごや","d":"秋の満月を見ながらお月見だんごをたべる、風流な行事だよ。","s":"十五夜は秋に満月を見る行事だ。"},{"t":"お花見","r":"おはなみ","d":"桜の木の下でみんなでお弁当を食べたりして楽しむ、春のすてきな行事だよ。","s":"お花見は春に桜を見て楽しむ行事だ。"},{"t":"葵祭","r":"あおいまつり","d":"京都三大祭りのひとつで、葵の葉をかざった行列が街を歩くよ。","s":"葵祭は京都で行われる有名なお祭りだ。"},{"t":"鞍馬の火祭","r":"くらまのひまつり","d":"10月に鞍馬で行われる迫力まんてんの火のお祭りだよ。","s":"鞍馬の火祭は秋に行われる火のお祭りだ。"},{"t":"正月","r":"しょうがつ","d":"新しい年のはじまりをお祝いする日本でいちばん大きな行事だよ。","s":"正月は一年の始まりを祝う時期だ。"},{"t":"年越し","r":"としこし","d":"12月31日の夜に古い年をおくり新しい年をむかえることだよ。","s":"年越しは古い年から新しい年に変わる時だ。"},{"t":"お月見","r":"おつきみ","d":"きれいな月を見ながらすすきをかざって秋の夜をたのしむ行事だよ。","s":"お月見は秋に月を見て楽しむ行事だ。"},{"t":"彼岸","r":"ひがん","d":"春と秋にご先祖さまのお墓まいりをする期間で、おはぎを食べたりするよ。","s":"彼岸は春と秋にお墓参りをする時期だ。"},{"t":"夏祭り","r":"なつまつり","d":"夏に行われるお祭りで、屋台がならんで花火があがってとてもにぎやかだよ。","s":"夏祭りは夏に行われる楽しいお祭りだ。"},{"t":"秋祭り","r":"あきまつり","d":"実りの秋に感謝するお祭りで、おみこしが出たりしてにぎわうよ。","s":"秋祭りは秋に行われる楽しいお祭りだ。"},{"t":"餅つき","r":"もちつき","d":"臼と杵をつかってぺったんぺったんとおもちをつく、年末の楽しい行事だよ。","s":"餅つきはお米をついて餅を作る行事だ。"},{"t":"書き初め","r":"かきぞめ","d":"お正月に新年のめあてや好きな言葉を筆で書く伝統行事だよ。","s":"書き初めは正月に初めて字を書く行事だ。"},{"t":"成人式","r":"せいじんしき","d":"20歳になったことをお祝いする式で、はれ着を着ておとなの仲間入りをするんだよ。","s":"成人式は大人になったことを祝う行事だ。"},{"t":"おでん","r":"おでん","d":"大根やたまごをあったかいだし汁でにこんだ、冬にぴったりの料理だよ。","s":"おでんは冬に食べる温かい料理だ。"},{"t":"焼き芋","r":"やきいも","d":"さつまいもを焼いたもので、ほくほく甘くて冬のおやつにさいこうだよ。","s":"焼き芋は秋や冬に食べる甘い食べ物だ。"},{"t":"たこ焼き","r":"たこやき","d":"まるい生地の中にたこが入った関西の名物で、外はカリカリ中はトロトロだよ。","s":"たこ焼きはたこが入った丸い食べ物だ。"},{"t":"お好み焼き","r":"おこのみやき","d":"キャベツやお肉を生地にまぜて焼く関西のソウルフードだよ。","s":"お好み焼きは野菜や肉が入った焼き物だ。"},{"t":"うどん","r":"うどん","d":"太くてもちもちした食べもので、あたたかいおだしで食べるとほっとするよ。","s":"うどんは太い麺を使った料理だ。"},{"t":"そば","r":"そば","d":"そば粉からつくる細い食べもので、京都ではにしんそばが有名だよ。","s":"そばは細くて茶色い麺の料理だ。"},{"t":"天ぷら","r":"てんぷら","d":"野菜やエビに衣をつけてカラッと揚げた料理で、サクサクでおいしいよ。","s":"天ぷらは魚や野菜を揚げた料理だ。"},{"t":"寿司","r":"すし","d":"お酢で味つけしたごはんの上にお魚をのせた、日本を代表する食べものだよ。","s":"寿司はご飯と魚を使った料理だ。"},{"t":"おもち","r":"おもち","d":"もち米をついて作るやわらかい食べもので、お正月にはかかせないよ。","s":"おもちはお米をついて作る食べ物だ。"},{"t":"ぜんざい","r":"ぜんざい","d":"あまいあずきの汁におもちを入れたあったかいデザートで、冬にぴったりだよ。","s":"ぜんざいは小豆で作る甘い食べ物だ。"},{"t":"わらび餅","r":"わらびもち","d":"プルプルとした食感のすずしいお菓子で、きな粉をかけて食べるとおいしいよ。","s":"わらび餅はもちもちした甘いお菓子だ。"},{"t":"鯖寿司","r":"さばずし","d":"脂ののった鯖を使った押し寿司で、京都の伝統的な味だよ。","s":"鯖寿司は鯖を使った京都の名物料理だ。"},{"t":"にしんそば","r":"にしんそば","d":"甘く煮たにしんをおそばにのせた京都の名物料理だよ。","s":"にしんそばはにしんをのせたそばだ。"},{"t":"千枚漬け","r":"せんまいづけ","d":"かぶをうすーく切ってつけた京都の冬の漬物で、上品な味がするよ。","s":"千枚漬けはかぶらで作る京都の漬物だ。"},{"t":"生麩","r":"なまふ","d":"もちもちした食感の食べもので、京都ではお料理にもお菓子にも使われるよ。","s":"生麩は豆乳の膜から作る食べ物だ。"},{"t":"懐石料理","r":"かいせきりょうり","d":"季節の食材をうつくしく盛りつけた日本の伝統的なコース料理だよ。","s":"懐石料理は京都に伝わる上品な料理だ。"},{"t":"湯葉","r":"ゆば","d":"豆乳をあたためたときにできるうすい膜で、とってもなめらかでおいしいよ。","s":"湯葉は豆乳の膜から作る食べ物だ。"},{"t":"茶そば","r":"ちゃそば","d":"お茶を練りこんだ緑色のおそばで、香りがよくてさわやかな味だよ。","s":"茶そばは緑茶が入った緑色のそばだ。"},{"t":"ちりめん山椒","r":"ちりめんざんしょう","d":"小さなじゃこと山椒をいっしょに炊いた京都のごはんのおともだよ。","s":"ちりめん山椒は魚と山椒で作る料理だ。"},{"t":"柚子","r":"ゆず","d":"さわやかな香りのする柑橘で、料理の香りづけやゆず湯に使われるよ。","s":"柚子は香りがいい黄色い果物だ。"},{"t":"鹿","r":"しか","d":"奈良公園が有名だけど、京都の山にもいる、やさしい目をした動物だよ。","s":"鹿は山や森に住む角のある動物だ。"},{"t":"亀","r":"かめ","d":"長生きの象徴で、神社の池でのんびり甲羅干しをしているのを見かけるよ。","s":"亀は甲羅を持つゆっくり歩く動物だ。"},{"t":"鯉","r":"こい","d":"お寺や神社の池をゆうゆうと泳ぐ大きな魚で、色とりどりでうつくしいよ。","s":"鯉は川や池に住む美しい大きな魚だ。"},{"t":"つばめ","r":"つばめ","d":"春になるとやってきて軒先に巣をつくる鳥で、すばやく飛ぶ姿がかっこいいよ。","s":"つばめは春に日本へ来る渡り鳥だ。"},{"t":"すずめ","r":"すずめ","d":"チュンチュンとないて街なかにもいる小さな鳥で、とても身近な存在だよ。","s":"すずめは町でよく見る小さな鳥だ。"},{"t":"梅","r":"うめ","d":"まだ寒い早春にさく花で、いい香りがして春がくることを教えてくれるよ。","s":"梅は早春に咲く香りのいい花だ。"},{"t":"藤","r":"ふじ","d":"むらさき色の花がすだれのように垂れさがる、とてもうつくしい花だよ。","s":"藤は紫色の花が垂れて咲く植物だ。"},{"t":"菊","r":"きく","d":"秋に咲く日本を代表する花で、皇室の紋章にもなっているよ。","s":"菊は秋に咲く色とりどりの花だ。"},{"t":"杉","r":"すぎ","d":"まっすぐ高くのびる木で、京都の北山杉はとくに美しいことで有名だよ。","s":"杉はまっすぐに高く伸びる大きな木だ。"},{"t":"しだれ桜","r":"しだれざくら","d":"枝がやわらかく垂れさがる桜で、まるで花のカーテンみたいだよ。","s":"しだれ桜は枝が垂れて咲く桜だ。"},{"t":"紫陽花","r":"あじさい","d":"梅雨の時期にさく花で、青やむらさき、ピンクに色がかわるのがふしぎだよ。","s":"紫陽花は梅雨に咲く青や紫の花だ。"},{"t":"蛍","r":"ほたる","d":"夏の夜にお尻を光らせて飛ぶ虫で、鴨川のちかくでも見られることがあるよ。","s":"蛍は夏の夜に光りながら飛ぶ虫だ。"},{"t":"竹","r":"たけ","d":"すくすくまっすぐ伸びる植物で、かごやざるなどいろんなものに使われるよ。","s":"竹はまっすぐに高く伸びる植物だ。"},{"t":"萩","r":"はぎ","d":"秋の七草のひとつで、小さなむらさき色の花がたくさん咲くかわいい植物だよ。","s":"萩は秋に小さな花を咲かせる植物だ。"},{"t":"睡蓮","r":"すいれん","d":"水の上にうかぶように咲く花で、お寺の池でよく見かけるよ。","s":"睡蓮は池の水面に咲く美しい花だ。"},{"t":"山茶花","r":"さざんか","d":"冬の寒い時期にも元気に咲く花で、垣根によく植えられているよ。","s":"山茶花は冬に咲く赤やピンクの花だ。"},{"t":"柳","r":"やなぎ","d":"細い枝が風にゆれるすがたが美しい木で、川のほとりによく植えられているよ。","s":"柳は川辺に多い枝が垂れる木だ。"},{"t":"桔梗","r":"ききょう","d":"むらさき色の星の形をした花で、昔からお寺のお庭に植えられてきたよ。","s":"桔梗は星の形をした紫色の花だ。"},{"t":"百合","r":"ゆり","d":"大きくて香りのよい花で、白い百合はとくに気品があるよ。","s":"百合は大きくて香りのいい花だ。"},{"t":"鶴","r":"つる","d":"長生きの象徴とされる美しい鳥で、折り紙でもよく折られるよ。","s":"鶴は首と足がとても長い白い鳥だ。"},{"t":"うぐいす","r":"うぐいす","d":"「ホーホケキョ」と美しい声でなく鳥で、春を告げる鳥として親しまれているよ。","s":"うぐいすは春にきれいな声で鳴く鳥だ。"},{"t":"風情","r":"ふぜい","d":"なんとも言えない味わい深いようすのことで、京都の街にはこれがたっぷりあるよ。","s":"風情はその場所が持つ独特な雰囲気だ。"},{"t":"趣","r":"おもむき","d":"しみじみとした味わいや感じのことで、古い建物や庭園に感じるよ。","s":"趣はものが持つ独特なおもしろさだ。"},{"t":"粋","r":"いき","d":"さりげなくかっこいいようすのことで、おしゃれの最上級みたいな意味だよ。","s":"粋は洗練されたかっこよさを表す言葉だ。"},{"t":"雅","r":"みやび","d":"上品でうつくしいようすのことで、平安時代の貴族の世界を思わせるよ。","s":"雅は上品で美しい様子を表す言葉だ。"},{"t":"わびさび","r":"わびさび","d":"シンプルで静かなものの中に美しさを見つける、日本ならではの考え方だよ。","s /* ── Park zone (一乗寺公園) ── */
var PARK_CENTER=[35.0422989,135.7871945];
var PARK_BOUNDS=[
  [35.0429519,135.7868887],
  [35.0429449,135.7873092],
  [35.0429489,135.7878188],
  [35.0429043,135.787872],
  [35.0424507,135.7878337],
  [35.0415857,135.7877913],
  [35.0415401,135.7876949],
  [35.0415746,135.7869094],
  [35.0419565,135.7866844],
  [35.0419812,135.7863771],
  [35.0422493,135.7865141],
  [35.0424981,135.7866404]
];
var PARK_LAT_MIN=35.0415401,PARK_LAT_MAX=35.0429519;
var PARK_LNG_MIN=135.7863771,PARK_LNG_MAX=135.787872;

function pointInPoly(lat,lng,poly){
  var inside=false;
  for(var i=0,j=poly.length-1;i<poly.length;j=i++){
    var yi=poly[i][0],xi=poly[i][1];
    var yj=poly[j][0],xj=poly[j][1];
    if(((yi>lat)!==(yj>lat))&&(lng<(xj-xi)*(lat-yi)/(yj-yi)+xi))
      inside=!inside;
  }
  return inside;
}
function inPark(lat,lng){
  if(lat<PARK_LAT_MIN||lat>PARK_LAT_MAX||lng<PARK_LNG_MIN||lng>PARK_LNG_MAX)return false;
  return pointInPoly(lat,lng,PARK_BOUNDS);
}


/* ── Helpers ── */
function rb(t,r){if(t===r)return t;return '<ruby>'+t+'<rp>(</rp><rt>'+r+'</rt><rp>)</rp></ruby>'}
function rand(a,b){return a+Math.random()*(b-a)}
function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;
  }
  return arr;
}
function pick(arr,n){return shuffle(arr.slice()).slice(0,Math.min(n,arr.length))}

/* ── Generate random positions (avoiding park) ── */
function genPositions(n){
  var pts=[];
  var attempts=0;
  while(pts.length<n&&attempts<n*20){
    var angle=Math.random()*Math.PI*2;
    var radius=Math.sqrt(Math.random());
    var lat=CENTER[0]+Math.cos(angle)*radius*SPREAD_LAT;
    var lng=CENTER[1]+Math.sin(angle)*radius*SPREAD_LNG;
    attempts++;
    if(!inPark(lat,lng)){pts.push([lat,lng])}
  }
  return pts;
}

/* ── Place words on map ── */
function placeWords(){
  /* dismiss any active state */
  if(curOn){
    curOn.classList.remove('on');
    curOn=null;
    document.body.classList.remove('focus');
    barEl.classList.remove('show');
  }
  /* remove old markers */
  markers.forEach(function(m){map.removeLayer(m)});
  markers=[];

  var nLocal=Math.round(SHOW_COUNT*0.3);
  var nGeneral=SHOW_COUNT-nLocal;
  var localPicked=pick(LOCAL,nLocal).map(function(w){return {t:w.t,r:w.r,d:w.d,s:w.s,local:true}});
  var generalPicked=pick(GENERAL,nGeneral);
  var chosen=shuffle(localPicked.concat(generalPicked));
  var positions=genPositions(SHOW_COUNT);

  chosen.forEach(function(w,i){
    var s=SIZES[Math.floor(Math.random()*SIZES.length)];
    var cw=s*1.15;
    var tw=w.t.length*cw+(w.t.length-1)*4;
    var cls=w.local?'w local':'w';
    var icon=L.divIcon({
      html:'<div class="'+cls+'" style="font-size:'+s+'px">'+rb(w.t,w.r)+'</div>',
      className:'',
      iconSize:[tw+24,s+20],
      iconAnchor:[(tw+24)/2,(s+20)/2]
    });
    var m=L.marker(positions[i],{icon:icon,interactive:true,keyboard:false,draggable:true}).addTo(map);
    m._wordData=w;

    /* stagger fade-in */
    (function(marker,word){
      setTimeout(function(){
        var el=getW(marker);
        if(el)el.classList.add('visible');
      },100+i*60);

      marker.on('mouseover',function(){if(!marker._isDragging)show(marker,word)});
      marker.on('mouseout',function(){if(!marker._isDragging)hide(marker)});
      marker.on('click',function(e){
        L.DomEvent.stopPropagation(e);
        if(curOn===getW(marker)){hide(marker)} else {show(marker,word)}
      });

      /* drag events */
      marker.on('dragstart',function(){
        marker._isDragging=true;
        hide(marker);
        var el=getW(marker);
        if(el)el.classList.add('dragging');
      });
      marker.on('dragend',function(){
        marker._isDragging=false;
        var el=getW(marker);
        if(el)el.classList.remove('dragging');
        var pos=marker.getLatLng();
        if(inPark(pos.lat,pos.lng)){
          absorbWord(marker,word);
        }
      });
    })(m,w);

    markers.push(m);
  });
}

function getW(m){return m.getElement()?m.getElement().querySelector('.w'):null}

function show(m,w){
  var el=getW(m);if(!el)return;
  if(curOn&&curOn!==el)curOn.classList.remove('on');
  curOn=el;
  el.classList.add('on');
  document.body.classList.add('focus');
  bwEl.innerHTML=rb(w.t,w.r);
  bdEl.textContent=w.d;
  barEl.classList.add('show');
}

function hide(m){
  var el=getW(m);if(!el)return;
  el.classList.remove('on');
  if(curOn===el){
    curOn=null;
    document.body.classList.remove('focus');
    barEl.classList.remove('show');
  }
}

map.on('click',function(){
  if(curOn){
    curOn.classList.remove('on');
    curOn=null;
    document.body.classList.remove('focus');
    barEl.classList.remove('show');
  }
  /* dismiss sentence on map click */
  sentenceEl.classList.remove('show');
});

/* ── Absorb word into park ── */
function absorbWord(marker,word){
  var el=getW(marker);
  if(!el)return;
  /* animate: move marker to park center */
  marker.setLatLng(PARK_CENTER);
  /* trigger absorb animation */
  setTimeout(function(){
    el.classList.add('absorbing');
  },50);
  /* after animation, remove marker and show sentence */
  setTimeout(function(){
    map.removeLayer(marker);
    var idx=markers.indexOf(marker);
    if(idx>-1)markers.splice(idx,1);
    showSentence(word);
  },700);
}

function showSentence(word){
  var text=word.s?word.s.replace(new RegExp(word.t,'g'),'<span class="sword">'+word.t+'</span>'):'<span class="sword">'+word.t+'</span>';
  sentenceEl.innerHTML=text;
  sentenceEl.classList.add('show');
  if(sentenceTimer)clearTimeout(sentenceTimer);
  sentenceTimer=setTimeout(function(){
    sentenceEl.classList.remove('show');
  },4500);
}

/* ── Shuffle button ── */
document.getElementById('shuffle').addEventListener('click',function(e){
  e.stopPropagation();
  placeWords();
});

/* ── Initial placement ── */
placeWords();
</script>
