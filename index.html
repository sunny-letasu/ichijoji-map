<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>一乗寺</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Antique+Soft&family=Noto+Sans+JP:wght@300;400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#f0ece4}
body{font-family:'Noto Sans JP',sans-serif}

/* ── Map ── */
#map{position:fixed;inset:0;z-index:1}

/* Simplify tiles: desaturate + wash out labels */
.leaflet-tile-pane{
  filter:saturate(0) brightness(1.2) contrast(0.5);
  opacity:.75;
}

/* warm tint over the map */
#tint{
  position:fixed;inset:0;z-index:2;
  background:rgba(240,236,228,.18);
  pointer-events:none;
}

/* ── Hide default Leaflet chrome ── */
.leaflet-control-zoom{display:none!important}
.leaflet-control-attribution{
  font-size:8px!important;opacity:.25!important;
  background:transparent!important;color:#888!important;
}
.leaflet-control-attribution a{color:#888!important}

/* ── Word markers ── */
.w{
  font-family:'Zen Antique Soft',serif;
  color:#1a1a14;
  opacity:.45;
  cursor:default;
  white-space:nowrap;
  letter-spacing:4px;
  transition:opacity .5s,transform .5s;
  transform:scale(1);
  text-shadow:
    0 0 20px rgba(240,236,228,.9),
    0 0 40px rgba(240,236,228,.6);
  user-select:none;
  -webkit-user-select:none;
}
.w rt{
  font-size:.45em;
  letter-spacing:1px;
  opacity:.7;
}
.w.on{
  opacity:1;
  transform:scale(1.12);
  text-shadow:
    0 0 20px rgba(240,236,228,.9),
    0 0 40px rgba(240,236,228,.6),
    0 1px 3px rgba(0,0,0,.08);
}
.w.on rt{opacity:1}
body.focus .w:not(.on){
  opacity:.12;
}

/* ── Description bar ── */
#bar{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  padding:22px 32px 26px;
  background:linear-gradient(transparent 0%,rgba(26,26,20,.6) 25%,rgba(26,26,20,.82) 100%);
  color:#F0E4C4;
  transform:translateY(100%);
  opacity:0;
  transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .5s;
  display:flex;align-items:center;gap:24px;
  pointer-events:none;
}
#bar.show{transform:translateY(0);opacity:1}
#bar .bw{
  font-family:'Zen Antique Soft',serif;
  font-size:28px;letter-spacing:8px;flex-shrink:0;
}
#bar .bw rt{
  font-size:.45em;
  letter-spacing:1px;
}
#bar .bd{
  font-size:14px;line-height:1.8;font-weight:300;
  letter-spacing:.5px;color:rgba(240,228,196,.8);
}

/* ── Title watermark ── */
#wm{
  position:fixed;top:18px;left:22px;z-index:100;
  pointer-events:none;transition:opacity .5s;
}
#wm .t1{
  font-family:'Zen Antique Soft',serif;
  font-size:16px;letter-spacing:10px;
  color:rgba(26,26,20,.2);
}
#wm .t1 rt{
  font-size:.5em;
  letter-spacing:2px;
}
#wm .t2{
  font-size:9px;letter-spacing:2px;margin-top:3px;
  color:rgba(26,26,20,.13);font-weight:300;
}
body.focus #wm{opacity:.3}

/* ── Mobile ── */
@media(max-width:600px){
  .w{letter-spacing:2px}
  #bar{padding:16px 20px 22px;flex-direction:column;gap:8px}
  #bar .bw{font-size:22px;letter-spacing:5px}
  #bar .bd{font-size:12px;line-height:1.7}
  #wm{top:12px;left:14px}
  #wm .t1{font-size:14px;letter-spacing:6px}
  #wm .t2{font-size:8px}
}
</style>
</head>
<body>

<div id="map"></div>
<div id="tint"></div>

<div id="wm">
  <div class="t1"><ruby>一乗寺<rp>(</rp><rt>いちじょうじ</rt><rp>)</rp></ruby></div>
  <div class="t2">京都 — 文化と味が交差する街</div>
</div>

<div id="bar">
  <div class="bw" id="bw"></div>
  <div class="bd" id="bd"></div>
</div>

<script>
/* ─── Ruby helper ─── */
function rb(t,r){
  return '<ruby>'+t+'<rp>(</rp><rt>'+r+'</rt><rp>)</rp></ruby>';
}

/* ─── Words ─── */
var W=[
  {t:'濃厚',r:'のうこう',la:35.0448,ln:135.7868,s:20,
   d:'20いじょうのラーメン屋さんがある街。どのお店のスープもとっても濃くておいしいよ。'},
  {t:'鶏',r:'とり',la:35.0502,ln:135.7888,s:24,
   d:'とりの骨をじっくり煮こんだ白いスープ。スプーンが立つほどドロドロ！行列ができる人気のラーメンだよ。'},
  {t:'屋台',r:'やたい',la:35.0378,ln:135.7900,s:17,
   d:'1971年、小さな屋台から始まったラーメン屋さん。今では全国に200店いじょうある「天下一品」の始まりの場所だよ。'},
  {t:'活字',r:'かつじ',la:35.0418,ln:135.7875,s:16,
   d:'イギリスの新聞で「世界でいちばん美しい本屋」にえらばれたお店。テーマごとに本がならんでいて、すてきな一冊に出会えるよ。'},
  {t:'決闘',r:'けっとう',la:35.0475,ln:135.7935,s:19,
   d:'1604年、宮本武蔵がたくさんの敵と戦った場所。今も松の木が残っているよ（4代目だけどね）。'},
  {t:'剣',r:'けん',la:35.0503,ln:135.7955,s:26,
   d:'「神さまにはたよらない。自分の腕だけを信じる」——武蔵は神社でお参りをやめて、戦いの場所へ向かったんだ。'},
  {t:'俳句',r:'はいく',la:35.0435,ln:135.7953,s:18,
   d:'松尾芭蕉と与謝蕪村——ふたりの有名な俳句の達人がかかわった場所だよ。'},
  {t:'添水',r:'そうず',la:35.0488,ln:135.7978,s:17,
   d:'カコーン——竹が石を打つあの音。庭にある「ししおどし」のもとになったしくみが、ここにあるよ。'},
  {t:'詩',r:'し',la:35.0478,ln:135.7995,s:28,
   d:'中国の詩人36人の絵をかざった山の中の別荘。武将をやめた丈山が、90歳まで詩を書き続けた場所だよ。'},
  {t:'紅葉',r:'もみじ',la:35.0510,ln:135.7998,s:20,
   d:'緑の苔と赤いもみじが作る美しい景色。秋の朝、太陽の光にすけるもみじは最高にきれいだよ。'},
  {t:'苔',r:'こけ',la:35.0522,ln:135.7978,s:24,
   d:'地面いっぱいに広がる緑のじゅうたん。徳川家康が作った学校が、400年たって苔の庭になったんだ。'},
  {t:'狸',r:'たぬき',la:35.0530,ln:135.8015,s:22,
   d:'250段の石段を登ると、たくさんのたぬきの焼き物がお出迎え。がんを治すお祈りで有名な山のお寺だよ。'},
  {t:'火',r:'ひ',la:35.0545,ln:135.7995,s:26,
   d:'毎年7月、お坊さんが燃える炭の上をはだしで歩くよ。見ているだけでドキドキする行事だよ。'},
  {t:'羊羹',r:'ようかん',la:35.0458,ln:135.7920,s:16,
   d:'1937年から続く和菓子屋さん。やさしい甘さのでっち羊羹がおいしいよ。ラーメンだけがこの街の名物じゃないんだ。'},
  {t:'廃寺',r:'はいじ',la:35.0402,ln:135.7925,s:15,
   d:'「一乗寺」という地名のもとになったお寺は、1335年に焼けてなくなった。700年たった今も名前だけが残っているよ。'}
];

/* ─── Map ─── */
var map=L.map('map',{
  center:[35.0480,135.7940],
  zoom:16,
  zoomControl:false,
  attributionControl:true,
  zoomSnap:0.5,
  maxZoom:18,
  minZoom:15,
  maxBounds:[[35.033,135.778],[35.060,135.810]]
});

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',{
  attribution:'&copy; Esri &copy; OSM',
  maxZoom:19
}).addTo(map);

/* subtle boundary */
L.polygon([
  [35.0540,135.7878],[35.0540,135.7928],[35.0528,135.8042],
  [35.0448,135.8028],[35.0378,135.8012],
  [35.0358,135.7948],[35.0358,135.7868],
  [35.0432,135.7828],[35.0515,135.7855]
],{
  color:'rgba(160,140,110,0.15)',weight:1.5,
  fill:true,fillColor:'rgba(160,140,110,0.02)',fillOpacity:1,
  interactive:false
}).addTo(map);

/* ─── Place words ─── */
var barEl=document.getElementById('bar');
var bwEl=document.getElementById('bw');
var bdEl=document.getElementById('bd');
var curOn=null;

W.forEach(function(w){
  var cw=w.s*1.15;
  var tw=w.t.length*cw+(w.t.length-1)*4;
  var icon=L.divIcon({
    html:'<div class="w" style="font-size:'+w.s+'px">'+rb(w.t,w.r)+'</div>',
    className:'',
    iconSize:[tw+24,w.s+20],
    iconAnchor:[(tw+24)/2,(w.s+20)/2]
  });
  var m=L.marker([w.la,w.ln],{icon:icon,interactive:true,keyboard:false}).addTo(map);

  m.on('mouseover',function(){show(m,w)});
  m.on('mouseout',function(){hide(m)});
  m.on('click',function(e){
    L.DomEvent.stopPropagation(e);
    if(curOn===getW(m)){hide(m)} else {show(m,w)}
  });
});

function getW(m){return m.getElement()?m.getElement().querySelector('.w'):null}

function show(m,w){
  var el=getW(m);if(!el)return;
  if(curOn&&curOn!==el)curOn.classList.remove('on');
  curOn=el;
  el.classList.add('on');
  document.body.classList.add('focus');
  bwEl.innerHTML=rb(w.t,w.r);
  bdEl.textContent=w.d;
  barEl.classList.add('show');
}

function hide(m){
  var el=getW(m);if(!el)return;
  el.classList.remove('on');
  if(curOn===el){
    curOn=null;
    document.body.classList.remove('focus');
    barEl.classList.remove('show');
  }
}

/* tap away to dismiss (mobile) */
map.on('click',function(){
  if(curOn){
    curOn.classList.remove('on');
    curOn=null;
    document.body.classList.remove('focus');
    barEl.classList.remove('show');
  }
});
</script>
</body>
</html>
